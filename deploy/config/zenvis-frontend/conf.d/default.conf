server {
    listen 11000;
    listen [::]:11000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 300m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /amis/page.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /amis/app.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /amis/sdk-v6.7.0/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /amis/sdk/ {
        alias /usr/share/nginx/html/amis/sdk-v6.7.0/;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/amis/js/(axios\.min|history|vue)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /zenvis/ {
        rewrite ^/zenvis(.*)$ $1 break;
        proxy_pass http://zenvis-backend:11001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
