x-common: &common
  restart: unless-stopped
  networks:
    - zenvis-network

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 100m
    max-file: "3"

services:
  kafka-service:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/apache-kafka:4.2.0-${ARCH:?ARCH is required}
    container_name: kafka-service
    user: "0:0"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
    ports:
      - "${ZENVIS_INFRA_BIND_ADDRESS}:9094:9094"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/kafka/kafka-logs:/tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  redis-service:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/redis:7-${ARCH:?ARCH is required}
    container_name: redis-signal
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${ZENVIS_INFRA_BIND_ADDRESS}:6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/redis/redis.conf:/usr/local/redis/redis.conf:ro
      - ./data/redis/data:/data
    command:
      - /bin/sh
      - -ec
      - exec redis-server /usr/local/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis-stack-service:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/redis-stack-server:7.2.0-v18-${ARCH:?ARCH is required}
    container_name: redis-stack-signal
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${ZENVIS_INFRA_BIND_ADDRESS}:16379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/redis-stack/redis-stack.conf:/etc/redis-stack.conf:ro
      - ./data/redis-stack/data:/data
    command:
      - /bin/sh
      - -ec
      - exec redis-server /etc/redis-stack.conf --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging

  mysql-service:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/mysql:8.4-${ARCH:?ARCH is required}
    container_name: mysql8
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zenvis}
      MYSQL_USER: ${MYSQL_USER:-zenvis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "${ZENVIS_INFRA_BIND_ADDRESS}:3306:3306"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/mysql/data:/var/lib/mysql:rw
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/zenvis.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging: *default-logging

  clickhouse-service:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/clickhouse-server:25.9-${ARCH:?ARCH is required}
    container_name: clickhouse-service
    hostname: clickhouse-service
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-zenvis}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${ZENVIS_INFRA_BIND_ADDRESS}:8123:8123"
      - "${ZENVIS_INFRA_BIND_ADDRESS}:9000:9000"
      - "${ZENVIS_INFRA_BIND_ADDRESS}:9009:9009"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/clickhouse/logs:/var/log/clickhouse-server
      - ./data/clickhouse/data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "5"

  zenvis-backend:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/zenvis-backend:${ZENVIS_VERSION:-latest}-${ARCH:?ARCH is required}
    container_name: zenvis-backend
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?API_BEARER_TOKEN is required}
      API_BEARER_USER: ${API_BEARER_USER:-admin@admin.com}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?MCP_BEARER_TOKEN is required}
      VECTUM_AUTH_TOKEN: ${VECTUM_AUTH_TOKEN:?VECTUM_AUTH_TOKEN is required}
      ZENVIS_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${ZENVIS_BOOTSTRAP_SUPER_ADMIN_PASSWORD:?bootstrap password is required}
      ZENVIS_BOOTSTRAP_ADMIN_PASSWORD: ${ZENVIS_BOOTSTRAP_ADMIN_PASSWORD:?bootstrap password is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      APP_AI_EMBEDDING_ENABLED: ${APP_AI_EMBEDDING_ENABLED:-false}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      OPENAI_COMPLETION_URL: ${OPENAI_COMPLETION_URL:-}
      OPENAI_COMPLETION_MODEL: ${OPENAI_COMPLETION_MODEL:-}
    ports:
      - "${ZENVIS_API_BIND_ADDRESS}:${ZENVIS_API_PORT}:11001"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/zenvis-backend/config/application.properties:/app/application.properties:ro
      - ./open_config:/config/open_config
    depends_on:
      redis-service:
        condition: service_healthy
      redis-stack-service:
        condition: service_healthy
      mysql-service:
        condition: service_healthy
      clickhouse-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11001/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "5"

  vectum-service:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/vectum:${ZENVIS_VERSION:-latest}-${ARCH:?ARCH is required}
    container_name: vectum-service
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VECTUM_AUTH_TOKEN: ${VECTUM_AUTH_TOKEN:?VECTUM_AUTH_TOKEN is required}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?API_BEARER_TOKEN is required}
      ZENVIS_BUSINESS_SERVICE_BASE_URL: ${ZENVIS_BUSINESS_SERVICE_BASE_URL:-http://zenvis-backend:11001}
      ZENVIS_BUSINESS_SERVICE_INSTANCE_ID: ${ZENVIS_BUSINESS_SERVICE_INSTANCE_ID:-}
      VECTUM_VECTOR_ALLOWED_ENV: CLICKHOUSE_PASSWORD,KAFKA_BOOTSTRAP_SERVERS,CLICKHOUSE_ENDPOINT,CLICKHOUSE_DATABASE,CLICKHOUSE_USER,API_BEARER_TOKEN,ZENVIS_BUSINESS_SERVICE_BASE_URL
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_ENDPOINT: http://clickhouse-service:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-zenvis}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      KAFKA_BOOTSTRAP_SERVERS: kafka-service:9092
    ports:
      - "${ZENVIS_INFRA_BIND_ADDRESS}:${VECTUM_PORT}:11002"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/vectum/workspace:/workspace
      - ./data/vectum/vector:/var/lib/vector
    depends_on:
      kafka-service:
        condition: service_healthy
      clickhouse-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "5"

  zenvis-frontend:
    <<: *common
    image: ${ZENVIS_IMAGE_REGISTRY:?run ./zenvisctl compose init}/zenvis-frontend:${ZENVIS_VERSION:-latest}-${ARCH:?ARCH is required}
    container_name: zenvis-frontend
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ZENVIS_WEB_BIND_ADDRESS}:${ZENVIS_WEB_PORT}:11000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/zenvis-frontend/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      zenvis-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

networks:
  zenvis-network:
    driver: bridge
