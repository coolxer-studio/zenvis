apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zenvis.fullname" . }}-backend
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "zenvis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "zenvis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/open-config-seed: {{ .Values.openConfig.seedChecksum | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: seed-open-config
          image: {{ .Values.global.utilityImage | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              marker=/config/open_config/.zenvis-seed-checksum
              current="$(cat "$marker" 2>/dev/null || true)"
              if [ "$current" != "$SEED_CHECKSUM" ]; then
                mkdir -p /config/open_config
                for archive in /seed/assets/seed.tgz /seed/schema/seed.tgz /seed/defaults/seed.tgz; do
                  tar -xzf "$archive" -C /config/open_config --strip-components=2
                done
                printf '%s\n' "$SEED_CHECKSUM" > "$marker"
              fi
          env:
            - name: SEED_CHECKSUM
              value: {{ .Values.openConfig.seedChecksum | quote }}
          volumeMounts:
            - name: open-config
              mountPath: /config/open_config
            - name: seed-assets
              mountPath: /seed/assets
              readOnly: true
            - name: seed-schema
              mountPath: /seed/schema
              readOnly: true
            - name: seed-defaults
              mountPath: /seed/defaults
              readOnly: true
      containers:
        - name: backend
          image: {{ include "zenvis.image" (dict "root" . "repository" .Values.backend.image.repository) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 11001
          envFrom:
            - secretRef:
                name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: MYSQL_JDBC_URL
              value: {{ printf "jdbc:mysql://%s:%v/%s?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=true&createDatabaseIfNotExist=true" (include "zenvis.mysqlHost" .) .Values.external.mysql.port .Values.external.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.external.mysql.user | quote }}
            - name: CLICKHOUSE_JDBC_URL
              value: {{ printf "jdbc:clickhouse://%s:%v/%s?use_time_zone=Asia/Shanghai&use_server_time_zone=Asia/Shanghai&output_format_json_named_tuples_as_objects=1&createDatabaseIfNotExist=true" (include "zenvis.clickhouseHost" .) .Values.external.clickhouse.httpPort .Values.external.clickhouse.database | quote }}
            - name: CLICKHOUSE_HTTP_URL
              value: {{ printf "http://%s:%v" (include "zenvis.clickhouseHost" .) .Values.external.clickhouse.httpPort | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.external.clickhouse.user | quote }}
            - name: REDIS_HOST
              value: {{ include "zenvis.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.external.redis.port | quote }}
            - name: REDIS_STACK_HOST
              value: {{ include "zenvis.redisStackHost" . | quote }}
            - name: REDIS_STACK_PORT
              value: {{ .Values.external.redisStack.port | quote }}
            - name: VECTUM_URL
              value: {{ printf "http://%s-vectum:11002" (include "zenvis.fullname" .) | quote }}
            - name: ZENVIS_OPEN_CONFIG_PATH
              value: /config/open_config
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: open-config
              mountPath: /config/open_config
      volumes:
        - name: open-config
          persistentVolumeClaim:
            claimName: {{ include "zenvis.fullname" . }}-open-config
        - name: seed-assets
          configMap:
            name: {{ .Values.openConfig.seedConfigMaps.assets }}
        - name: seed-schema
          configMap:
            name: {{ .Values.openConfig.seedConfigMaps.schema }}
        - name: seed-defaults
          configMap:
            name: {{ .Values.openConfig.seedConfigMaps.defaults }}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.global.arch }}
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenvis.fullname" . }}-backend
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "zenvis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 11001
      targetPort: http
