{{- if .Values.embedded.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenvis.fullname" . }}-kafka
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  selector:
    {{- include "zenvis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  ports:
    - {name: broker, port: 9092, targetPort: broker}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zenvis.fullname" . }}-kafka
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ include "zenvis.fullname" . }}-kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "zenvis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "zenvis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      containers:
        - name: kafka
          image: {{ printf "%s/apache-kafka:4.2.0-%s" .Values.global.imageRegistry .Values.global.arch }}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "controller,broker"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ include "zenvis.fullname" . }}-kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@{{ include "zenvis.fullname" . }}-kafka:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: "/tmp/kafka-logs"}
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: KAFKA_CLUSTER_ID
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /tmp/kafka-logs}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.global.arch }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "zenvis.storageClass" . | nindent 8 }}
        resources:
          requests: {storage: {{ .Values.persistence.kafka.size }}}
{{- end }}
