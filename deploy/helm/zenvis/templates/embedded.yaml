{{- if .Values.embedded.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenvis.fullname" . }}-mysql
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  selector:
    {{- include "zenvis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zenvis.fullname" . }}-mysql
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ include "zenvis.fullname" . }}-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "zenvis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        {{- include "zenvis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: {{ printf "%s/mysql:8.4-%s" .Values.global.imageRegistry .Values.global.arch }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.external.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.external.mysql.user | quote }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MYSQL_PASSWORD
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      nodeSelector:
        kubernetes.io/arch: {{ .Values.global.arch }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "zenvis.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.persistence.mysql.size }}
---
{{- end }}
{{- if .Values.embedded.clickhouse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenvis.fullname" . }}-clickhouse
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  selector:
    {{- include "zenvis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zenvis.fullname" . }}-clickhouse
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "zenvis.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "zenvis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "zenvis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: {{ printf "%s/clickhouse-server:25.9-%s" .Values.global.imageRegistry .Values.global.arch }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          env:
            - {name: TZ, value: {{ .Values.global.timezone | quote }}}
            - {name: CLICKHOUSE_DB, value: {{ .Values.external.clickhouse.database | quote }}}
            - {name: CLICKHOUSE_USER, value: {{ .Values.external.clickhouse.user | quote }}}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CLICKHOUSE_PASSWORD
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.global.arch }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "zenvis.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.persistence.clickhouse.size }}
---
{{- end }}
{{- if .Values.embedded.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenvis.fullname" . }}-redis
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "zenvis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zenvis.fullname" . }}-redis
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "zenvis.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "zenvis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "zenvis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ printf "%s/redis:7-%s" .Values.global.imageRegistry .Values.global.arch }}
          command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - {name: redis, containerPort: 6379}
          envFrom:
            - secretRef: {name: {{ .Values.secrets.existingSecret }}}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.global.arch }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "zenvis.storageClass" . | nindent 8 }}
        resources:
          requests: {storage: {{ .Values.persistence.redis.size }}}
---
{{- end }}
