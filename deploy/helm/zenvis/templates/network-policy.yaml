{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zenvis.fullname" . }}-default-deny-ingress
  labels:
    {{- include "zenvis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zenvis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "zenvis.selectorLabels" . | nindent 14 }}
    - ports:
        - {protocol: TCP, port: 11000}
{{- end }}
