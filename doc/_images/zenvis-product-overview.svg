<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1050"
  viewBox="0 0 1600 1050"
  role="img"
  aria-labelledby="overview-title overview-description"
>
  <title id="overview-title">ZenVis 产品全景图</title>
  <desc id="overview-description">
    ZenVis 将多源数据和业务能力接入配置驱动的平台，经过 Meta 与存储、统一检索与统计、可视化应用和 AI 分析，输出检索、看板、低代码应用、业务 Agent、报表和业务服务运行视图。插件、权限审计、平台管理和开放集成贯穿整个平台。
  </desc>

  <defs>
    <linearGradient id="page-background" x1="160" y1="0" x2="1440" y2="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f9ff" />
      <stop offset="0.52" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f2f8ff" />
    </linearGradient>
    <linearGradient id="brand-gradient" x1="130" y1="330" x2="1470" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0759d9" />
      <stop offset="0.55" stop-color="#0789e8" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="plugin-gradient" x1="180" y1="575" x2="1420" y2="635" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edf4ff" />
