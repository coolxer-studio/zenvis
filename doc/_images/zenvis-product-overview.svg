      <path d="M0 0L10 5L0 10Z" fill="#3187e5" />
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ffffff" />
