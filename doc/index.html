<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ZenVis 文档中心</title>
    <link rel="icon" href="_images/logo.png" type="image/png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="keywords"
      content="ZenVis,数据分析,配置化应用框架,数据接入,元数据管理,统一检索,统计分析,数据可视化,低代码,插件扩展,DIH,AI Agent,MCP,ClickHouse"
    />
    <meta
      name="description"
      content="ZenVis 是面向企业数据分析场景的配置化应用框架，统一提供数据接入、元数据管理、检索统计、可视化应用、插件扩展和 AI 智能分析能力。"
    />
    <meta property="og:title" content="ZenVis 文档中心" />
    <meta
      property="og:description"
      content="通过配置与插件连接数据接入、统一检索、可视化应用和 AI 分析。"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
      title="vue"
    />
    <link
      rel="stylesheet"
      href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/dark.css"
      title="dark"
      disabled
    />
    <link
      rel="stylesheet"
      href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/buble.css"
      title="buble"
      disabled
    />
    <link
      rel="stylesheet"
      href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/pure.css"
      title="pure"
      disabled
    />
    <link
      rel="stylesheet"
      href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/dolphin.css"
      title="dolphin"
      disabled
    />
    <style>
      nav.app-nav li ul {
        min-width: 100px;
      }
      #carbonads {
        display:none;
        box-shadow: none !important;
        width: auto !important;
      }
      
      #carbonads_1 {
        display:none;
        box-shadow: none !important;
        width: auto !important;
      }
    </style>
  </head>

  <body>
    <div id="app">正在加载 ZenVis 文档...</div>
    <script src="//fastly.jsdelivr.net/npm/docsify-plugin-carbon@1"></script>
    <script>
      // Docsify configuration
      window.$docsify = {
        name: 'ZenVis',
        nameLink: '/',
        auto2top: true,
        coverpage: true,
        executeScript: true,
        loadSidebar: true,
        loadNavbar: true,
        mergeNavbar: true,
        maxLevel: 2,
        subMaxLevel: 1,
        ga: 'UA-106147152-1',
        matomo: {
          host: '//matomo.thunderwave.de',
          id: 6,
        },
        search: {
          noData: '未找到相关文档',
          paths: 'auto',
          placeholder: '搜索 ZenVis 文档',
        },
        plugins: [
          DocsifyCarbon.create('CEBI6KQE', 'docsifyjsorg'),
          function (hook, vm) {
            hook.beforeEach(function (html) {
              return (
                html +
                '\n\n----\n\n' +
                '<a href="https://www.coolxer.com" target="_blank" rel="noopener" style="color: inherit; font-weight: normal; text-decoration: none;">Powered by CoolXer</a>'
              );
            })
          },
        ],
      };
    </script>
    <script src="//fastly.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-nginx.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
    <script src="//fastly.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
    <!-- <script src="//fastly.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script> -->
  </body>
</html>
