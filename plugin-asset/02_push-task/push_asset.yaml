tests:
  - name: "合法主机样例应完成补充并进入主机分支"
    inputs:
      - insert_at: "parse_asset_sample"
        type: "log"
        log_fields:
          message: '{"asset_type":"asset_host","source":"MANUAL","type":"BUSINESS","owner":"ENTERPRISE","status":"ONLINE","area_code":"100010","country":"CN","province":"北京市","city":"北京市","county":"海淀区","label":["服务器","核心业务"],"access":1,"level":"IMPORTANT","risk":"HIGH","risk_info":"未安装最新安全补丁","info":{},"net_type":"ETHERNET","lan_ip":"192.168.10.1","wan_ip":"43.129.10.1","room":"A1-101","cabinet_no":"C12","position_no":"U20-22","manufacturer":"Dell","model":"PowerEdge R740","architecture":"x86_64","system_name":"CentOS","system_version":"7.9","cpu_model":"Intel Xeon Gold 6248R","cpu_cores":48,"memory_size":256,"disk_size":4000}'
    outputs:
      - extract_from: "route_asset_sample.asset_host"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.asset_type, "asset_host")
              assert!(is_string(.id))
              assert!(is_string(.update_time))
              assert!(is_string(.insert_time))
              true

  - name: "非法 JSON 应进入 dropped 并保留原文"
    inputs:
      - insert_at: "parse_asset_sample"
        type: "log"
        log_fields:
          message: "{not-json"
    outputs:
      - extract_from: "parse_asset_sample.dropped"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(to_string!(.message), "{not-json")
              assert!(contains(to_string!(.metadata.dropped.message), "合法 JSON"))
              true
