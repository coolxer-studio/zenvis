transforms:
  parse_asset_sample:
    type: "remap"
    inputs:
      - "generator_asset_samples"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_message = to_string(.message) ?? ""
      parsed, parse_error = parse_json(raw_message)
      assert_eq!(parse_error, null, message: "资产模拟数据必须是合法 JSON")
      assert!(is_object(parsed), message: "资产模拟数据 JSON 根节点必须是对象")
      . = object!(parsed)
      assert!(
        .asset_type == "asset_host" ||
        .asset_type == "asset_pc" ||
        .asset_type == "asset_iot" ||
        .asset_type == "asset_mobile" ||
        .asset_type == "asset_probe" ||
        .asset_type == "asset_app" ||
        .asset_type == "asset_service" ||
        .asset_type == "asset_api" ||
        .asset_type == "asset_log" ||
        .asset_type == "asset_file",
        message: "资产模拟数据 asset_type 不受支持"
      )
      .id = uuid_v4()
      current_time = format_timestamp!(now(), format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "Asia/Shanghai")
      .update_time = current_time
      .insert_time = current_time

  route_asset_sample:
    type: "route"
    inputs:
      - "parse_asset_sample"
    route:
      asset_host: '.asset_type == "asset_host"'
      asset_pc: '.asset_type == "asset_pc"'
      asset_iot: '.asset_type == "asset_iot"'
      asset_mobile: '.asset_type == "asset_mobile"'
      asset_probe: '.asset_type == "asset_probe"'
      asset_app: '.asset_type == "asset_app"'
      asset_service: '.asset_type == "asset_service"'
      asset_api: '.asset_type == "asset_api"'
      asset_log: '.asset_type == "asset_log"'
      asset_file: '.asset_type == "asset_file"'

  prepare_asset_host:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_host"
    source: |-
      del(.asset_type)

  prepare_asset_pc:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_pc"
    source: |-
      del(.asset_type)

  prepare_asset_iot:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_iot"
    source: |-
      if is_null(.battery_level) {
        .battery_level = 0
      }
      del(.asset_type)

  prepare_asset_mobile:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_mobile"
    source: |-
      del(.asset_type)

  prepare_asset_probe:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_probe"
    source: |-
      del(.asset_type)

  prepare_asset_app:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_app"
    source: |-
      del(.asset_type)

  prepare_asset_service:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_service"
    source: |-
      del(.asset_type)

  prepare_asset_api:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_api"
    source: |-
      del(.asset_type)

  prepare_asset_log:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_log"
    source: |-
      del(.asset_type)

  prepare_asset_file:
    type: "remap"
    inputs:
      - "route_asset_sample.asset_file"
    source: |-
      del(.asset_type)

sinks:
  asset_sample_invalid_console:
    type: "console"
    inputs:
      - "parse_asset_sample.dropped"
      - "route_asset_sample._unmatched"
    encoding:
      codec: "json"

  asset_host_clickhouse:
    type: "clickhouse"
    inputs:
      - "prepare_asset_host"
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse-service:8123}"
    database: "${CLICKHOUSE_DATABASE:-zenvis}"
    table: "asset_host"
    format: "json_each_row"
    compression: "gzip"
    date_time_best_effort: true
    auth:
      strategy: "basic"
      user: "${CLICKHOUSE_USER:-default}"
      password: "${CLICKHOUSE_PASSWORD:-SFGEfSVVMcUHCBCjKmzJ}"
    skip_unknown_fields: false
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"
    request:
      retry_attempts: 10
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 300
      timeout_secs: 30
    healthcheck:
      enabled: true

  asset_pc_clickhouse:
