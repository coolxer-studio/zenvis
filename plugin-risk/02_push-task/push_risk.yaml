tests:
  - name: "合法样例应完成补充并进入 risk_event 分支"
    inputs:
      - insert_at: "parse_risk_sample"
        type: "log"
        log_fields:
          message: '{"risk_type":"risk_event","user_id":"user001","start_id":"start001","asset_id":"asset001","type":"恶意软件","detail":"检测到恶意软件活动","label":["安全","高危"],"risk_level":"HIGH","net_type":"WIFI","lan_ip":"192.168.1.10","wan_ip":"43.129.1.10"}'
    outputs:
      - extract_from: "route_risk_sample.risk_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.risk_type, "risk_event")
              assert!(is_string(.id))
              assert!(is_string(.update_time))
              assert!(is_string(.insert_time))
              true

  - name: "非法 JSON 应进入 dropped 并保留原文"
    inputs:
      - insert_at: "parse_risk_sample"
        type: "log"
        log_fields:
          message: "{not-json"
    outputs:
      - extract_from: "parse_risk_sample.dropped"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(to_string!(.message), "{not-json")
              assert!(contains(to_string!(.metadata.dropped.message), "合法 JSON"))
              true
