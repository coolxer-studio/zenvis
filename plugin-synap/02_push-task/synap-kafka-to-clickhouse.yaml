---
sources:
  synap_agent_kafka:
    type: "kafka"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    group_id: "${SYNAP_KAFKA_GROUP_ID:-zenvis-plugin-synap-agent-message-v2}"
    topics:
      - "${SYNAP_KAFKA_TOPIC_PATTERN:-^(android|h5|ios|host|wechat)_fact_.*$}"
    auto_offset_reset: "earliest"
    decoding:
      codec: "bytes"
    topic_key: "topic"
    partition_key: "partition"
    offset_key: "offset"

transforms:
  map_synap_agent_message:
    type: "remap"
    inputs:
      - "synap_agent_kafka"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_message = to_string(.message) ?? ""
      assert!(raw_message != "", message: "探针消息 message 不能为空")

      parsed_event, event_parse_error = parse_json(raw_message)
      assert_eq!(event_parse_error, null, message: "探针消息 message 必须是合法 JSON")
      assert!(is_object(parsed_event), message: "探针消息 JSON 根节点必须是对象")
      event = object!(parsed_event)

      assert!(is_object(event.fact), message: "探针消息 fact 必须是 JSON 对象")
      fact_object = object!(event.fact)
      assert!(is_object(fact_object.common), message: "探针消息 fact.common 必须是 JSON 对象")
      common = object!(fact_object.common)

      guid = strip_whitespace(to_string(common.guid) ?? "")
      assert!(guid != "", message: "探针消息 fact.common.guid 不能为空")

      raw_start_id = strip_whitespace(to_string(common.start_id) ?? "")
      start_id_value, start_id_error = to_int(raw_start_id)
      assert_eq!(start_id_error, null, message: "探针消息 fact.common.start_id 必须是正整数")
      start_id = start_id_value
      assert!(start_id > 0, message: "探针消息 fact.common.start_id 必须大于 0")

      fact_type = strip_whitespace(to_string(fact_object.type) ?? "")
      assert!(fact_type != "", message: "探针消息 fact.type 不能为空")

      raw_client_time = strip_whitespace(to_string(common.client_time) ?? "")
      assert!(raw_client_time != "", message: "探针消息 fact.common.client_time 不能为空")
      client_timestamp = if match(raw_client_time, r'^-?[0-9]+$') {
        client_epoch_value, client_epoch_value_error = to_int(raw_client_time)
        assert_eq!(client_epoch_value_error, null, message: "探针消息 fact.common.client_time Unix 时间戳不合法")
        client_epoch = client_epoch_value
        client_epoch_timestamp, client_epoch_error = if client_epoch > 9999999999 || client_epoch < -9999999999 {
          from_unix_timestamp(client_epoch, unit: "milliseconds")
        } else {
          from_unix_timestamp(client_epoch, unit: "seconds")
        }
        assert_eq!(client_epoch_error, null, message: "探针消息 fact.common.client_time Unix 时间戳超出范围")
        client_epoch_timestamp
      } else {
        client_rfc3339, client_rfc3339_error = parse_timestamp(raw_client_time, format: "%+")
        client_millis, client_millis_error = parse_timestamp(
          raw_client_time,
          format: "%Y-%m-%d %H:%M:%S%.3f",
          timezone: "Asia/Shanghai"
        )
        client_seconds, client_seconds_error = parse_timestamp(
          raw_client_time,
          format: "%Y-%m-%d %H:%M:%S",
          timezone: "Asia/Shanghai"
        )
        assert!(
          client_rfc3339_error == null || client_millis_error == null || client_seconds_error == null,
          message: "探针消息 fact.common.client_time 必须是 Unix 秒/毫秒、RFC3339 或 yyyy-MM-dd HH:mm:ss[.SSS]"
        )
        if client_rfc3339_error == null {
          client_rfc3339
        } else if client_millis_error == null {
          client_millis
        } else {
          client_seconds
        }
      }

      raw_app_id = strip_whitespace(to_string(common.app_id) ?? "")
      app_id = if raw_app_id == "" {
        null
      } else {
        app_id_value, app_id_error = to_int(raw_app_id)
        assert_eq!(app_id_error, null, message: "探针消息 fact.common.app_id 必须是非负整数")
        parsed_app_id = app_id_value
        assert!(
          parsed_app_id >= 0 && parsed_app_id <= 4294967295,
          message: "探针消息 fact.common.app_id 必须在 UInt32 范围内"
        )
        parsed_app_id
      }

      raw_latitude = strip_whitespace(to_string(common.latitude) ?? "")
      latitude = if raw_latitude == "" {
        null
      } else {
        latitude_value, latitude_error = to_float(raw_latitude)
        assert_eq!(latitude_error, null, message: "探针消息 fact.common.latitude 必须是数字")
        parsed_latitude = latitude_value
        assert!(
          parsed_latitude >= -90.0 && parsed_latitude <= 90.0,
          message: "探针消息 fact.common.latitude 必须在 -90 到 90 之间"
        )
        parsed_latitude
      }

      raw_longitude = strip_whitespace(to_string(common.longitude) ?? "")
      longitude = if raw_longitude == "" {
        null
      } else {
        longitude_value, longitude_error = to_float(raw_longitude)
        assert_eq!(longitude_error, null, message: "探针消息 fact.common.longitude 必须是数字")
        parsed_longitude = longitude_value
        assert!(
          parsed_longitude >= -180.0 && parsed_longitude <= 180.0,
          message: "探针消息 fact.common.longitude 必须在 -180 到 180 之间"
        )
        parsed_longitude
      }

      source_topic = strip_whitespace(to_string(.topic) ?? "")
      assert!(source_topic != "", message: "探针消息 Kafka topic 元数据不能为空")

      source_partition_value, source_partition_error = to_int(.partition)
      assert_eq!(source_partition_error, null, message: "探针消息 Kafka partition 必须是非负整数")
      source_partition = source_partition_value
      assert!(
        source_partition >= 0 && source_partition <= 4294967295,
        message: "探针消息 Kafka partition 必须在 UInt32 范围内"
      )

      source_offset_value, source_offset_error = to_int(.offset)
      assert_eq!(source_offset_error, null, message: "探针消息 Kafka offset 必须是非负整数")
      source_offset = source_offset_value
      assert!(source_offset >= 0, message: "探针消息 Kafka offset 必须是非负整数")

      kafka_timestamp_value = if is_timestamp(.timestamp) {
        .timestamp
      } else {
        raw_kafka_timestamp = strip_whitespace(to_string(.timestamp) ?? "")
        if raw_kafka_timestamp == "" {
          now()
        } else {
          kafka_timestamp_parsed, kafka_timestamp_error = parse_timestamp(
            raw_kafka_timestamp,
            format: "%+"
          )
          assert_eq!(
            kafka_timestamp_error,
            null,
            message: "探针消息 Kafka timestamp 必须是 RFC3339 时间"
          )
          kafka_timestamp_parsed
        }
      }

      raw_server_time = strip_whitespace(to_string(event.server_time) ?? "")
      server_timestamp = if raw_server_time == "" {
        kafka_timestamp_value
      } else if match(raw_server_time, r'^-?[0-9]+$') {
        server_epoch_value, server_epoch_value_error = to_int(raw_server_time)
        assert_eq!(server_epoch_value_error, null, message: "探针消息 server_time Unix 时间戳不合法")
        server_epoch = server_epoch_value
        server_epoch_timestamp, server_epoch_error = if server_epoch > 9999999999 || server_epoch < -9999999999 {
          from_unix_timestamp(server_epoch, unit: "milliseconds")
        } else {
          from_unix_timestamp(server_epoch, unit: "seconds")
        }
        assert_eq!(server_epoch_error, null, message: "探针消息 server_time Unix 时间戳超出范围")
        server_epoch_timestamp
      } else {
        server_rfc3339, server_rfc3339_error = parse_timestamp(raw_server_time, format: "%+")
        server_millis, server_millis_error = parse_timestamp(
          raw_server_time,
          format: "%Y-%m-%d %H:%M:%S%.3f",
          timezone: "Asia/Shanghai"
        )
        server_seconds, server_seconds_error = parse_timestamp(
          raw_server_time,
          format: "%Y-%m-%d %H:%M:%S",
          timezone: "Asia/Shanghai"
        )
        assert!(
          server_rfc3339_error == null || server_millis_error == null || server_seconds_error == null,
          message: "探针消息 server_time 必须是 Unix 秒/毫秒、RFC3339 或 yyyy-MM-dd HH:mm:ss[.SSS]"
        )
        if server_rfc3339_error == null {
          server_rfc3339
        } else if server_millis_error == null {
          server_millis
        } else {
          server_seconds
        }
      }

      agenda_tags = []
      agendas = []
      if event.agendas != null {
        assert!(is_array(event.agendas), message: "探针消息 agendas 必须是 JSON 数组")
        for_each(array!(event.agendas)) -> |index, value| {
          assert!(is_object(value), message: "探针消息 agendas 每一项必须是 JSON 对象")
          agenda = object!(value)
          agenda_tag = strip_whitespace(to_string(agenda.tag) ?? "")
          agenda_level = strip_whitespace(to_string(agenda.level) ?? "")
          assert!(agenda_tag != "", message: "探针消息 agendas[].tag 不能为空")
          assert!(agenda_level != "", message: "探针消息 agendas[].level 不能为空")
          agenda_tags = push(agenda_tags, agenda_tag + ":" + agenda_level)
          agendas = push(agendas, encode_json(value))
        }
      }

      punish_types = []
      punishes = []
      if event.punishes != null {
        assert!(is_array(event.punishes), message: "探针消息 punishes 必须是 JSON 数组")
        for_each(array!(event.punishes)) -> |index, value| {
          assert!(is_object(value), message: "探针消息 punishes 每一项必须是 JSON 对象")
          punish = object!(value)
          assert!(is_object(punish.action), message: "探针消息 punishes[].action 必须是 JSON 对象")
          action = object!(punish.action)
          raw_punish_type = strip_whitespace(to_string(action.type) ?? "")
          punish_type_value, punish_type_error = to_int(raw_punish_type)
          assert_eq!(punish_type_error, null, message: "探针消息 punishes[].action.type 必须是 UInt8 整数")
          punish_type = punish_type_value
          assert!(
            punish_type >= 0 && punish_type <= 255,
            message: "探针消息 punishes[].action.type 必须在 UInt8 范围内"
          )
          punish_types = push(punish_types, punish_type)
          punishes = push(punishes, encode_json(value))
        }
      }

      raw_observed_at = strip_whitespace(to_string(fact_object.observed_at) ?? "")
      observed_at = if raw_observed_at == "" {
        null
      } else {
        observed_at_value, observed_at_error = to_int(raw_observed_at)
        assert_eq!(observed_at_error, null, message: "探针消息 fact.observed_at 必须是 Unix 毫秒整数")
        observed_at_timestamp, observed_at_timestamp_error = from_unix_timestamp(observed_at_value, unit: "milliseconds")
        assert_eq!(observed_at_timestamp_error, null, message: "探针消息 fact.observed_at Unix 毫秒时间超出范围")
        format_timestamp!(observed_at_timestamp, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "Asia/Shanghai")
      }

      raw_sequence = strip_whitespace(to_string(fact_object.sequence) ?? "")
      sequence = if raw_sequence == "" {
        null
      } else {
        sequence_value, sequence_error = to_int(raw_sequence)
        assert_eq!(sequence_error, null, message: "探针消息 fact.sequence 必须是非负整数")
        assert!(sequence_value >= 0, message: "探针消息 fact.sequence 必须是非负整数")
        sequence_value
      }

      raw_server_received_at = strip_whitespace(to_string(fact_object.server_received_at) ?? "")
      server_received_at = if raw_server_received_at == "" {
        null
      } else {
        server_received_at_value, server_received_at_error = to_int(raw_server_received_at)
        assert_eq!(server_received_at_error, null, message: "探针消息 fact.server_received_at 必须是 Unix 毫秒整数")
        server_received_at_timestamp, server_received_at_timestamp_error = from_unix_timestamp(server_received_at_value, unit: "milliseconds")
        assert_eq!(server_received_at_timestamp_error, null, message: "探针消息 fact.server_received_at Unix 毫秒时间超出范围")
        format_timestamp!(server_received_at_timestamp, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "Asia/Shanghai")
      }

      raw_client_server_skew_ms = strip_whitespace(to_string(fact_object.client_server_skew_ms) ?? "")
      client_server_skew_ms = if raw_client_server_skew_ms == "" {
        null
      } else {
        client_server_skew_ms_value, client_server_skew_ms_error = to_int(raw_client_server_skew_ms)
        assert_eq!(client_server_skew_ms_error, null, message: "探针消息 fact.client_server_skew_ms 必须是有符号毫秒整数")
        client_server_skew_ms_value
      }

      risk_detector_version = ""
      risk_rule_version = ""
      risk_score = null
      risk_confidence = null
      risk_reason_codes = []
      risk_evidence_count = null
      risk_observation = null
      risk_trust_level = ""
      if event.risk != null {
        assert!(is_object(event.risk), message: "探针消息 risk 必须是 JSON 对象或 null")
        risk = object!(event.risk)

        risk_detector_version = strip_whitespace(to_string(risk.detector_version) ?? "")
        assert!(risk_detector_version != "", message: "探针消息 risk.detector_version 不能为空")
        risk_rule_version = strip_whitespace(to_string(risk.rule_version) ?? "")
        assert!(risk_rule_version != "", message: "探针消息 risk.rule_version 不能为空")

        risk_score_value, risk_score_error = to_float(risk.score)
        assert_eq!(risk_score_error, null, message: "探针消息 risk.score 必须是 0 到 100 的数字")
        assert!(risk_score_value >= 0.0 && risk_score_value <= 100.0, message: "探针消息 risk.score 必须在 0 到 100 之间")
        risk_score = risk_score_value

        risk_confidence_value, risk_confidence_error = to_float(risk.confidence)
        assert_eq!(risk_confidence_error, null, message: "探针消息 risk.confidence 必须是 0 到 1 的数字")
        assert!(risk_confidence_value >= 0.0 && risk_confidence_value <= 1.0, message: "探针消息 risk.confidence 必须在 0 到 1 之间")
        risk_confidence = risk_confidence_value

        assert!(is_array(risk.reason_codes), message: "探针消息 risk.reason_codes 必须是字符串数组")
        for_each(array!(risk.reason_codes)) -> |index, value| {
          assert!(is_string(value), message: "探针消息 risk.reason_codes 每一项必须是字符串")
          reason_code = strip_whitespace(string!(value))
          assert!(reason_code != "", message: "探针消息 risk.reason_codes 不允许空字符串")
          risk_reason_codes = push(risk_reason_codes, reason_code)
        }

        risk_evidence_count_value, risk_evidence_count_error = to_int(risk.evidence_count)
        assert_eq!(risk_evidence_count_error, null, message: "探针消息 risk.evidence_count 必须是 UInt32 整数")
        assert!(
          risk_evidence_count_value >= 0 && risk_evidence_count_value <= 4294967295,
          message: "探针消息 risk.evidence_count 必须在 UInt32 范围内"
        )
        risk_evidence_count = risk_evidence_count_value

        assert!(is_boolean(risk.observation), message: "探针消息 risk.observation 必须是布尔值")
        risk_observation = risk.observation
        risk_trust_level = strip_whitespace(to_string(risk.trust_level) ?? "")
        assert!(risk_trust_level != "", message: "探针消息 risk.trust_level 不能为空")
      }

      fact_payload = fact_object
      del(fact_payload.common)

      . = {
        "source_topic": source_topic,
        "source_partition": source_partition,
        "source_offset": source_offset,
        "kafka_timestamp": format_timestamp!(kafka_timestamp_value, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "Asia/Shanghai"),
        "guid": guid,
        "start_id": start_id,
        "user_id": to_string(common.user_id) ?? "",
        "platform": to_string(common.platform) ?? "",
        "sdk_version": to_string(common.sdk_version) ?? "",
        "app_id": app_id,
        "app_name": to_string(common.app_name) ?? "",
        "app_package": to_string(common.app_package) ?? "",
        "app_version": to_string(common.app_version) ?? "",
        "manufacturer": to_string(common.manufacturer) ?? "",
        "model": to_string(common.model) ?? "",
        "system_name": to_string(common.system) ?? "",
        "system_version": to_string(common.system_version) ?? "",
        "net_type": to_string(common.net_type) ?? "",
        "lan_ip": strip_whitespace(to_string(common.lan_ip) ?? ""),
        "wan_ip": strip_whitespace(to_string(common.wan_ip) ?? ""),
        "latitude": latitude,
        "longitude": longitude,
        "country": to_string(common.country) ?? "",
        "province": to_string(common.province) ?? "",
        "city": to_string(common.city) ?? "",
        "county": to_string(common.county) ?? "",
        "thoroughfare": to_string(common.thoroughfare) ?? "",
        "client_time": format_timestamp!(client_timestamp, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "Asia/Shanghai"),
        "server_time": format_timestamp!(server_timestamp, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "Asia/Shanghai"),
        "rule": to_string(event.rule) ?? "",
        "fact_type": fact_type,
        "message_id": to_string(fact_object.message_id) ?? "",
        "batch_id": to_string(fact_object.batch_id) ?? "",
        "observed_at": observed_at,
        "sequence": sequence,
        "request_ip": strip_whitespace(to_string(fact_object.request_ip) ?? ""),
        "request_user_agent": to_string(fact_object.request_user_agent) ?? "",
        "request_origin": to_string(fact_object.request_origin) ?? "",
        "fetch_site": to_string(fact_object.fetch_site) ?? "",
        "fetch_mode": to_string(fact_object.fetch_mode) ?? "",
        "fetch_dest": to_string(fact_object.fetch_dest) ?? "",
        "transport_trust": to_string(fact_object.transport_trust) ?? "",
        "sequence_observation": to_string(fact_object.sequence_observation) ?? "",
        "server_received_at": server_received_at,
        "client_server_skew_ms": client_server_skew_ms,
        "request_asn": to_string(fact_object.request_asn) ?? "",
        "request_network_category": to_string(fact_object.request_network_category) ?? "",
        "request_tls_fingerprint": to_string(fact_object.request_tls_fingerprint) ?? "",
        "request_ip_reputation": to_string(fact_object.request_ip_reputation) ?? "",
        "risk_detector_version": risk_detector_version,
        "risk_rule_version": risk_rule_version,
        "risk_score": risk_score,
        "risk_confidence": risk_confidence,
        "risk_reason_codes": risk_reason_codes,
        "risk_evidence_count": risk_evidence_count,
        "risk_observation": risk_observation,
        "risk_trust_level": risk_trust_level,
        "fact": fact_payload,
        "agenda_tags": agenda_tags,
        "agendas": agendas,
        "punish_types": punish_types,
        "punishes": punishes,
        "raw_message": raw_message
      }

sinks:
  synap_agent_message_dead_letter:
    type: "kafka"
    inputs:
      - "map_synap_agent_message.dropped"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    topic: "${SYNAP_DLQ_TOPIC:-com.coolxer.plugin.synap.dead-letter}"
    compression: "zstd"
    encoding:
      codec: "json"
    librdkafka_options:
      request.required.acks: "-1"
      message.send.max.retries: "10"
      retry.backoff.ms: "1000"
    acknowledgements:
      enabled: true
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"

  synap_agent_message_clickhouse:
    type: "clickhouse"
    inputs:
      - "map_synap_agent_message"
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse-service:8123}"
    database: "${CLICKHOUSE_DATABASE:-zenvis}"
    table: "synap_agent_message"
    format: "json_each_row"
    compression: "gzip"
    date_time_best_effort: true
    auth:
      strategy: "basic"
      user: "${CLICKHOUSE_USER:-default}"
      password: "${CLICKHOUSE_PASSWORD}"
    skip_unknown_fields: false
    acknowledgements:
      enabled: true
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"
    request:
      retry_attempts: 10
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 300
      timeout_secs: 30
    healthcheck:
      enabled: true

tests:
  - name: "合法完整探针消息应映射为 63 个业务字段"
    inputs:
      - insert_at: "map_synap_agent_message"
        type: "log"
        log_fields:
          message: |-
            {"rule":"rule-001","server_time":"2026-07-30T02:00:01.123Z","agendas":[{"tag":"privacy","level":"high"}],"punishes":[{"action":{"type":2,"name":"block"}}],"fact":{"type":"device","common":{"guid":"device-001","start_id":1001,"client_time":1785376800123,"user_id":"user-001","sdk_version":"2.4.0","app_id":42,"app_name":"示例应用","app_package":"com.example.app","app_version":"3.2.1","platform":"android","manufacturer":"Example","model":"X1","system":"Android","system_version":"16","net_type":"wifi","lan_ip":"192.168.1.10","wan_ip":"2001:db8::10","latitude":39.9042,"longitude":116.4074,"country":"中国","province":"北京","city":"北京市","county":"朝阳区","thoroughfare":"示例路"},"payload":{"status":"ok"}}}
          topic: "android_fact_device"
          partition: 2
          offset: 99
          timestamp: "2026-07-30T02:00:02.456Z"
    outputs:
      - extract_from: "map_synap_agent_message"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(length(.), 63)
              assert_eq!(.guid, "device-001")
              assert_eq!(.source_topic, "android_fact_device")
              assert_eq!(.source_partition, 2)
              assert_eq!(.source_offset, 99)
              assert_eq!(.client_time, "2026-07-30 10:00:00.123")
              assert_eq!(.agenda_tags, ["privacy:high"])
              assert_eq!(.punish_types, [2])
              assert_eq!(.fact.type, "device")
              assert!(!exists(.fact.common))
              assert!(exists(.raw_message))
              true

  - name: "合法最小消息应保留空值并使用 Kafka 时间作为 server_time"
    inputs:
