<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统总览大屏</title>
    <style>
      :root {
        --img-bg002: url("../src/assets/images/bg002.jpg");
        --img-bg01top: url("../src/assets/images/bg01top.png");
        --img-bg01bigindex: url("../src/assets/images/bg01bigindex.png");
        --img-bg04bigindex: url("../src/assets/images/bg04bigindex.png");
        --img-bg02bigindex: url("../src/assets/images/bg02bigindex.png");
        --img-bg03bigindex: url("../src/assets/images/bg03bigindex.png");
        --img-logoline: url("../src/assets/images/logoline.png");
        --img-logoline1: url("../src/assets/images/logoline1.png");
        --img-logoline2: url("../src/assets/images/logoline2.png");
        --img-logoline3: url("../src/assets/images/logoline3.png");
        --img-bg01submenu: url("../src/assets/images/bg01submenu.png");
        --img-bg03submenu: url("../src/assets/images/bg03submenu.png");
        --img-bg02submenu: url("../src/assets/images/bg02submenu.png");
        --img-bg04submenu: url("../src/assets/images/bg04submenu.png");
        --img-bg04rightarea: url("../src/assets/images/bg04rightarea.png");
        --img-bg03rightarea: url("../src/assets/images/bg03rightarea.png");
        --img-bg01rightarea: url("../src/assets/images/bg01rightarea.png");
        --img-bg07rightarea: url("../src/assets/images/bg07rightarea.png");
        --img-bg05rightarea: url("../src/assets/images/bg05rightarea.png");
        --img-bg06rightarea: url("../src/assets/images/bg06rightarea.png");
        --img-bg02pandect: url("../src/assets/images/bg02pandect.png");
        --img-bg01pandect: url("../src/assets/images/bg01pandect.png");
        --img-bg03pandect: url("../src/assets/images/bg03pandect.png");
        --img-bg01details03: url("../src/assets/images/bg01details03.png");
        --img-bg01details05: url("../src/assets/images/bg01details05.png");
        --img-bg01details04: url("../src/assets/images/bg01details04.png");
        --img-bg01details01: url("../src/assets/images/bg01details01.png");
        --img-bg01details02: url("../src/assets/images/bg01details02.png");
        --img-bg01details06: url("../src/assets/images/bg01details06.png");
      }

      @font-face {
        font-family: "electronicFont";
        src: url("../src/assets/font/DS-DIGIT.TTF");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 1180px;
        min-height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: "Microsoft YaHei", Arial, sans-serif;
      }

      body {
        overflow-x: auto;
      }

      h1,
      h2,
      h3,
      h4,
      p,
      ul,
      li,
      dl,
      dt,
      dd {
        margin: 0;
        padding: 0;
      }

      ul,
      li {
        list-style: none;
      }

      button {
        font-family: inherit;
      }

      .dashboard-wrap {
        min-height: 100vh;
        color: #fff;
        padding-bottom: 30px;
        box-sizing: border-box;
        background: var(--img-bg002) 50% 50% no-repeat;
        background-size: 100% 100%;
        background-color: #000;
      }

      .dashboard-wrap .title-bar {
        font-size: 18px;
        text-align: center;
        padding: 12px 0 16px 0;
        background: var(--img-bg01top) center bottom no-repeat;
        font-weight: 500;
      }

      .dashboard-wrap .message-bar {
        position: relative;
        padding-top: 20px;
        height: 120px;
        display: flex;
        justify-content: center;
      }

      .dashboard-wrap .message-bar-item {
        transition: all 0.1s ease;
        position: relative;
        display: inline-block;
        overflow: hidden;
        min-width: 145px;
        height: 56px;
        padding: 10px 0 0 30px;
        background: var(--img-bg01bigindex) 0 0 no-repeat;
        margin-right: 40px;
      }

      .dashboard-wrap .message-bar-item:last-of-type {
        margin-right: 0;
      }

      .dashboard-wrap .message-bar-item strong {
        display: block;
        color: #fff;
        font-family: "electronicFont";
        font-size: 22px;
        line-height: 26px;
      }

      .dashboard-wrap .message-bar-item p {
        display: block;
        color: #b8b9bb;
        font-size: 12px;
        line-height: 16px;
      }

      .dashboard-wrap .message-bar-item .animation-1 {
        animation-iteration-count: infinite;
        animation-name: bounceInLeft1;
        animation-duration: 9000ms;
        position: absolute;
        left: 12px;
        bottom: 1px;
        height: 5px;
        width: 345px;
        background: var(--img-bg04bigindex) 0 0 repeat-x;
      }

      .dashboard-wrap .message-bar-item .animation-2 {
        position: absolute;
        right: 0;
        top: 1px;
        height: 16px;
        width: 15px;
        background: var(--img-bg02bigindex) 0 0 no-repeat;
      }

      .dashboard-wrap .message-bar-item .animation-3 {
        position: absolute;
        right: -1px;
        bottom: 1px;
        height: 4px;
        width: 4px;
        background: var(--img-bg03bigindex) 50% 50% no-repeat;
      }

      .dashboard-wrap .message-bar .time-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 200px;
      }

      .dashboard-wrap .message-bar .time-bar h2 {
        animation: fadeInLeft 1s 0.1s ease both;
        font-size: 24px;
        font-weight: normal;
        position: absolute;
        left: 30px;
        top: 40px;
        color: #fff;
      }

      .dashboard-wrap .message-bar .time-bar h2 strong {
        display: block;
        font-weight: normal;
        line-height: 24px;
      }

      .dashboard-wrap .message-bar .time-bar h2 span {
        height: 8px;
        font-size: 10px;
        display: block;
        line-height: 44px;
      }

      .dashboard-wrap .message-bar .time-bar h2 .logoline {
        position: absolute;
        left: 0;
        top: 32px;
        width: 200px;
        height: 2px;
        background: var(--img-logoline) 50% 50% no-repeat;
        display: block;
      }

      .dashboard-wrap .message-bar .time-bar h2 .logoline1 {
        position: absolute;
        z-index: 3;
        left: -30px;
        top: -34px;
        width: 41px;
        height: 29px;
        background: var(--img-logoline1) 50% 50% no-repeat;
        display: block;
      }

      .dashboard-wrap .message-bar .time-bar h2 .logoline2 {
        position: absolute;
        z-index: 3;
        left: 55px;
        top: 58px;
        width: 152px;
        height: 26px;
        background: var(--img-logoline2) 50% 50% no-repeat;
        display: block;
      }

      .dashboard-wrap .message-bar .time-bar h2 .logoline3 {
        animation-iteration-count: infinite;
        animation-name: forotate;
        animation-duration: 6000ms;
        position: absolute;
        z-index: -1;
        left: -10px;
        top: -41px;
        width: 121px;
        height: 121px;
        background: var(--img-logoline3) 50% 50% no-repeat;
        display: block;
      }

      .dashboard-wrap .message-bar .time-bar .date-timer {
        text-align: center;
        position: absolute;
        left: 146px;
        top: 26px;
      }

      .dashboard-wrap .message-bar .time-bar .date-timer strong {
        display: inline-block;
        font-family: "electronicFont";
        font-size: 36px;
        line-height: 50px;
      }

      .dashboard-wrap .message-bar .time-bar .date-timer em {
        display: block;
      }

      .dashboard-wrap .message-bar .time-bar .date-timer ul {
        font-family: "electronicFont";
        font-size: 12px;
        margin-top: 4px;
      }

      .dashboard-wrap .message-bar .time-bar .date-timer ul li {
        display: inline-block;
      }

      .dashboard-wrap .middle {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .dashboard-wrap .middle .left-area {
        animation: bounceInLeft 0.1s 1s ease both;
        background: var(--img-bg01submenu) 0 50% no-repeat;
        height: 564px;
        position: absolute;
        left: 0;
        top: 30px;
        min-width: 18px;
      }

      .dashboard-wrap .middle .left-area ul {
        float: left;
        width: 120px;
        overflow: visible;
        margin: 30px 0 0 10px;
        display: block;
      }

      .dashboard-wrap .middle .left-area ul li {
        font-size: 14px;
        display: block;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item {
        display: flex;
        font-family: "electronicFont";
        transition: width ease 0.3s;
        border-top: 1px solid transparent;
        height: 26px;
        line-height: 26px;
        color: #fff;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item:hover b,
      .dashboard-wrap .middle .left-area ul li .submenu-item.active b {
        background: var(--img-bg03submenu) 1px 50% no-repeat #0067e6;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item:hover span,
      .dashboard-wrap .middle .left-area ul li .submenu-item .active span {
        left: 0;
        display: block;
        background: #0067e6;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item:hover span em,
      .dashboard-wrap .middle .left-area ul li .submenu-item.active span em {
        display: block;
        position: absolute;
        right: -10px;
        top: 0;
        height: 26px;
        width: 10px;
        background: var(--img-bg02submenu) 0 0 no-repeat;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item b {
        display: inline-block;
        height: 26px;
        line-height: 26px;
        background: var(--img-bg03submenu) 1px 50% no-repeat #0050b3;
        min-width: 14px;
        padding: 0 8px;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item:hover span {
        animation: bounceInLeft 0.2s 0.2s ease both;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item.active span {
        animation: none;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item span {
        animation: bounceInRight 0.2s 0.2s ease both;
        left: -140px;
        padding-left: 5px;
        padding-right: 10px;
        float: left;
        white-space: nowrap;
        font-family: "Microsoft YaHei", SimHei, sans-serif;
        height: 26px;
        line-height: 26px;
        background: #0050b3;
        position: relative;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item span em {
        position: absolute;
        right: -10px;
        top: 0;
        height: 26px;
        width: 10px;
        background: var(--img-bg04submenu) right center no-repeat;
      }

      .dashboard-wrap .middle .left-area ul li .submenu-item i {
        font-style: normal;
      }

      .dashboard-wrap .middle .right-area {
        position: absolute;
        right: 0;
        top: 0;
        color: #fff;
        animation: bounceInRight2 0.8s 0.3s ease both;
      }

      .dashboard-wrap .middle .right-area h3 {
        position: relative;
        top: 20px;
        background: var(--img-bg04rightarea) 6px bottom no-repeat;
        padding-bottom: 6px;
        padding-left: 6px;
        font-size: 14px;
        font-weight: normal;
        color: #fff;
        animation-iteration-count: infinite;
        animation-name: flash1;
        animation-duration: 1200ms;
      }

      .dashboard-wrap .middle .right-area h3 b {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 7px;
        height: 7px;
        background: var(--img-bg03rightarea) right 0 no-repeat;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 {
        width: 300px;
        height: 270px;
        background: var(--img-bg01rightarea) right bottom no-repeat;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl {
        padding: 78px 0 0 130px;
        font-size: 12px;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dt {
        color: rgba(255, 255, 255, 0.3);
        margin-top: 4px;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd {
        position: relative;
        height: 22px;
        line-height: 24px;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd span {
        font-family: "electronicFont";
        position: relative;
        z-index: 1;
        font-size: 22px;
        margin-top: 6px;
        letter-spacing: 1px;
        opacity: 1;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd b {
        animation-iteration-count: infinite;
        animation-name: flash2;
        animation-duration: 3000ms;
        position: absolute;
        left: -5px;
        top: 30%;
        display: block;
        width: 74px;
        height: 17px;
        background: var(--img-bg07rightarea) left bottom no-repeat;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd:nth-child(2) b {
        animation-iteration-count: infinite;
        animation-name: flash2;
        animation-duration: 5000ms;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd:nth-child(3) b {
        animation-iteration-count: infinite;
        animation-name: flash2;
        animation-duration: 1000ms;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd.font12 {
        font-size: 12px;
        line-height: 24px;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd.font-red {
        color: #ff3114;
      }

      .dashboard-wrap .middle .right-area .area-inbox-1 dl dd.ml-20,
      .dashboard-wrap .middle .right-area .area-inbox-1 dl dt.ml-20 {
        margin-left: -18px;
      }

      .dashboard-wrap .middle .right-area .round-1 {
        position: absolute;
        left: 94px;
        top: 98px;
        width: 168px;
        height: 168px;
        border-radius: 100%;
        border: 1px dashed #fff;
        animation-iteration-count: infinite;
        animation-name: forotate;
        animation-duration: 19000ms;
      }

      .dashboard-wrap .middle .right-area .round-2 {
        position: absolute;
        left: 79px;
        top: 84px;
        width: 198px;
        height: 198px;
        border-radius: 100%;
        border: 1px dashed rgba(255, 255, 255, 0.5);
        animation-iteration-count: infinite;
        animation-name: forotate1;
        animation-duration: 8000ms;
      }

      .dashboard-wrap .middle .right-area .round-3 {
        position: absolute;
        left: 50px;
        top: 68px;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        text-align: center;
        line-height: 40px;
        font-family: "electronicFont";
        font-size: 14px;
        border-radius: 100%;
        background: var(--img-bg05rightarea) right bottom no-repeat;
        animation-iteration-count: infinite;
        animation-name: whitePulse;
        animation-duration: 2s;
      }

      .dashboard-wrap .middle .right-area .round-4 {
        position: absolute;
        left: 36px;
        top: 105px;
        width: 23px;
        height: 23px;
        border-radius: 100%;
        background: var(--img-bg06rightarea) right bottom no-repeat;
        box-shadow: 0 0 12px #fff;
        animation-iteration-count: infinite;
        animation-name: forotate;
        animation-duration: 4000ms;
      }

      .dashboard-wrap .middle .center-area {
        flex: 1;
        margin: 30px 365px 0 265px;
        position: relative;
      }

      .dashboard-wrap .middle .center-area .pandect-area {
        background: var(--img-bg02pandect) center top no-repeat;
        height: 292px;
        margin: 0 68px;
        position: relative;
        padding-top: 1px;
      }

      .dashboard-wrap .middle .center-area .pandect-area .pandect-area-left {
        position: absolute;
        left: -68px;
        top: 0;
        display: block;
        width: 68px;
        height: 292px;
        background: var(--img-bg01pandect) center top no-repeat;
      }

      .dashboard-wrap .middle .center-area .pandect-area .pandect-area-right {
        position: absolute;
        right: -68px;
        top: 0;
        display: block;
        width: 68px;
        height: 292px;
        background: var(--img-bg03pandect) center top no-repeat;
      }

      .dashboard-wrap .chart-bar {
        display: flex;
        padding: 20px 50px;
        position: relative;
      }

      .dashboard-wrap .chart-bar-item {
        display: flex;
        position: relative;
        flex: 1;
        margin-top: 30px;
        height: 240px;
        text-align: center;
      }

      .dashboard-wrap .chart-bar .details1-area {
        margin-right: 40px;
      }

      .dashboard-wrap .chart-bar .detailsl-area-left {
        display: block;
        width: 122px;
        background: var(--img-bg01details03) center bottom no-repeat;
      }

      .dashboard-wrap .chart-bar .detailsl-area-right {
        display: block;
        width: 121px;
        background: var(--img-bg01details05) center bottom no-repeat;
      }

      .dashboard-wrap .chart-bar .details1-area-center {
        flex: 1;
        min-width: 0;
        background: var(--img-bg01details04) center bottom repeat-x;
      }

      .dashboard-wrap .chart-bar .details2-area h3,
      .dashboard-wrap .chart-bar .details2-area dl {
        margin-left: 40px !important;
      }

      .dashboard-wrap .chart-bar .details2-area-left {
        display: block;
        width: 122px;
        background: var(--img-bg01details01) center bottom no-repeat;
      }

      .dashboard-wrap .chart-bar .details2-area-right {
        display: block;
        width: 121px;
        background: var(--img-bg01details02) center bottom no-repeat;
      }

      .dashboard-wrap .chart-bar .details2-area-center {
        flex: 1;
        min-width: 0;
        float: left;
        background: var(--img-bg01details06) center bottom repeat-x;
      }

      .dashboard-wrap .bottom-area {
        height: 320px;
        margin-top: 20px;
      }

      .dashboard-wrap .bottom-area .area-text {
        display: flex;
        margin: auto;
        width: 600px;
        height: 270px;
        padding: 14px;
      }

      .dashboard-wrap .bottom-area .area-text h4 {
        color: #fff;
      }

      .dashboard-wrap .bottom-area .area-text .img-border {
        display: block;
        width: auto;
      }

      .dashboard-wrap .bottom-area .area-text .msg-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        padding: 8px 0;
      }

      .dashboard-wrap .bottom-area .area-text .msg-content .text-outer {
        flex: 1;
        padding-bottom: 12px;
        overflow-y: auto;
      }

      .dashboard-wrap .bottom-area .area-text .msg-content .text-outer::-webkit-scrollbar {
        width: 0;
      }

      .dashboard-wrap .bottom-area .area-text .msg-content .text-outer .text-inner .text-item {
        display: block;
        color: rgba(255, 255, 255, 0.6);
        line-height: 28px;
        font-size: 14px;
        word-break: break-all;
      }

      .dashboard-wrap .bottom-area .area-button {
        display: flex;
        justify-content: center;
      }

      .dashboard-wrap .bottom-area .area-button .transparent-border-button {
        margin: 10px;
        background: transparent;
        border: 1px solid #ccc;
        color: #d7e7ff;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        border-radius: 10px;
      }

      .dashboard-wrap .bottom-area .area-button .transparent-border-button:hover,
      .dashboard-wrap .bottom-area .area-button .button-active {
        background: #f2f2f2;
        color: #555;
        border-color: #999;
      }

      .view-type {
        width: 100%;
        height: 260px;
      }

      .view-location,
      .view-device {
        background-color: rgba(0, 0, 0, 0);
        width: 100%;
        height: 100%;
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 16px;
        z-index: 1000;
        transform: translateX(-50%);
        min-width: 220px;
        max-width: 520px;
        padding: 9px 14px;
        border: 1px solid rgba(58, 147, 255, 0.45);
        border-radius: 6px;
        background: rgba(6, 22, 45, 0.9);
        color: #dbeeff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        font-size: 13px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .toast.visible {
        opacity: 1;
      }

      @media (max-width: 1280px) {
        html,
        body {
          min-width: 1080px;
        }

        .dashboard-wrap .middle .center-area {
          margin-right: 330px;
          margin-left: 210px;
        }

        .dashboard-wrap .chart-bar {
          padding-left: 30px;
          padding-right: 30px;
        }
      }

      @keyframes bounceInLeft {
        0% {
          opacity: 0;
          transform: translateX(-50px);
        }
        60% {
          opacity: 1;
          transform: translateX(0);
        }
        80% {
          transform: translateX(-10px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes bounceInRight {
        0% {
          transform: translateX(0);
        }
        60% {
          transform: translateX(10px);
        }
        80% {
          opacity: 1;
          transform: translateX(0);
        }
        100% {
          opacity: 0;
          transform: translateX(50px);
        }
      }

      @keyframes bounceInRight2 {
        0% {
          opacity: 0;
          transform: translateX(50px);
        }
        60% {
          opacity: 1;
          transform: translateX(0);
        }
        80% {
          transform: translateX(10px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes fadeInLeft {
        0% {
          opacity: 0;
          transform: translateX(-1000px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes forotate {
        from {
          transform: rotate(-360deg);
          opacity: 0.9;
        }
        to {
          transform: rotate(0);
          opacity: 1;
        }
      }

      @keyframes forotate1 {
        from {
          transform: rotate(360deg);
          opacity: 0.75;
        }
        to {
          transform: rotate(0);
          opacity: 1;
        }
      }

      @keyframes bounceInLeft1 {
        0% {
          transform: translateX(-115px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes flash1 {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.72;

    <div id="toast" class="toast"></div>

    <script>
      (function () {
        const query = new URLSearchParams(window.location.search);
        const userConfig = window.MSG_BOARD_CONFIG || {};
        const config = {
          apiBase: query.has("apiBase") ? query.get("apiBase") : userConfig.apiBase || "/zenvis",
          assetBase: query.get("assetBase") || userConfig.assetBase || "../src/assets/images",
          fontBase: query.get("fontBase") || userConfig.fontBase || "../src/assets/font",
          echartsUrl:
            query.get("echartsUrl") ||
            userConfig.echartsUrl ||
            "https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js",
          echartsFallbackUrl:
            query.get("echartsFallbackUrl") ||
            userConfig.echartsFallbackUrl ||
            "/node_modules/echarts/dist/echarts.min.js",
          requestTimeout: Number(userConfig.requestTimeout || 60000),
        };

        const apiPrefix = "/api/v1/dashboard/home";
        const state = {
          activeKey: 0,
          timeObject: {},
          summaryInfo: {},
          systemStatusInfo: {},
          efficiencyInfo: {},
          realInfo: [],
        };

        const charts = {
          trend: null,
          location: null,
          device: null,
        };

        const timers = {
          clock: null,
          scroll: null,
          scrollRestart: null,
        };

        const imageVarMap = {
          bg002: "bg002.jpg",
          bg01top: "bg01top.png",
          bg01bigindex: "bg01bigindex.png",
          bg04bigindex: "bg04bigindex.png",
          bg02bigindex: "bg02bigindex.png",
          bg03bigindex: "bg03bigindex.png",
          logoline: "logoline.png",
          logoline1: "logoline1.png",
          logoline2: "logoline2.png",
          logoline3: "logoline3.png",
          bg01submenu: "bg01submenu.png",
          bg03submenu: "bg03submenu.png",
          bg02submenu: "bg02submenu.png",
          bg04submenu: "bg04submenu.png",
          bg04rightarea: "bg04rightarea.png",
          bg03rightarea: "bg03rightarea.png",
          bg01rightarea: "bg01rightarea.png",
          bg07rightarea: "bg07rightarea.png",
          bg05rightarea: "bg05rightarea.png",
          bg06rightarea: "bg06rightarea.png",
          bg02pandect: "bg02pandect.png",
          bg01pandect: "bg01pandect.png",
          bg03pandect: "bg03pandect.png",
          bg01details03: "bg01details03.png",
          bg01details05: "bg01details05.png",
          bg01details04: "bg01details04.png",
          bg01details01: "bg01details01.png",
          bg01details02: "bg01details02.png",
          bg01details06: "bg01details06.png",
        };

        const dom = {};

        function normalizeBase(base) {
          return String(base || "").replace(/\/+$/, "");
        }

        function joinUrl(base, path) {
          const cleanBase = normalizeBase(base);
          if (!cleanBase) return path;
          return cleanBase + (path.startsWith("/") ? path : "/" + path);
        }

        function assetUrl(fileName) {
          return joinUrl(config.assetBase, fileName);
        }

        function setText(id, value) {
          const element = dom[id] || document.getElementById(id);
          if (element) element.textContent = value == null ? "" : String(value);
        }

        function pick(source, keys, fallback) {
          if (!source || typeof source !== "object") return fallback;
          for (const key of keys) {
            if (source[key] !== undefined && source[key] !== null && source[key] !== "") {
              return source[key];
            }
          }
          return fallback;
        }

        function showToast(message) {
          if (!dom.toast) return;
          dom.toast.textContent = message;
          dom.toast.classList.add("visible");
          window.clearTimeout(dom.toastTimer);
          dom.toastTimer = window.setTimeout(() => {
            dom.toast.classList.remove("visible");
          }, 2600);
        }

        function applyAssets() {
          Object.keys(imageVarMap).forEach(key => {
            document.documentElement.style.setProperty(
              "--img-" + key,
              'url("' + assetUrl(imageVarMap[key]) + '")',
            );
          });
          dom.leftBorderImage.src = assetUrl("bg01righttext.png");
          dom.rightBorderImage.src = assetUrl("bg02righttext.png");

          const fontStyle = document.createElement("style");
          fontStyle.textContent =
            '@font-face{font-family:"electronicFont";src:url("' +
            joinUrl(config.fontBase, "DS-DIGIT.TTF") +
            '");}';
          document.head.appendChild(fontStyle);
        }

        function pad2(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function formatDate(date) {
          return (
            date.getFullYear() +
            "-" +
            pad2(date.getMonth() + 1) +
            "-" +
            pad2(date.getDate()) +
            " " +
            pad2(date.getHours()) +
            ":" +
            pad2(date.getMinutes()) +
            ":" +
            pad2(date.getSeconds())
          );
        }

        function getDayStart(offsetDays) {
          const now = new Date();
          return new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetDays, 0, 0, 0, 0);
        }

        function getDayEnd(offsetDays) {
          const now = new Date();
          return new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate() + offsetDays,
            23,
            59,
            59,
            999,
          );
        }

        function setTimeRange(range) {
          const value = Number(range || 0);
          state.activeKey = value;

          if (value === 7) {
            state.timeObject = {
              start_time: formatDate(getDayStart(-6)),
              end_time: formatDate(getDayEnd(0)),
            };
          } else if (value === -1) {
            state.timeObject = {
              start_time: formatDate(getDayStart(-1)),
              end_time: formatDate(getDayEnd(-1)),
            };
          } else {
            state.timeObject = {
              start_time: formatDate(getDayStart(0)),
              end_time: formatDate(getDayEnd(0)),
            };
          }

          document.querySelectorAll("[data-range]").forEach(button => {
            button.classList.toggle("button-active", Number(button.dataset.range) === value);
          });

          refreshTimeBasedData();
        }

        function updateClock() {
          const today = new Date();
          const weekdays = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"];
          const weekdayIndex = today.getDay() === 0 ? 6 : today.getDay() - 1;

          setText("clockYear", today.getFullYear() + "年");
          setText("clockMonth", today.getMonth() + 1 + "月");
          setText("clockDay", today.getDate() + "日");
          setText("clockWeekday", weekdays[weekdayIndex] || "");
          setText("clockHour", pad2(today.getHours()) + ":");
          setText("clockMinute", pad2(today.getMinutes()));
        }

        async function requestDashboard(path, params) {
          const controller = new AbortController();
          const timeoutId = window.setTimeout(() => controller.abort(), config.requestTimeout);
          try {
            const response = await fetch(joinUrl(config.apiBase, apiPrefix + path), {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type": "application/json;charset=UTF-8",
              },
              body: JSON.stringify(params || {}),
              signal: controller.signal,
            });
            const text = await response.text();
            let payload = {};

            if (text) {
              try {
                payload = JSON.parse(text);
              } catch (error) {
                throw new Error("接口返回不是有效 JSON: " + text.slice(0, 120));
              }
            }

            if (!response.ok) {
              throw new Error(payload.msg || payload.error || "HTTP " + response.status);
            }

            const businessCode = payload.status !== undefined ? payload.status : payload.code;
            if (businessCode !== undefined && Number(businessCode) !== 0) {
              throw new Error(payload.msg || payload.error || "请求失败");
            }

            if (Object.prototype.hasOwnProperty.call(payload, "data")) {
              return payload.data;
            }
            return payload;
          } finally {
            window.clearTimeout(timeoutId);
          }
        }

        function renderSummary(data) {
          state.summaryInfo = data || {};
          setText("summaryMsgTotal", pick(state.summaryInfo, ["msg_total", "total_messages"], 0));
          setText("summaryStartTotal", pick(state.summaryInfo, ["start_total", "success_messages"], 0));
          setText("summaryDeviceTotal", pick(state.summaryInfo, ["device_total", "failed_messages"], 0));
        }

        function renderSystemStatus(data) {
          state.systemStatusInfo = data || {};
          setText("systemStatus", pick(state.systemStatusInfo, ["status"], "正常运行"));
          setText("serviceStatusCount", pick(state.systemStatusInfo.service_status, ["count"], ""));
          setText("serviceStatusInfo", pick(state.systemStatusInfo.service_status, ["info"], ""));
          setText("msgStatusCount", pick(state.systemStatusInfo.msg_status, ["count"], ""));
          setText("msgStatusInfo", pick(state.systemStatusInfo.msg_status, ["info"], ""));
          setText("todoCount", pick(state.systemStatusInfo.to_do, ["count"], ""));
          setText("todoInfo", pick(state.systemStatusInfo.to_do, ["info"], ""));
        }

        function renderEfficiency(data) {
          state.efficiencyInfo = data || {};
          setText("receiveDelay", pick(state.efficiencyInfo, ["receive_delay", "latency"], 0));
          setText("msgCountForMinute", pick(state.efficiencyInfo, ["msg_count_for_minute", "throughput"], 0));
          setText("processDelay", pick(state.efficiencyInfo, ["process_delay", "avg_process_time"], 0));
          setText("efficiencyRatio", pick(state.efficiencyInfo, ["ratio", "efficiency", "availability"], 0) + "%");
        }

        function renderRealInfo(data) {
          const list = Array.isArray(data)
            ? data
            : Array.isArray(data && data.info_list)
              ? data.info_list
              : [];
          state.realInfo = list;
          dom.textInner.innerHTML = "";

          list.forEach(item => {
            const span = document.createElement("span");
            span.className = "text-item";
            span.textContent = "* " + item;
            dom.textInner.appendChild(span);
          });

          restartScrollSoon(100);
        }

        function startScroll() {
          if (timers.scroll) {
            window.clearInterval(timers.scroll);
            timers.scroll = null;
          }

          if (!dom.textOuter || !dom.textInner) return;
          const scrollContent = dom.textInner.dataset.scrollContent || dom.textInner.innerHTML;
          dom.textInner.dataset.scrollContent = scrollContent;
          dom.textInner.innerHTML = scrollContent;
          dom.textOuter.scrollTop = 0;

          if (dom.textInner.offsetHeight > dom.textOuter.offsetHeight) {
            dom.textInner.innerHTML = scrollContent + scrollContent;
            timers.scroll = window.setInterval(() => {
              if (dom.textOuter.scrollTop >= dom.textInner.offsetHeight / 2) {
                dom.textOuter.scrollTop = 0;
              }
              dom.textOuter.scrollTop += 1;
            }, 100);
          }
        }

        function restartScrollSoon(delay) {
          if (timers.scrollRestart) window.clearTimeout(timers.scrollRestart);
          if (dom.textInner) delete dom.textInner.dataset.scrollContent;
          timers.scrollRestart = window.setTimeout(startScroll, delay);
        }

        function makeLineSeries(data) {
          const names = Array.isArray(data && data.yaxis_name) ? data.yaxis_name : [];
          const values = Array.isArray(data && data.yaxis_data) ? data.yaxis_data : [];
          return names.map((name, index) => ({
            name,
            type: "line",
            stack: "Total",
            areaStyle: {},
            emphasis: {
              focus: "series",
            },
            data: Array.isArray(values[index]) ? values[index] : [],
          }));
        }

        function makeBarSeries(data) {
          const names = Array.isArray(data && data.yaxis_name) ? data.yaxis_name : [];
          const values = Array.isArray(data && data.yaxis_data) ? data.yaxis_data : [];
          return names.map((name, index) => ({
            name,
            type: "bar",
            stack: "total",
            emphasis: {
              focus: "series",
            },
            data: Array.isArray(values[index]) ? values[index] : [],
          }));
        }

        function chartTextStyle() {
          return {
            color: "#fff",
            fontFamily: "Microsoft YaHei, Arial, sans-serif",
          };
        }

        function setTrendChart(data) {
          if (!charts.trend) return;
          const xAxis = Array.isArray(data && data.xaxis) ? data.xaxis : [];
          const legendData = Array.isArray(data && data.yaxis_name) ? data.yaxis_name : [];

          charts.trend.setOption(
            {
              title: {
                text: "数据分布趋势图",
                top: 10,
                textStyle: chartTextStyle(),
              },
              tooltip: {
                trigger: "axis",
                axisPointer: {
                  type: "cross",
                  label: {
                    backgroundColor: "#6a7985",
                  },
                },
              },
              legend: {
                data: legendData,
                top: 10,
                right: 20,
                textStyle: chartTextStyle(),
              },
              grid: {
                top: 60,
                left: 20,
                right: 20,
                bottom: 0,
                containLabel: true,
              },
              xAxis: [
                {
                  type: "category",
                  boundaryGap: false,
                  data: xAxis,
                  axisLabel: {
                    color: "#fff",
                  },
                },
              ],
              yAxis: [
                {
                  type: "value",
                  axisLabel: {
                    color: "#fff",
                  },
                  splitLine: {
                    lineStyle: {
                      color: "rgba(255,255,255,0.12)",
                    },
                  },
                },
              ],
              series: makeLineSeries(data),
            },
            true,
          );
        }

        function setHorizontalBarChart(chart, data, options) {
          if (!chart) return;
          chart.setOption(
            {
              tooltip: {
                trigger: "axis",
                axisPointer: {
                  type: "shadow",
                },
              },
              legend: {
                top: 10,
                right: 20,
                textStyle: chartTextStyle(),
              },
              grid: {
                top: options.top,
                left: options.left,
                right: options.right,
                bottom: 10,
                containLabel: true,
              },
              xAxis: {
                type: "value",
                axisLabel: {
                  color: "#fff",
                },
                splitLine: {
                  lineStyle: {
                    color: "rgba(255,255,255,0.12)",
                  },
                },
              },
              yAxis: {
                type: "category",
                data: Array.isArray(data && data.xaxis) ? data.xaxis : [],
                axisLabel: {
                  color: "#fff",
                },
              },
              series: makeBarSeries(data),
            },
            true,
          );
        }

        async function querySystemSummary() {
          try {
            renderSummary(await requestDashboard("/summary", state.timeObject));
          } catch (error) {
            console.error("获取系统摘要失败:", error);
            showToast(error.message || "获取系统摘要失败");
          }
        }

        async function querySystemStatus() {
          try {
            renderSystemStatus(await requestDashboard("/status"));
          } catch (error) {
            console.error("获取系统状态失败:", error);
          }
        }

        async function querySystemEfficiency() {
          try {
            renderEfficiency(await requestDashboard("/efficiency"));
          } catch (error) {
            console.error("获取系统效率失败:", error);
          }
        }

        async function querySystemRealInfo() {
          try {
            renderRealInfo(await requestDashboard("/real-info"));
          } catch (error) {
            console.error("获取实时信息失败:", error);
          }
        }

        async function queryMsgTrend() {
          try {
            setTrendChart(await requestDashboard("/msg-trend", state.timeObject));
          } catch (error) {
            console.error("获取消息趋势数据失败:", error);
          }
        }

        async function queryLocationStat() {
          try {
            setHorizontalBarChart(charts.location, await requestDashboard("/province-city-stat", state.timeObject), {
              top: 60,
              left: 30,
              right: 20,
            });
          } catch (error) {
            console.error("获取位置统计数据失败:", error);
          }
        }

        async function queryDeviceStat() {
          try {
            setHorizontalBarChart(charts.device, await requestDashboard("/manufacture-system-stat", state.timeObject), {
              top: 70,
              left: 0,
              right: 30,
            });
          } catch (error) {
            console.error("获取设备统计数据失败:", error);
          }
        }

        function refreshTimeBasedData() {
          querySystemSummary();
          queryMsgTrend();
          queryLocationStat();
          queryDeviceStat();
        }

        function resizeCharts() {
          Object.keys(charts).forEach(key => {
            if (charts[key]) charts[key].resize();
          });
        }

        function initCharts() {
          if (!window.echarts) {
            showToast("ECharts 加载失败，请检查 echartsUrl 配置");
            return;
          }
          charts.trend = window.echarts.init(document.getElementById("msgTrendChart"));
          charts.location = window.echarts.init(document.getElementById("msgLocationChart"));
          charts.device = window.echarts.init(document.getElementById("msgDeviceChart"));
          setTrendChart({ xaxis: [], yaxis_name: [], yaxis_data: [] });
          setHorizontalBarChart(charts.location, { xaxis: [], yaxis_name: [], yaxis_data: [] }, {
            top: 60,
            left: 30,
            right: 20,
          });
          setHorizontalBarChart(charts.device, { xaxis: [], yaxis_name: [], yaxis_data: [] }, {
            top: 70,
            left: 0,
            right: 30,
          });
          window.addEventListener("resize", resizeCharts);
        }

        function cacheDom() {
          [
            "summaryMsgTotal",
            "summaryStartTotal",
            "summaryDeviceTotal",
            "systemStatus",
            "clockHour",
            "clockMinute",
            "clockWeekday",
            "clockYear",
            "clockMonth",
            "clockDay",
            "serviceStatusCount",
            "serviceStatusInfo",
            "msgStatusCount",
            "msgStatusInfo",
            "todoCount",
            "todoInfo",
            "receiveDelay",
            "msgCountForMinute",
            "processDelay",
            "efficiencyRatio",
          ].forEach(id => {
            dom[id] = document.getElementById(id);
          });

          dom.textOuter = document.getElementById("textOuter");
          dom.textInner = document.getElementById("textInner");
          dom.leftBorderImage = document.getElementById("leftBorderImage");
          dom.rightBorderImage = document.getElementById("rightBorderImage");
          dom.toast = document.getElementById("toast");
        }

        function loadScript(src) {
          return new Promise((resolve, reject) => {
            if (window.echarts) {
              resolve();
              return;
            }
            const script = document.createElement("script");
            script.src = src;
            script.async = true;
            script.onload = resolve;
            script.onerror = () => reject(new Error("脚本加载失败: " + src));
            document.head.appendChild(script);
          });
        }

        function bindEvents() {
          document.querySelectorAll("[data-range]").forEach(button => {
            button.addEventListener("click", () => setTimeRange(button.dataset.range));
          });

          dom.textOuter.addEventListener("mouseenter", () => {
            if (timers.scroll) {
              window.clearInterval(timers.scroll);
              timers.scroll = null;
            }
          });
          dom.textOuter.addEventListener("mouseleave", startScroll);
        }

        async function bootstrap() {
          cacheDom();
          applyAssets();
          bindEvents();
          updateClock();
          timers.clock = window.setInterval(updateClock, 1000);

          try {
            await loadScript(config.echartsUrl);
          } catch (error) {
            console.warn(error);
            if (config.echartsFallbackUrl) {
              try {
                await loadScript(config.echartsFallbackUrl);
              } catch (fallbackError) {
                console.error(fallbackError);
                showToast(fallbackError.message || "ECharts 加载失败");
              }
            } else {
              showToast(error.message || "ECharts 加载失败");
            }
          }

          initCharts();

          setTimeRange(0);
          querySystemStatus();
          querySystemEfficiency();
          querySystemRealInfo();
          timers.scrollRestart = window.setTimeout(startScroll, 3000);
        }

        window.addEventListener("beforeunload", () => {
          if (timers.clock) window.clearInterval(timers.clock);
          if (timers.scroll) window.clearInterval(timers.scroll);
          if (timers.scrollRestart) window.clearTimeout(timers.scrollRestart);
          window.removeEventListener("resize", resizeCharts);
          Object.keys(charts).forEach(key => {
            if (charts[key]) {
              charts[key].dispose();
              charts[key] = null;
            }
          });
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bootstrap);
        } else {
          bootstrap();
        }
      })();
    </script>
  </body>
</html>
