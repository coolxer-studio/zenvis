server.port=11001
# ================================
# MySQL 数据库配置
# ================================
spring.datasource.mysql.jdbc-url=${MYSQL_JDBC_URL:}
spring.datasource.mysql.username=${MYSQL_USER:zenvis}
spring.datasource.mysql.password=${MYSQL_PASSWORD:}
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# ================================
# ClickHouse 数据库配置
# ================================
spring.datasource.clickhouse.jdbc-url=${CLICKHOUSE_JDBC_URL:}
spring.datasource.clickhouse.username=${CLICKHOUSE_USER:default}
spring.datasource.clickhouse.password=${CLICKHOUSE_PASSWORD:}
spring.datasource.clickhouse.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
# ================================
# Redis 缓存配置
# ================================
spring.data.redis.database=0
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
server.servlet.session.timeout=3600S
# ================================
# 应用服务配置
# ================================
# 数据服务地址
app.services.data.url=${VECTUM_URL:}
app.services.clickhouse.http-url=${CLICKHOUSE_HTTP_URL:}
# Vectum Bearer Token
app.services.data.bearer-token=${VECTUM_AUTH_TOKEN:}
# ================================
# 应用路径配置
# ================================
# 配置文件根目录
app.paths.config.base=${ZENVIS_OPEN_CONFIG_PATH:../deploy/open_config}
# 系统信息配置目录
app.paths.system.config=${app.paths.config.base:.}/web_config
# HTML页面配置目录
app.paths.html.pages=${app.paths.config.base:.}/html-page_config
# 插件包配置目录
app.paths.plugins=${app.paths.config.base:.}/plugin-package_config
# AI Skill 配置目录
app.paths.skills=${app.paths.config.base:.}/skill_config
# 显式选择 Skill 时允许注入的最大提示词字符数；超限将明确报错，不做静默截断。
app.ai.skill.max-selected-prompt-chars=${AI_SKILL_MAX_SELECTED_PROMPT_CHARS:32000}
# DIH 模型上下文预算。输入预算会预留输出空间和安全余量。
app.ai.dih.context.window-tokens=${AI_DIH_CONTEXT_WINDOW_TOKENS:102400}
app.ai.dih.context.output-reserve-tokens=${AI_DIH_OUTPUT_RESERVE_TOKENS:4096}
app.ai.dih.context.safety-margin-tokens=${AI_DIH_CONTEXT_SAFETY_MARGIN_TOKENS:4096}
app.ai.dih.context.max-history-tokens=${AI_DIH_MAX_HISTORY_TOKENS:24000}
app.ai.dih.context.summary-tokens=${AI_DIH_SUMMARY_TOKENS:2048}
app.ai.dih.context.recent-turns=${AI_DIH_RECENT_TURNS:6}
app.ai.dih.context.max-attachment-chars=${AI_DIH_MAX_ATTACHMENT_CHARS:24000}
app.ai.dih.context.max-attachment-chars-per-file=${AI_DIH_MAX_ATTACHMENT_CHARS_PER_FILE:12000}
# 未声明 runtime.limits 的 Agent/Skill 继承以下 MCP 单轮预算。
app.ai.dih.agent.default-limits.max-tool-calls=${AI_DIH_MAX_TOOL_CALLS:8}
app.ai.dih.agent.default-limits.max-repeated-failures=${AI_DIH_MAX_REPEATED_FAILURES:2}
app.ai.dih.agent.default-limits.max-tool-result-chars=${AI_DIH_MAX_TOOL_RESULT_CHARS:8000}
app.ai.dih.agent.default-limits.max-accumulated-tool-result-chars=${AI_DIH_MAX_ACCUMULATED_TOOL_RESULT_CHARS:24000}
app.ai.dih.agent.default-limits.max-accumulated-tool-result-tokens=${AI_DIH_MAX_ACCUMULATED_TOOL_RESULT_TOKENS:12000}
# DIH会话工作空间目录
app.paths.session.workspace=${app.paths.config.base:.}/dih-session-workspace
# 检索元数据配置目录
app.paths.retrieval.metadata=${app.paths.config.base:.}/meta_config
# ================================
# 首次启动账号配置
# ================================
app.bootstrap.super-admin-password=${ZENVIS_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
app.bootstrap.admin-password=${ZENVIS_BOOTSTRAP_ADMIN_PASSWORD:}
# ================================
# 安全配置
# ================================
# 权限拦截器检查路径
app.security.interceptor.check.path=/api/v1
# 普通 REST API Bearer Token。配置后 /api/v1/** 可通过 Authorization: Bearer <token> 调用。
app.security.api.bearer-token=${API_BEARER_TOKEN:}
# Bearer Token 调用映射到的系统用户邮箱，用于权限上下文和审计。
app.security.api.bearer-user=${API_BEARER_USER:admin@admin.com}
# MCP Bearer Token。未配置时 MCP Server 接口会返回 401。
app.security.mcp.bearer-token=${MCP_BEARER_TOKEN:}
app.ai.mcp.builtin-server.version=1.0.0
app.ai.mcp.builtin-server.request-timeout=20s
app.ai.mcp.builtin-server.keep-alive-interval=30s
# ================================
# 文件上传配置
# ================================
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
# ================================
# AI 大模型配置
# ================================
# OpenAI API 配置
spring.ai.openai.base-url=${OPENAI_BASE_URL:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:}
# 内部 OpenAI 兼容服务不支持带请求体的 h2c 升级，强制使用 HTTP/1.1。
app.ai.openai.force-http1=${APP_AI_OPENAI_FORCE_HTTP1:true}
# 关闭未使用的 OpenAI 模型自动装配；Spring AI 默认会启用这些模型。
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
app.ai.embedding.enabled=${APP_AI_EMBEDDING_ENABLED:false}
spring.ai.vectorstore.type=none
spring.ai.openai.embedding.enabled=${app.ai.embedding.enabled:false}
spring.ai.openai.embedding.base-url=${OPENAI_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:}}
spring.ai.openai.embedding.api-key=${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:}
spring.ai.openai.completion.url=${OPENAI_COMPLETION_URL:}
spring.ai.openai.completion.options.model=${OPENAI_COMPLETION_MODEL:}
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=mysql
# ================================
# 向量存储配置
# ================================
spring.ai.vectorstore.redis.host=${REDIS_STACK_HOST:}
spring.ai.vectorstore.redis.port=${REDIS_STACK_PORT:6379}
spring.ai.vectorstore.redis.password=${REDIS_PASSWORD:}
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.prefix=dih_rag_vector
spring.ai.vectorstore.redis.index=index_dih_rag_vector
app.ai.vectorstore.management.enabled=${APP_AI_VECTORSTORE_MANAGEMENT_ENABLED:true}
app.ai.mcp.allow-private-server-urls=${APP_AI_MCP_ALLOW_PRIVATE_SERVER_URLS:true}
app.ai.mcp.approval.timeout-seconds=${APP_AI_MCP_APPROVAL_TIMEOUT_SECONDS:300}
app.ai.analysis-task.max-concurrency=${APP_AI_ANALYSIS_TASK_MAX_CONCURRENCY:1}
app.ai.analysis-task.max-suspended=${APP_AI_ANALYSIS_TASK_MAX_SUSPENDED:20}
app.ai.analysis-task.dispatch-delay-ms=${APP_AI_ANALYSIS_TASK_DISPATCH_DELAY_MS:5000}
app.ai.analysis-task.schedule-dispatch-delay-ms=${APP_AI_ANALYSIS_TASK_SCHEDULE_DISPATCH_DELAY_MS:5000}
app.ai.analysis-task.schedule-misfire-grace-ms=${APP_AI_ANALYSIS_TASK_SCHEDULE_MISFIRE_GRACE_MS:60000}
app.business-service.offline-threshold-seconds=${APP_BUSINESS_SERVICE_OFFLINE_THRESHOLD_SECONDS:90}
app.business-service.event-retention-days=${APP_BUSINESS_SERVICE_EVENT_RETENTION_DAYS:30}
app.business-service.instance-retention-days=${APP_BUSINESS_SERVICE_INSTANCE_RETENTION_DAYS:30}
app.business-service.cleanup-delay-ms=${APP_BUSINESS_SERVICE_CLEANUP_DELAY_MS:3600000}
# 开启 app.ai.embedding.enabled 并修改 embedding 模型或维度后，需要重建 Redis 向量索引。
# ================================
# 应用监控配置
# ================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
