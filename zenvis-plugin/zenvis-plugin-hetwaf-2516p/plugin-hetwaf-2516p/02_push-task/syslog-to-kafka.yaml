---
sources:
  het_waf_2516p_syslog_input:
    type: "syslog"
    address: "${HET_WAF_2516P_SYSLOG_ADDRESS:-0.0.0.0:12516}"
    mode: "${HET_WAF_2516P_SYSLOG_MODE:-udp}"
    max_length: 102400

transforms:
  validate_het_waf_2516p_source:
    type: "remap"
    inputs:
      - "het_waf_2516p_syslog_input"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      source_ip = to_string(.source_ip) ?? ""
      raw_message = to_string(.message) ?? ""
      assert_eq!(source_ip, "${HET_WAF_2516P_SOURCE_IP:-192.168.42.234}", message: "HET-WAF-2516P Syslog 来源 IP 不匹配")
      assert!(raw_message != "", message: "HET-WAF-2516P Syslog message 不能为空")

sinks:
  het_waf_2516p_raw_kafka:
    type: "kafka"
    inputs:
      - "validate_het_waf_2516p_source"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    topic: "${HET_WAF_2516P_SYSLOG_TOPIC:-hetwaf2516p-syslog-raw}"
    compression: "zstd"
    encoding:
      codec: "json"
    librdkafka_options:
      request.required.acks: "-1"
      message.send.max.retries: "10"
      retry.backoff.ms: "1000"
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"

  het_waf_2516p_source_dead_letter:
    type: "kafka"
    inputs:
      - "validate_het_waf_2516p_source.dropped"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    topic: "${HET_WAF_2516P_DLQ_TOPIC:-hetwaf2516p-dead-letter}"
    compression: "zstd"
    encoding:
      codec: "json"
    librdkafka_options:
      request.required.acks: "-1"
      message.send.max.retries: "10"
      retry.backoff.ms: "1000"
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"

tests:
  - name: "匹配来源 IP 的 Syslog 应原样进入 Kafka 输出"
    inputs:
      - insert_at: "validate_het_waf_2516p_source"
        type: "log"
        log_fields:
          appname: "2026-07-21"
          facility: "local7"
          host: "HET-WAF"
          hostname: "HET-WAF"
          message: "08:57:45 WAF: 43.159.128.237:40284->www.xtszxyy.com dip=220.170.15.132 devicename=HET-WAF url=/ method=GET args= flag_field= block_time=0 http_type= attack_field=0 profile_id=4 rule_id=9 type=HTTP Conformity Rule severity=2 action=REJECT referer= useragent= post= equipment=1 os=1 browser=2 |"
          severity: "warning"
          source_ip: "192.168.42.234"
          source_type: "syslog"
          timestamp: "2026-07-21T00:57:45Z"
    outputs:
      - extract_from: "validate_het_waf_2516p_source"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.source_ip, "192.168.42.234")
              assert_eq!(.host, "HET-WAF")
              true

  - name: "非 WAF 来源 IP 应进入 dead-letter 输出"
    inputs:
      - insert_at: "validate_het_waf_2516p_source"
        type: "log"
        log_fields:
          source_ip: "192.168.42.100"
          message: "unrelated syslog"
    outputs:
      - extract_from: "validate_het_waf_2516p_source.dropped"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.metadata.dropped.component_id, "validate_het_waf_2516p_source")
              assert!(contains(to_string!(.metadata.dropped.message), "来源 IP"))
              true
