---
sources:
  het_waf_2516p_kafka_input:
    type: "kafka"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    group_id: "${HET_WAF_2516P_CLICKHOUSE_GROUP_ID:-hetwaf2516p-waf-v1}"
    topics:
      - "${HET_WAF_2516P_SYSLOG_TOPIC:-hetwaf2516p-syslog-raw}"
    auto_offset_reset: "earliest"
    decoding:
      codec: "bytes"

transforms:
  route_het_waf_2516p_record_type:
    type: "route"
    inputs:
      - "het_waf_2516p_kafka_input"
    reroute_unmatched: true
    route:
      het_waf_2516p_rule_event:
        type: "vrl"
        source: |-
          raw_event = to_string(.message) ?? ""
          parsed_event, event_parse_error = parse_json(raw_event)
          if event_parse_error != null || !is_object(parsed_event) {
            false
          } else {
            event = object!(parsed_event)
            event_source_ip = to_string(event.source_ip) ?? ""
            raw_waf_message = strip_whitespace(to_string(event.message) ?? "")
            event_source_ip == "${HET_WAF_2516P_SOURCE_IP:-192.168.42.234}" &&
              match(raw_waf_message, r'^\d{2}:\d{2}:\d{2}\s+WAF:\s+') &&
              contains(raw_waf_message, " type=") &&
              contains(raw_waf_message, " severity=") &&
              match(raw_waf_message, r'\|\s*$')
          }
      het_waf_2516p_raw_event:
        type: "vrl"
        source: |-
          raw_event = to_string(.message) ?? ""
          parsed_event, event_parse_error = parse_json(raw_event)
          if event_parse_error != null || !is_object(parsed_event) {
            true
          } else {
            event = object!(parsed_event)
            event_source_ip = to_string(event.source_ip) ?? ""
            raw_waf_message = strip_whitespace(to_string(event.message) ?? "")
            !(event_source_ip == "${HET_WAF_2516P_SOURCE_IP:-192.168.42.234}" &&
              match(raw_waf_message, r'^\d{2}:\d{2}:\d{2}\s+WAF:\s+') &&
              contains(raw_waf_message, " type=") &&
              contains(raw_waf_message, " severity=") &&
              match(raw_waf_message, r'\|\s*$'))
          }

  map_het_waf_2516p_rule_event:
    type: "remap"
    inputs:
      - "route_het_waf_2516p_record_type.het_waf_2516p_rule_event"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_event = to_string(.message) ?? ""
      parsed_event, event_parse_error = parse_json(raw_event)
      assert_eq!(event_parse_error, null, message: "HET-WAF-2516P 原始 Kafka 消息必须是合法 JSON")
      assert!(is_object(parsed_event), message: "HET-WAF-2516P 原始 Kafka 消息必须是 JSON 对象")
      event = object!(parsed_event)

      raw_syslog_message = to_string(event.message) ?? ""
      assert!(raw_syslog_message != "", message: "HET-WAF-2516P 外层 message 不能为空")
      normalized_message = strip_whitespace(raw_syslog_message)
      parsed_fields, fields_parse_error = parse_regex(normalized_message, r'^(?P<device_time>\d{2}:\d{2}:\d{2})\s+WAF:\s+(?P<client_ip>[0-9A-Fa-f:.]+):(?P<client_port>\d+)->(?P<request_host>\S*)\s+dip=(?P<destination_ip>\S*)\s+devicename=(?P<devicename>\S*)\s+url=(?P<url>\S*)\s+method=(?P<method>\S*)\s+args=(?P<args>.*?)\s+flag_field=(?P<flag_field>.*?)\s+block_time=(?P<block_time>\d+)\s+http_type=(?P<http_type>.*?)\s+attack_field=(?P<attack_field>\d+)\s+profile_id=(?P<profile_id>\d+)\s+rule_id=(?P<rule_id>\d+)\s+type=(?P<type>.*?)\s+severity=(?P<severity>\d+)\s+action=(?P<action>\S*)\s+referer=(?P<referer>.*?)\s+useragent=(?P<useragent>.*?)\s+post=(?P<post>.*?)\s+equipment=(?P<equipment>\d+)\s+os=(?P<os>\d+)\s+browser=(?P<browser>\d+)\s+\|\s*$')
      assert_eq!(fields_parse_error, null, message: "HET-WAF-2516P 规则事件消息结构不符合已建模格式")
      assert!(is_object(parsed_fields), message: "HET-WAF-2516P 规则事件解析结果必须是对象")
      fields = object(parsed_fields)

      raw_type = to_string(fields.type)
      assert!(raw_type != "", message: "HET-WAF-2516P type 不能为空")
      raw_syslog_source_ip = to_string(event.source_ip) ?? ""
      assert_eq!(raw_syslog_source_ip, "${HET_WAF_2516P_SOURCE_IP:-192.168.42.234}", message: "HET-WAF-2516P 外层 source_ip 必须为配置的 WAF 地址")

      out = {}

      rule_id, rule_id_error = to_int(to_string(fields.rule_id))
      assert_eq!(rule_id_error, null, message: "HET-WAF-2516P rule_id 必须为非负整数")
      assert!(rule_id >= 0, message: "HET-WAF-2516P rule_id 不能为负数")
      out.rule_id = rule_id

      raw_syslog_timestamp = to_string(event.timestamp) ?? ""
      parsed_syslog_timestamp, syslog_timestamp_error = parse_timestamp(raw_syslog_timestamp, format: "%+")
      assert_eq!(syslog_timestamp_error, null, message: "HET-WAF-2516P 外层 timestamp 必须为 RFC3339 时间")
      out.syslog_timestamp = format_timestamp!(parsed_syslog_timestamp, format: "%Y-%m-%d %H:%M:%S.%3f", timezone: "UTC")

      out.device_time = to_string(fields.device_time)
      out.type = raw_type
      out.action = to_string(fields.action)

      severity, severity_error = to_int(to_string(fields.severity))
      assert_eq!(severity_error, null, message: "HET-WAF-2516P severity 必须为非负整数")
      assert!(severity >= 0 && severity <= 255, message: "HET-WAF-2516P severity 必须在 0 到 255 之间")
      out.severity = severity

      out.client_ip = to_string(fields.client_ip)
      client_port, client_port_error = to_int(to_string(fields.client_port))
      assert_eq!(client_port_error, null, message: "HET-WAF-2516P client_port 必须为整数")
      assert!(client_port >= 0 && client_port <= 65535, message: "HET-WAF-2516P client_port 必须在 0 到 65535 之间")
      out.client_port = client_port
      out.request_host = to_string(fields.request_host)
      out.destination_ip = to_string(fields.destination_ip)
      out.devicename = to_string(fields.devicename)
      out.url = to_string(fields.url)
      out.method = to_string(fields.method)
      out.args = to_string(fields.args)
      out.flag_field = to_string(fields.flag_field)

      block_time, block_time_error = to_int(to_string(fields.block_time))
      assert_eq!(block_time_error, null, message: "HET-WAF-2516P block_time 必须为非负整数")
      assert!(block_time >= 0 && block_time <= 4294967295, message: "HET-WAF-2516P block_time 必须在 0 到 4294967295 之间")
      out.block_time = block_time
      out.http_type = to_string(fields.http_type)

      attack_field, attack_field_error = to_int(to_string(fields.attack_field))
      assert_eq!(attack_field_error, null, message: "HET-WAF-2516P attack_field 必须为非负整数")
      assert!(attack_field >= 0 && attack_field <= 65535, message: "HET-WAF-2516P attack_field 必须在 0 到 65535 之间")
      out.attack_field = attack_field

      profile_id, profile_id_error = to_int(to_string(fields.profile_id))
      assert_eq!(profile_id_error, null, message: "HET-WAF-2516P profile_id 必须为非负整数")
      assert!(profile_id >= 0, message: "HET-WAF-2516P profile_id 不能为负数")
      out.profile_id = profile_id
      out.referer = to_string(fields.referer)
      out.useragent = to_string(fields.useragent)
      out.post = to_string(fields.post)

      equipment, equipment_error = to_int(to_string(fields.equipment))
      assert_eq!(equipment_error, null, message: "HET-WAF-2516P equipment 必须为非负整数")
      assert!(equipment >= 0 && equipment <= 65535, message: "HET-WAF-2516P equipment 必须在 0 到 65535 之间")
      out.equipment = equipment

      os_value, os_value_error = to_int(to_string(fields.os))
      assert_eq!(os_value_error, null, message: "HET-WAF-2516P os 必须为非负整数")
      assert!(os_value >= 0 && os_value <= 65535, message: "HET-WAF-2516P os 必须在 0 到 65535 之间")
      out.os = os_value

      browser, browser_error = to_int(to_string(fields.browser))
      assert_eq!(browser_error, null, message: "HET-WAF-2516P browser 必须为非负整数")
      assert!(browser >= 0 && browser <= 65535, message: "HET-WAF-2516P browser 必须在 0 到 65535 之间")
      out.browser = browser

      out.syslog_appname = to_string(event.appname) ?? ""
      out.syslog_facility = to_string(event.facility) ?? ""
      out.syslog_host = to_string(event.host) ?? ""
      out.syslog_hostname = to_string(event.hostname) ?? ""
      out.syslog_severity = to_string(event.severity) ?? ""
      out.syslog_source_ip = raw_syslog_source_ip
      out.syslog_source_type = to_string(event.source_type) ?? ""
      out.syslog_message = raw_syslog_message

      . = out

  map_het_waf_2516p_raw_event:
    type: "remap"
    inputs:
      - "route_het_waf_2516p_record_type.het_waf_2516p_raw_event"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_event = to_string(.message) ?? ""
      parsed_event, event_parse_error = parse_json(raw_event)
      assert_eq!(event_parse_error, null, message: "HET-WAF-2516P 原始 Kafka 消息必须是合法 JSON")
      assert!(is_object(parsed_event), message: "HET-WAF-2516P 原始 Kafka 消息必须是 JSON 对象")
      event = object!(parsed_event)

      raw_syslog_source_ip = to_string(event.source_ip) ?? ""
      assert_eq!(raw_syslog_source_ip, "${HET_WAF_2516P_SOURCE_IP:-192.168.42.234}", message: "HET-WAF-2516P 外层 source_ip 必须为配置的 WAF 地址")

      raw_syslog_timestamp = to_string(event.timestamp) ?? ""
      parsed_syslog_timestamp, syslog_timestamp_error = parse_timestamp(raw_syslog_timestamp, format: "%+")
      assert_eq!(syslog_timestamp_error, null, message: "HET-WAF-2516P 外层 timestamp 必须为 RFC3339 时间")

      raw_syslog_message = to_string(event.message) ?? ""
      normalized_message = strip_whitespace(raw_syslog_message)
      prefix_fields, prefix_parse_error = parse_regex(normalized_message, r'^(?P<device_time>\d{2}:\d{2}:\d{2})\s+(?P<event_type>[^:]+):')

      out = {}
      out.syslog_timestamp = format_timestamp!(parsed_syslog_timestamp, format: "%Y-%m-%d %H:%M:%S.%3f", timezone: "UTC")
      if prefix_parse_error == null && is_object(prefix_fields) {
        prefix = object(prefix_fields)
        out.device_time = to_string(prefix.device_time)
        out.event_type = to_string(prefix.event_type)
      } else {
        out.device_time = ""
        out.event_type = "UNKNOWN"
      }
      out.syslog_appname = to_string(event.appname) ?? ""
      out.syslog_facility = to_string(event.facility) ?? ""
      out.syslog_host = to_string(event.host) ?? ""
      out.syslog_hostname = to_string(event.hostname) ?? ""
      out.syslog_severity = to_string(event.severity) ?? ""
      out.syslog_source_ip = raw_syslog_source_ip
      out.syslog_source_type = to_string(event.source_type) ?? ""
      out.syslog_message = raw_syslog_message

      . = out

sinks:
  het_waf_2516p_dead_letter:
    type: "kafka"
    inputs:
      - "map_het_waf_2516p_rule_event.dropped"
      - "map_het_waf_2516p_raw_event.dropped"
      - "route_het_waf_2516p_record_type._unmatched"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    topic: "${HET_WAF_2516P_DLQ_TOPIC:-hetwaf2516p-dead-letter}"
    compression: "zstd"
    encoding:
      codec: "json"
    librdkafka_options:
      request.required.acks: "-1"
      message.send.max.retries: "10"
      retry.backoff.ms: "1000"
    acknowledgements:
      enabled: true
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"

  het_waf_2516p_rule_clickhouse:
    type: "clickhouse"
    inputs:
      - "map_het_waf_2516p_rule_event"
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse-service:8123}"
    database: "${CLICKHOUSE_DATABASE:-zenvis}"
    table: "het_waf_2516p_rule_event"
    format: "json_each_row"
    compression: "gzip"
    date_time_best_effort: true
    auth:
      strategy: "basic"
      user: "${CLICKHOUSE_USER:-default}"
      password: "${CLICKHOUSE_PASSWORD:-SFGEfSVVMcUHCBCjKmzJ}"
    skip_unknown_fields: false
    acknowledgements:
      enabled: true
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"
    request:
      retry_attempts: 10
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 300
      timeout_secs: 30

  het_waf_2516p_raw_clickhouse:
    type: "clickhouse"
    inputs:
      - "map_het_waf_2516p_raw_event"
    endpoint: "${CLICKHOUSE_ENDPOINT:-http://clickhouse-service:8123}"
    database: "${CLICKHOUSE_DATABASE:-zenvis}"
    table: "het_waf_2516p_raw_event"
    format: "json_each_row"
    compression: "gzip"
    date_time_best_effort: true
    auth:
      strategy: "basic"
      user: "${CLICKHOUSE_USER:-default}"
      password: "${CLICKHOUSE_PASSWORD:-SFGEfSVVMcUHCBCjKmzJ}"
    skip_unknown_fields: false
    acknowledgements:
      enabled: true
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"
    request:
      retry_attempts: 10
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 300
      timeout_secs: 30

tests:
  - name: "HTTP Conformity Rule 事件应完成结构化转换"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"2026-07-21","facility":"local7","host":"HET-WAF","hostname":"HET-WAF","message":"08:57:45 WAF: 43.159.128.237:40284->www.xtszxyy.com dip=220.170.15.132 devicename=HET-WAF url=/ method=GET args= flag_field= block_time=0 http_type= attack_field=0 profile_id=4 rule_id=9 type=HTTP Conformity Rule severity=2 action=REJECT referer= useragent= post= equipment=1 os=1 browser=2 |","severity":"warning","source_ip":"192.168.42.234","source_type":"syslog","timestamp":"2026-07-21T00:57:45Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_rule_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.type, "HTTP Conformity Rule")
              assert_eq!(.rule_id, 9)
              assert_eq!(.client_ip, "43.159.128.237")
              assert_eq!(.client_port, 40284)
              assert_eq!(.syslog_timestamp, "2026-07-21 00:57:45.000")
              true

  - name: "空 request_host 的事件应完成结构化转换"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"2026-07-26","facility":"local7","host":"HET-WAF","hostname":"HET-WAF","message":"02:36:37 WAF: 116.10.202.60:55654-> dip=220.170.15.131 devicename=HET-WAF url=/ method=OPTIONS args= flag_field= block_time=0 http_type= attack_field=0 profile_id=4 rule_id=9 type=Signature Rule severity=2 action=REJECT referer= useragent= post= equipment=1 os=1 browser=2 |","severity":"warning","source_ip":"192.168.42.234","source_type":"syslog","timestamp":"2026-07-25T18:36:37Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_rule_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.type, "Signature Rule")
              assert_eq!(.request_host, "")
              assert_eq!(.destination_ip, "220.170.15.131")
              true

  - name: "未预定义的 ASCN Rule 事件应完成结构化转换"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"2026-07-29","facility":"local7","host":"HET-WAF","hostname":"HET-WAF","message":"21:39:05 WAF: 148.251.18.100:40903->xtszxyy.com dip=220.170.15.131 devicename=HET-WAF url=/_ascnlink_k method=GET args= flag_field= block_time=7200 http_type= attack_field=0 profile_id=3 rule_id=2 type=ASCN Rule severity=1 action=BLOCK referer= useragent= post= equipment=1 os=0 browser=1 |","severity":"warning","source_ip":"192.168.42.234","source_type":"syslog","timestamp":"2026-07-29T13:39:05Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_rule_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.type, "ASCN Rule")
              assert_eq!(.rule_id, 2)
              assert_eq!(.block_time, 7200)
              true

  - name: "DDoS 类型应完整进入原始事件输出"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"2026-07-30","facility":"local7","host":"HET-WAF","hostname":"HET-WAF","message":"07:03:24 DDoS:设备名称:HET-WAF 入侵ip:123.160.223.74 入侵端口:13623 被攻击ip:220.170.15.132 被攻击端口:443 协议类型:TCP 攻击类型:TCP Syn Flood 被攻击url: 被攻击域名: CDN ip:0.0.0.0 XFF ip:0.0.0.0 严重级别:高级 攻击次数:1","severity":"warning","source_ip":"192.168.42.234","source_type":"syslog","timestamp":"2026-07-29T23:03:24Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_raw_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.event_type, "DDoS")
              assert_eq!(.device_time, "07:03:24")
              assert!(contains(to_string!(.syslog_message), "TCP Syn Flood"))
              true

  - name: "演示规则事件应保留 demo 标识并完成结构化入库"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"HET-WAF-2516P-DEMO","facility":"local7","host":"HET-WAF-DEMO","hostname":"HET-WAF-DEMO","message":"09:20:15 WAF: 203.0.113.45:51842->www.example.com dip=220.170.15.132 devicename=HET-WAF-DEMO url=/login method=GET args=next=/dashboard flag_field= block_time=0 http_type= attack_field=0 profile_id=4 rule_id=9 type=HTTP Conformity Rule severity=2 action=REJECT referer=https://demo.example.com/login useragent=Zenvis-Demo-Agent/1.0 post= equipment=1 os=1 browser=2 |","severity":"warning","source_ip":"192.168.42.234","source_type":"demo","timestamp":"2026-10-22T01:20:15Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_rule_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.syslog_source_type, "demo")
              assert_eq!(.devicename, "HET-WAF-DEMO")
              assert_eq!(.syslog_host, "HET-WAF-DEMO")
              assert_eq!(.client_ip, "203.0.113.45")
              true

  - name: "非法客户端端口应进入 dropped 输出"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"2026-07-21","facility":"local7","host":"HET-WAF","hostname":"HET-WAF","message":"08:57:45 WAF: 43.159.128.237:70000->www.xtszxyy.com dip=220.170.15.132 devicename=HET-WAF url=/ method=GET args= flag_field= block_time=0 http_type= attack_field=0 profile_id=4 rule_id=9 type=HTTP Conformity Rule severity=2 action=REJECT referer= useragent= post= equipment=1 os=1 browser=2 |","severity":"warning","source_ip":"192.168.42.234","source_type":"syslog","timestamp":"2026-07-21T00:57:45Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_rule_event.dropped"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.metadata.dropped.component_id, "map_het_waf_2516p_rule_event")
              assert!(contains(to_string!(.metadata.dropped.message), "client_port"))
              true

  - name: "非法 JSON 消息应进入 dead-letter 输出"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: "not-a-json-syslog-event"
    outputs:
      - extract_from: "map_het_waf_2516p_raw_event.dropped"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.metadata.dropped.component_id, "map_het_waf_2516p_raw_event")
              assert!(contains(to_string!(.metadata.dropped.message), "合法 JSON"))
              true

  - name: "非 WAF 来源应进入 dead-letter 输出"
    inputs:
      - insert_at: "route_het_waf_2516p_record_type"
        type: "log"
        log_fields:
          message: |-
            {"appname":"2026-07-21","facility":"local7","host":"other","hostname":"other","message":"08:57:45 WAF: 1.2.3.4:1234->example.com dip=5.6.7.8 devicename=HET-WAF url=/ method=GET args= flag_field= block_time=0 http_type= attack_field=0 profile_id=4 rule_id=9 type=Signature Rule severity=2 action=REJECT referer= useragent= post= equipment=1 os=1 browser=2 |","severity":"warning","source_ip":"192.168.42.100","source_type":"syslog","timestamp":"2026-07-21T00:57:45Z"}
    outputs:
      - extract_from: "map_het_waf_2516p_raw_event.dropped"
        conditions:
          - type: "vrl"
            source: |-
