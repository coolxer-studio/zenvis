<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>惠尔特 HET-WAF-2516P 安全态势</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#07111c;
      --surface:#0b1825;
      --surface-2:#102233;
      --surface-3:#162c3f;
      --border:rgba(118,172,212,.18);
      --border-strong:rgba(118,172,212,.34);
      --text:#edf5fb;
      --muted:#94a9ba;
      --dim:#6f8799;
      --blue:#4fa3ff;
      --cyan:#3ad2d8;
      --green:#35d28f;
      --orange:#ffb547;
      --red:#ff6978;
      --violet:#a78bfa;
      --radius:13px;
      --shadow:0 18px 46px rgba(0,5,12,.28),inset 0 1px rgba(255,255,255,.025);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-height:0;margin:0}
    body{overflow:hidden;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;background:radial-gradient(circle at 16% 0,rgba(79,163,255,.12),transparent 30%),radial-gradient(circle at 84% 14%,rgba(58,210,216,.06),transparent 28%),var(--bg);-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit}
    .dashboard{display:flex;width:100%;height:100%;min-height:0;flex-direction:column;gap:10px;padding:14px 18px 16px}
    .topbar{display:flex;min-height:42px;flex:0 0 auto;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;min-width:0;align-items:center;gap:12px}
    .brand-mark{position:relative;display:grid;width:36px;height:36px;flex:0 0 auto;place-items:center;border:1px solid var(--border-strong);border-radius:11px;background:linear-gradient(145deg,#173049,#0a1826);box-shadow:inset 0 1px rgba(255,255,255,.06)}
    .brand-mark::before{width:15px;height:18px;border:2px solid var(--green);border-radius:8px 8px 11px 11px;clip-path:polygon(50% 0,100% 21%,90% 74%,50% 100%,10% 74%,0 21%);content:""}
    .brand h1{overflow:hidden;margin:0;font-size:19px;line-height:1.3;font-weight:720;letter-spacing:-.02em;text-overflow:ellipsis;white-space:nowrap}
    .brand p{margin:3px 0 0;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .toolbar{display:flex;min-width:0;align-items:center;gap:8px}
    .status{display:flex;min-width:0;align-items:center;gap:7px;color:var(--muted);font-size:11px;white-space:nowrap}
    .dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(111,135,153,.12)}
    .dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(53,210,143,.13)}
    .dot.warn{background:var(--orange);box-shadow:0 0 0 3px rgba(255,181,71,.14)}
    .dot.error{background:var(--red);box-shadow:0 0 0 3px rgba(255,105,120,.14)}
    .updated{color:var(--dim);font-size:10px;white-space:nowrap}
    .button{display:inline-flex;height:32px;align-items:center;justify-content:center;padding:0 12px;border:1px solid var(--border);border-radius:9px;color:var(--muted);background:rgba(12,28,43,.8);font-size:11px;cursor:pointer;transition:border-color .16s ease,color .16s ease,background .16s ease}
    .button:hover,.button:focus-visible{border-color:var(--border-strong);color:var(--text);background:var(--surface-2);outline:0}
    .button.primary{color:#dff1ff;border-color:rgba(79,163,255,.35);background:rgba(79,163,255,.12)}
    .button.loading::before{width:10px;height:10px;margin-right:7px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;content:"";animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .notice{display:none;flex:0 0 auto;padding:7px 11px;border:1px solid rgba(255,181,71,.25);border-radius:9px;color:#ffd38d;background:rgba(255,181,71,.08);font-size:11px;line-height:1.4}
    .notice.visible{display:block}
    .kpis{display:grid;min-height:0;flex:0 0 auto;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
    .kpi{position:relative;display:flex;min-height:82px;min-width:0;flex-direction:column;justify-content:space-between;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(145deg,rgba(19,42,61,.92),rgba(8,22,35,.92));box-shadow:var(--shadow);overflow:hidden}
    .kpi::before{position:absolute;top:0;right:0;left:0;height:2px;content:"";background:var(--tone,var(--blue));opacity:.75}
    .kpi[data-state="stale"]{border-color:rgba(255,181,71,.32)}
    .kpi[data-state="unavailable"]{opacity:.66}
    .kpi-label{overflow:hidden;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.04em;text-overflow:ellipsis;white-space:nowrap}
    .kpi-value{overflow:hidden;margin-top:4px;font-variant-numeric:tabular-nums;font-size:25px;font-weight:760;letter-spacing:-.03em;text-overflow:ellipsis;white-space:nowrap}
    .kpi-note{overflow:hidden;color:var(--dim);font-size:9.5px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}
    .grid{display:grid;min-height:0;flex:1 1 auto;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.12fr) minmax(0,.88fr);gap:9px}
    .panel{display:flex;min-width:0;min-height:0;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(150deg,rgba(14,33,49,.94),rgba(7,19,30,.94));box-shadow:var(--shadow);overflow:hidden}
    .panel-head{display:flex;min-height:34px;flex:0 0 auto;align-items:center;justify-content:space-between;gap:8px;padding:0 11px;border-bottom:1px solid rgba(118,172,212,.12)}
    .panel-title{overflow:hidden;font-size:11px;font-weight:650;letter-spacing:.02em;text-overflow:ellipsis;white-space:nowrap}
    .panel-meta{overflow:hidden;color:var(--dim);font-size:9.5px;text-overflow:ellipsis;white-space:nowrap}
    .panel-body{position:relative;min-height:0;flex:1 1 auto;padding:8px 10px 9px}
    .panel-body.scroll-body{overflow:auto;scrollbar-color:rgba(118,172,212,.28) transparent;scrollbar-width:thin}
    .panel-body.scroll-body::-webkit-scrollbar{width:6px;height:6px}
    .panel-body.scroll-body::-webkit-scrollbar-thumb{border-radius:99px;background:rgba(118,172,212,.28)}
    .trend{grid-column:1 / span 2;grid-row:1}
    .actions{grid-column:3;grid-row:1}
    .ips{grid-column:1;grid-row:2}
    .types{grid-column:2;grid-row:2}
    .recent{grid-column:3;grid-row:2}
    .trend .panel-body{display:flex;min-height:0;flex-direction:column;gap:5px;overflow:hidden;padding:7px 10px 9px}
    .legend{display:flex;flex:0 0 auto;align-items:center;gap:12px;color:var(--muted);font-size:9.5px}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .swatch{width:8px;height:8px;border-radius:50%;background:var(--swatch)}
    .chart-wrap{position:relative;min-height:0;flex:1 1 auto}
    .chart-wrap canvas{display:block;width:100%;height:100%}
    .bar-list{display:flex;min-height:100%;flex-direction:column;justify-content:flex-start;gap:7px}
    .bar-row{display:grid;min-width:0;grid-template-columns:minmax(52px,88px) minmax(0,1fr) auto;align-items:center;gap:7px}
    .bar-label{overflow:hidden;color:var(--muted);font-size:9.5px;text-overflow:ellipsis;white-space:nowrap}
    .bar-track{height:5px;border-radius:99px;background:rgba(118,172,212,.1);overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:var(--bar,var(--blue));transform-origin:left center}
    .bar-value{min-width:24px;color:var(--text);font-size:9.5px;font-variant-numeric:tabular-nums;text-align:right}
    .empty{display:grid;min-height:100%;place-items:center;color:var(--dim);font-size:10px}
    .event-list{display:flex;min-height:0;flex-direction:column;gap:5px}
    .event-row{display:grid;min-width:0;grid-template-columns:minmax(56px,.7fr) minmax(58px,.8fr) minmax(55px,.7fr) minmax(0,1.3fr) minmax(0,1.2fr);align-items:center;gap:6px;padding:6px 7px;border:1px solid transparent;border-radius:8px;background:rgba(16,34,51,.58);color:inherit;font-size:9.5px;text-align:left;cursor:pointer}
    .event-row:hover,.event-row:focus-visible{border-color:var(--border-strong);background:rgba(22,44,63,.8);outline:0}
    .event-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .event-time{color:var(--dim);font-variant-numeric:tabular-nums}
    .event-rule{color:#b9d8ff;font-variant-numeric:tabular-nums}
    .event-action{color:var(--green)}
    .event-action[data-reject="true"]{color:var(--red)}
    .event-ip{color:var(--text)}
    .event-host{color:var(--muted)}
    .toast{position:fixed;right:18px;bottom:16px;z-index:5;max-width:320px;padding:8px 12px;border:1px solid var(--border-strong);border-radius:9px;color:var(--text);background:rgba(16,34,51,.96);box-shadow:0 14px 32px rgba(0,0,0,.3);font-size:11px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
    .toast.visible{opacity:1;transform:none}
    @media (max-width:1180px){
      .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
      .kpi{min-height:68px}
      .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
      .trend{grid-column:1 / span 2;grid-row:1}
      .actions{grid-column:1;grid-row:2}.ips{grid-column:2;grid-row:2}.types{grid-column:1;grid-row:3}.recent{grid-column:2;grid-row:3}
    }
    @media (max-width:760px){
      body{overflow:auto}
      .dashboard{height:auto;min-height:100%}
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .grid{grid-template-columns:1fr;grid-template-rows:repeat(5,220px)}
      .trend,.actions,.ips,.types,.recent{grid-column:1;grid-row:auto}
    }
  </style>
</head>
<body>
  <div class="dashboard" id="dashboard" aria-busy="true">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>惠尔特 HET-WAF-2516P 安全态势</h1>
          <p>WAF rule events · raw syslog · operational overview</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">正在连接数据服务</span></div>
        <span class="updated" id="updated">尚未更新</span>
        <button class="button" type="button" id="openApp">打开事件应用</button>
        <button class="button primary" type="button" id="refresh">刷新</button>
      </div>
    </header>
    <div class="notice" id="notice"></div>
    <section class="kpis" aria-label="关键指标">
      <article class="kpi" style="--tone:var(--blue)"><div class="kpi-label">规则事件总量</div><div class="kpi-value" id="kpiRuleTotal">—</div><div class="kpi-note">历史累计</div></article>
      <article class="kpi" style="--tone:var(--cyan)"><div class="kpi-label">今日规则事件</div><div class="kpi-value" id="kpiRuleToday">—</div><div class="kpi-note">按设备事件时间</div></article>
      <article class="kpi" style="--tone:var(--red)"><div class="kpi-label">今日拒绝率</div><div class="kpi-value" id="kpiRejectRate">—</div><div class="kpi-note">REJECT / 今日处置</div></article>
      <article class="kpi" style="--tone:var(--violet)"><div class="kpi-label">今日客户端 IP</div><div class="kpi-value" id="kpiClients">—</div><div class="kpi-note">按 client_ip 去重</div></article>
      <article class="kpi" style="--tone:var(--green)"><div class="kpi-label">命中规则数</div><div class="kpi-value" id="kpiRules">—</div><div class="kpi-note">按 rule_id 去重</div></article>
      <article class="kpi" style="--tone:var(--orange)"><div class="kpi-label">原始事件总量</div><div class="kpi-value" id="kpiRawTotal">—</div><div class="kpi-note">DDoS 与未知格式</div></article>
    </section>
    <main class="grid">
      <section class="panel trend">
        <div class="panel-head"><span class="panel-title">近 7 日事件趋势</span><span class="panel-meta">规则事件 / 原始事件</span></div>
        <div class="panel-body">
          <div class="legend"><span><i class="swatch" style="--swatch:var(--blue)"></i>规则事件</span><span><i class="swatch" style="--swatch:var(--orange)"></i>原始事件</span></div>
          <div class="chart-wrap"><canvas id="trendCanvas" role="img" aria-label="近 7 日事件趋势"></canvas></div>
        </div>
      </section>
      <section class="panel actions">
        <div class="panel-head"><span class="panel-title">今日处置动作</span><span class="panel-meta" id="actionMeta">—</span></div>
        <div class="panel-body scroll-body"><div class="bar-list" id="actionBars"></div></div>
      </section>
      <section class="panel ips">
        <div class="panel-head"><span class="panel-title">近 7 日 Top 客户端 IP</span><span class="panel-meta">Top 10</span></div>
        <div class="panel-body scroll-body"><div class="bar-list" id="ipBars"></div></div>
      </section>
      <section class="panel types">
        <div class="panel-head"><span class="panel-title">检测类型分布</span><span class="panel-meta">历史累计</span></div>
        <div class="panel-body scroll-body"><div class="bar-list" id="typeBars"></div></div>
      </section>
      <section class="panel recent">
        <div class="panel-head"><span class="panel-title">最近规则事件</span><span class="panel-meta">点击查看详情</span></div>
        <div class="panel-body scroll-body"><div class="event-list" id="eventList"></div></div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
    (() => {
      "use strict";
      const RULE = "het_waf_2516p_rule_event";
      const RAW = "het_waf_2516p_raw_event";
      const APP = "com.coolxer.plugin.hetwaf2516p.app";
      const DETAIL = "com.coolxer.plugin.hetwaf2516p.detail-rule-event";
      const REFRESH_SECONDS = 30;
      const state = {
        roots: [],
        loading: false,
        loaded: false,
        requestId: 0,
        seconds: REFRESH_SECONDS,
        metrics: {},
        metricStates: {},
        trend: { labels: [], series: [] },
        trendRows: [],
        events: [],
        eventInitialized: false,
        eventKeys: new Set(),
        resizeFrame: 0
      };
      const el = id => document.getElementById(id);
      const n = value => {
        const number = Number(value);
        return Number.isFinite(number) ? number : 0;
      };
      const format = value => new Intl.NumberFormat("zh-CN").format(n(value));
      const escapeHtml = value => String(value == null ? "" : value).replace(/[&<>"']/g, character => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[character]));
      const rows = source => {
        const result = source && source.result ? source.result : source;
        return result && Array.isArray(result.rows) ? result.rows : [];
      };

      function apiRoots() {
        const preferred = location.pathname.startsWith("/zenvis/")
          ? ["/zenvis/api/v1", "/api/v1"]
          : ["/api/v1", "/zenvis/api/v1"];
        return state.roots.length
          ? state.roots.concat(preferred.filter(root => !state.roots.includes(root)))
          : preferred;
      }

      async function requestJson(path, options) {
        let lastError = new Error("数据服务不可用");
        for (const root of apiRoots()) {
          const controller = new AbortController();
          const timer = window.setTimeout(() => controller.abort(), 12000);
          try {
            const config = Object.assign({
              credentials: "include",
              cache: "no-store",
              signal: controller.signal,
              headers: { Accept: "application/json" }
            }, options || {});
            if (config.body) config.headers = Object.assign({}, config.headers, { "Content-Type": "application/json" });
            const response = await fetch(root + path, config);
            if (!response.ok || !(response.headers.get("content-type") || "").includes("application/json")) {
              throw new Error("HTTP " + response.status);
            }
            const payload = await response.json();
            if (payload.status !== 0) throw new Error(payload.msg || "业务状态 " + payload.status);
            state.roots = [root];
            return payload.data || {};
          } catch (error) {
            lastError = error;
          } finally {
            window.clearTimeout(timer);
          }
        }
        throw lastError;
      }

      const post = (path, body) => requestJson("/entity" + path, { method: "POST", body: JSON.stringify(body) });
      async function safe(label, task) {
        try { return { label, ok: true, value: await task }; }
        catch (error) { return { label, ok: false, error }; }
      }

      const allTime = { time_range: { preset: "ALL_TIME" }, comparison: "NONE" };
      const today = { time_range: { preset: "TODAY" }, comparison: "NONE" };
      const last7Days = { time_range: { preset: "LAST_7_DAYS" }, comparison: "NONE" };

      function overviewValue(source, field) {
        const list = rows(source);
        return list.length ? n(list[0][field]) : 0;
      }

      function setMetric(key, value, fresh, suffix) {
        if (fresh && Number.isFinite(Number(value))) {
          state.metrics[key] = Number(value);
          state.metricStates[key] = "fresh";
        } else if (Object.prototype.hasOwnProperty.call(state.metrics, key)) {
          state.metricStates[key] = "stale";
        } else {
          state.metrics[key] = null;
          state.metricStates[key] = "unavailable";
        }
        const target = el("kpi" + key.charAt(0).toUpperCase() + key.slice(1));
        if (!target) return;
        const current = state.metrics[key];
        target.textContent = current == null ? "—" : format(current) + (suffix || "");
        target.closest(".kpi").dataset.state = state.metricStates[key];
        target.title = state.metricStates[key] === "stale" ? "上次成功数据，当前请求暂不可用" : "";
      }

      function setKpiState(id, stateName) {
        const target = el(id);
        if (target) target.closest(".kpi").dataset.state = stateName;
      }

      function setBarList(id, list, color) {
        const target = el(id);
        if (!target) return;
        const items = list.slice(0, 12).filter(item => item && item.value > 0);
        if (!items.length) {
          target.innerHTML = '<div class="empty">暂无数据</div>';
          return;
        }
        const max = Math.max.apply(null, items.map(item => item.value)) || 1;
        target.innerHTML = items.map(item => {
          const width = Math.max(2, Math.round(item.value / max * 100));
          return '<div class="bar-row"><span class="bar-label" title="' + escapeHtml(item.label) + '">' + escapeHtml(item.label) + '</span><span class="bar-track"><i class="bar-fill" style="width:' + width + '%;--bar:' + color + '"></i></span><span class="bar-value">' + format(item.value) + '</span></div>';
        }).join("");
      }

      function distributionItems(result) {
        return rows(result).map(row => ({
          label: String(row.bucket == null || row.bucket === "" ? "空值" : row.bucket),
          value: n(row.value)
        })).sort((left, right) => right.value - left.value);
      }

      function trendData(result) {
        const list = rows(result);
        const buckets = Array.from(new Set(list.map(row => String(row.bucket || "")).filter(Boolean))).sort();
        const index = { "规则事件": {}, "原始事件": {} };
        list.forEach(row => {
          const label = String(row.label || "");
          if (!Object.prototype.hasOwnProperty.call(index, label)) return;
          index[label][String(row.bucket || "")] = n(row.value);
        });
        return {
          labels: buckets,
          series: [
            { name: "规则事件", color: "#4fa3ff", values: buckets.map(bucket => n(index["规则事件"][bucket])) },
            { name: "原始事件", color: "#ffb547", values: buckets.map(bucket => n(index["原始事件"][bucket])) }
          ]
        };
      }

      function drawTrend() {
        const canvas = el("trendCanvas");
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const ratio = Math.min(2.5, window.devicePixelRatio || 1);
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        const context = canvas.getContext("2d");
        if (!context) return;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, width, height);
        const data = state.trend;
        if (!data.labels.length || !data.series.length) {
          context.fillStyle = "#6f8799";
          context.font = '10px Inter, "PingFang SC", sans-serif';
          context.textAlign = "center";
          context.fillText("近 7 日暂无事件", width / 2, height / 2);
          return;
        }
        const padding = { left: 36, right: 12, top: 8, bottom: 22 };
        const plotWidth = Math.max(1, width - padding.left - padding.right);
        const plotHeight = Math.max(1, height - padding.top - padding.bottom);
        const maximum = Math.max(1, ...data.series.flatMap(series => series.values));
        const xAt = index => padding.left + (data.labels.length <= 1 ? plotWidth / 2 : index / (data.labels.length - 1) * plotWidth);
        const yAt = value => padding.top + plotHeight - value / maximum * plotHeight;
        context.font = '9px Inter, "PingFang SC", sans-serif';
        context.textBaseline = "middle";
        context.textAlign = "right";
        context.strokeStyle = "rgba(118,172,212,.11)";
        context.lineWidth = 1;
        for (let line = 0; line <= 4; line += 1) {
          const value = maximum * line / 4;
          const y = yAt(value);
          context.beginPath();
          context.moveTo(padding.left, y + .5);
          context.lineTo(width - padding.right, y + .5);
          context.stroke();
          context.fillStyle = "#6f8799";
          context.fillText(format(Math.round(value)), padding.left - 7, y);
        }
        context.textAlign = "center";
        context.textBaseline = "top";
        data.labels.forEach((label, index) => {
          const text = label.length >= 10 ? label.slice(5, 10) : label;
          const x = xAt(index);
          context.fillStyle = "#6f8799";
          context.fillText(text, x, height - padding.bottom + 7);
        });
        data.series.forEach(series => {
          context.save();
          context.beginPath();
          series.values.forEach((value, index) => {
            const x = xAt(index);
            const y = yAt(value);
            if (index === 0) context.moveTo(x, y); else context.lineTo(x, y);
          });
          context.strokeStyle = series.color;
          context.lineWidth = 1.8;
          context.lineJoin = "round";
          context.lineCap = "round";
          context.stroke();
          context.globalAlpha = .12;
          context.lineTo(xAt(series.values.length - 1), padding.top + plotHeight);
          context.lineTo(xAt(0), padding.top + plotHeight);
          context.closePath();
          context.fillStyle = series.color;
          context.fill();
          context.globalAlpha = 1;
          series.values.forEach((value, index) => {
            context.beginPath();
            context.arc(xAt(index), yAt(value), 2.1, 0, Math.PI * 2);
            context.fillStyle = series.color;
            context.fill();
          });
          context.restore();
        });
      }

      function eventKey(item) {
        return String(item && (item.zenvis_id || [item.syslog_timestamp, item.rule_id, item.client_ip, item.url].join("|")) || "");
      }

      function renderEvents() {
        const target = el("eventList");
        if (!target) return;
        if (!state.events.length) {
          target.innerHTML = '<div class="empty">暂无 HET-WAF 规则事件</div>';
          return;
        }
        const previousKeys = state.eventInitialized ? state.eventKeys : new Set();
        state.eventKeys = new Set(state.events.map(eventKey));
        state.eventInitialized = true;
        target.innerHTML = state.events.map(event => {
          const key = eventKey(event);
          const fresh = !previousKeys.has(key);
          const timestamp = String(event.syslog_timestamp || "-");
          const action = String(event.action || "-");
          return '<button type="button" class="event-row" data-record-id="' + escapeHtml(event.zenvis_id || "") + '" style="' + (fresh ? "border-color:rgba(79,163,255,.2);" : "") + '">'
            + '<span class="event-time" title="' + escapeHtml(timestamp) + '">' + escapeHtml(timestamp.length > 16 ? timestamp.slice(5, 16) : timestamp) + '</span>'
            + '<span class="event-rule" title="规则 ' + escapeHtml(event.rule_id) + '">#' + escapeHtml(event.rule_id == null ? "-" : event.rule_id) + '</span>'
            + '<span class="event-action" data-reject="' + (action.toUpperCase() === "REJECT" ? "true" : "false") + '">' + escapeHtml(action) + '</span>'
            + '<span class="event-ip" title="' + escapeHtml(event.client_ip) + '">' + escapeHtml(event.client_ip || "-") + '</span>'
            + '<span class="event-host" title="' + escapeHtml(event.request_host) + '">' + escapeHtml(event.request_host || "无域名") + '</span>'
            + '</button>';
        }).join("");
      }

      function setStatus(failures, succeeded) {
        const dot = el("statusDot");
        const text = el("statusText");
        const notice = el("notice");
        if (!failures.length) {
          dot.className = "dot ok";
          text.textContent = "数据服务已连接";
          notice.classList.remove("visible");
          notice.textContent = "";
        } else if (!succeeded) {
          dot.className = "dot error";
          text.textContent = state.loaded ? "刷新失败 · 保留上次数据" : "数据服务连接异常";
          notice.textContent = "暂时无法加载：" + failures.map(item => item.label).join("、");
          notice.classList.add("visible");
        } else {
          dot.className = "dot warn";
          text.textContent = "部分模块暂不可用";
          notice.textContent = "部分请求失败：" + failures.map(item => item.label).join("、");
          notice.classList.add("visible");
        }
      }

      async function loadDashboard(showFeedback) {
        if (state.loading) return;
        state.loading = true;
        state.seconds = REFRESH_SECONDS;
        const requestId = ++state.requestId;
        el("dashboard").setAttribute("aria-busy", "true");
        el("refresh").classList.add("loading");
        const tasks = await Promise.all([
          safe("规则事件总量", post("/overview/query", Object.assign({ entities: [RULE] }, allTime))),
          safe("今日规则事件", post("/overview/query", Object.assign({ entities: [RULE] }, today))),
          safe("今日处置动作", post("/distribution/query", Object.assign({ entity: RULE, dimension: "action", limit: 20, include_null: false }, today))),
          safe("今日客户端 IP", post("/summary/query", Object.assign({ entity: RULE, metrics: [{ name: "clients", operation: "DISTINCT_COUNT", field: "client_ip", label: "客户端 IP" }] }, today))),
          safe("命中规则数", post("/summary/query", Object.assign({ entity: RULE, metrics: [{ name: "rules", operation: "DISTINCT_COUNT", field: "rule_id", label: "规则数" }] }, allTime))),
          safe("原始事件总量", post("/overview/query", Object.assign({ entities: [RAW] }, allTime))),
          safe("客户端 IP 排行", post("/distribution/query", Object.assign({ entity: RULE, dimension: "client_ip", limit: 10, include_null: false }, last7Days))),
          safe("检测类型分布", post("/distribution/query", Object.assign({ entity: RULE, dimension: "type", limit: 10, include_null: false }, allTime))),
          safe("事件趋势", post("/trend/query", { series: [{ entity: RULE, label: "规则事件", time_field: "syslog_timestamp" }, { entity: RAW, label: "原始事件", time_field: "syslog_timestamp" }], time_range: { preset: "LAST_7_DAYS" }, granularity: "DAY", comparison: "NONE" })),
          safe("最近规则事件", requestJson("/entity/" + RULE + "/list?page=1&perPage=40&orderBy=syslog_timestamp&orderDir=desc"))
        ]);
        if (requestId !== state.requestId) return;
        const [ruleTotal, ruleToday, actions, clients, rules, rawTotal, ips, types, trend, events] = tasks;
        const actionItems = actions.ok ? distributionItems(actions.value) : [];
        const actionTotal = actionItems.reduce((sum, item) => sum + item.value, 0);
        const rejectCount = actionItems.reduce((sum, item) => sum + (item.label.toUpperCase() === "REJECT" ? item.value : 0), 0);

        setMetric("RuleTotal", overviewValue(ruleTotal.value, "all_time_count"), ruleTotal.ok);
        setMetric("RuleToday", overviewValue(ruleToday.value, "current_value"), ruleToday.ok);
        setMetric("RejectRate", actionTotal ? rejectCount / actionTotal * 100 : 0, actions.ok, "%");
        setMetric("Clients", rows(clients.value).length ? n(rows(clients.value)[0].value) : 0, clients.ok);
        setMetric("Rules", rows(rules.value).length ? n(rows(rules.value)[0].value) : 0, rules.ok);
        setMetric("RawTotal", overviewValue(rawTotal.value, "all_time_count"), rawTotal.ok);

        if (actions.ok) {
          setBarList("actionBars", actionItems, "#ff6978");
          el("actionMeta").textContent = "今日共 " + format(actionTotal) + " 条";
        } else {
          setBarList("actionBars", [], "#ff6978");
          el("actionMeta").textContent = "数据不可用";
          el("actionBars").innerHTML = '<div class="empty">数据不可用</div>';
        }
        setBarList("ipBars", ips.ok ? distributionItems(ips.value) : [], "#4fa3ff");
        if (!ips.ok) el("ipBars").innerHTML = '<div class="empty">数据不可用</div>';
        setBarList("typeBars", types.ok ? distributionItems(types.value) : [], "#a78bfa");
        if (!types.ok) el("typeBars").innerHTML = '<div class="empty">数据不可用</div>';

        state.trend = trend.ok ? trendData(trend.value) : { labels: [], series: [] };
        drawTrend();

        if (events.ok) {
          const data = events.value || {};
          state.events = Array.isArray(data.rows) ? data.rows : Array.isArray(data.items) ? data.items : [];
        } else if (!state.events.length) {
          state.events = [];
        }
        renderEvents();

        const failures = tasks.filter(item => !item.ok);
        const succeeded = tasks.length - failures.length;
        state.loaded = state.loaded || succeeded > 0;
        setStatus(failures, succeeded);
        if (succeeded) {
          el("updated").textContent = (failures.length ? "部分更新 " : "更新于 ") + new Date().toLocaleTimeString("zh-CN", { hour12: false });
        }
        el("dashboard").setAttribute("aria-busy", "false");
        el("refresh").classList.remove("loading");
        state.loading = false;
        if (showFeedback) showToast(failures.length ? "已刷新，部分数据暂不可用" : "态势数据已刷新");
      }

      function showToast(message) {
        const toast = el("toast");
        toast.textContent = message;
        toast.classList.add("visible");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("visible"), 1800);
      }

      function navigate(to) {
        showToast("正在打开对应模块…");
        if (window.parent !== window) {
          window.parent.postMessage({ type: "zenvis:navigate", to }, window.location.origin);
        } else {
          window.location.href = "/#" + to;
        }
      }

      function navigateApp() {
        navigate("/service/low-code-app/" + APP);
      }

      function navigatePage(config, query) {
        const params = new URLSearchParams(query || {});
        navigate("/service/low-code-page/" + config + (params.size ? "?" + params.toString() : ""));
      }

      el("refresh").addEventListener("click", () => loadDashboard(true));
      el("openApp").addEventListener("click", navigateApp);
      el("eventList").addEventListener("click", event => {
        const row = event.target.closest(".event-row");
        if (!row || !row.dataset.recordId) return;
        navigatePage(DETAIL, { record_id: row.dataset.recordId });
      });
      window.addEventListener("resize", () => {
        window.cancelAnimationFrame(state.resizeFrame);
        state.resizeFrame = window.requestAnimationFrame(drawTrend);
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.seconds < REFRESH_SECONDS - 5) loadDashboard(false);
      });
      window.setInterval(() => {
        if (document.hidden) return;
        state.seconds -= 1;
        if (state.seconds <= 0) loadDashboard(false);
      }, 1000);
      loadDashboard(false);
    })();
  </script>
</body>
