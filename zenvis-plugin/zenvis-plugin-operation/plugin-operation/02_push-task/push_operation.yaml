tests:
  - name: "合法样例应完成补充并进入 operation_page_event 分支"
    inputs:
      - insert_at: "parse_operation_sample"
        type: "log"
        log_fields:
          message: '{"operation_type":"operation_page_event","user_id":"user001","start_id":"start001","page_path":"/home","page_name":"首页","referrer":"/login","longitude":116.397,"latitude":39.908,"country":"中国","province":"北京市","city":"北京市","county":"东城区","net_type":"WIFI","lan_ip":"192.168.1.10","wan_ip":"43.129.1.10","event_time":"2025-08-12 12:12:12"}'
    outputs:
      - extract_from: "route_operation_sample.operation_page_event"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.operation_type, "operation_page_event")
              assert!(is_string(.id))
              assert!(is_string(.update_time))
              assert!(is_string(.insert_time))
              true

  - name: "非法 JSON 应进入 dropped 并保留原文"
    inputs:
      - insert_at: "parse_operation_sample"
        type: "log"
        log_fields:
          message: "{not-json"
    outputs:
      - extract_from: "parse_operation_sample.dropped"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(to_string!(.message), "{not-json")
              assert!(contains(to_string!(.metadata.dropped.message), "合法 JSON"))
              true
