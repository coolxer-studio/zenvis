<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全风险态势</title>
<style>
:root{--bg:#07111e;--panel:#0d2035e8;--line:#54d6ff35;--text:#edf9ff;--muted:#89a8ba;--cyan:#54d6ff;--teal:#3ce6c1;--rose:#ff718f}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{min-width:1180px;min-height:680px;overflow:hidden;color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -20%,#1b78a844,transparent 45%),linear-gradient(135deg,#040a12,#081827)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:linear-gradient(#54d6ff12 1px,transparent 1px),linear-gradient(90deg,#54d6ff12 1px,transparent 1px);background-size:40px 40px}.screen{position:relative;width:100vw;height:100vh;padding:18px 22px 22px;display:grid;grid-template-rows:64px 110px minmax(0,1fr);gap:14px}header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{color:var(--muted);font-size:12px;letter-spacing:.12em}h1{margin:0;text-align:center;font-size:29px;letter-spacing:.16em;text-shadow:0 0 24px #54d6ff55}.sub{text-align:center;color:var(--muted);font-size:11px}.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--muted);font-size:11px}button{border:1px solid #54d6ff66;border-radius:7px;padding:7px 12px;background:#54d6ff16;color:var(--text);cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi,.panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:9px;background:linear-gradient(155deg,#102a42d9,var(--panel));box-shadow:0 18px 44px #0005}.kpi{padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between}.kpi span,.kpi small,.head small{color:var(--muted)}.kpi strong{font:800 30px/34px monospace}.main{min-height:0;display:grid;grid-template-columns:1.1fr 1.8fr 1.1fr;grid-template-rows:1fr 1fr;gap:14px}.panel{padding:14px;min-height:0;display:flex;flex-direction:column}.tall{grid-row:span 2}.head{display:flex;justify-content:space-between;margin-bottom:8px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto}.card{padding:9px;border:1px solid #54d6ff22;border-radius:7px;background:#06111e66}.card span{display:block;color:var(--muted);font-size:10px}.card strong{font:700 21px monospace}.bars{display:grid;gap:8px;align-content:center;height:100%}.bar{display:grid;grid-template-columns:76px 1fr 48px;gap:8px;align-items:center;font-size:11px}.track{height:8px;border-radius:9px;background:#7897a822;overflow:hidden}.fill{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal))}.bar em{text-align:right;font-style:normal}canvas{width:100%;height:100%}.state{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#040a12bb;z-index:5}.state.visible{display:flex}.error{position:fixed;top:88px;left:50%;display:none;padding:10px 14px;border:1px solid #ff718f88;border-radius:8px;background:#50152bef;transform:translateX(-50%);z-index:6}.error.visible{display:block}
</style></head><body><main class="screen"><header><div class="brand">ZENVIS / RISK</div><div><h1>安全风险态势</h1><div class="sub">六类风险事件规模、等级与验证结果</div></div><div class="actions"><span id="updated">尚未更新</span><span id="clock">--:--:--</span><button id="refresh">刷新</button></div></header>
<section class="kpis"><article class="kpi"><span>累计记录</span><strong id="total">—</strong><small>全部实体</small></article><article class="kpi"><span>今日新增</span><strong id="today">—</strong><small>平台入库时间</small></article><article class="kpi"><span>高危及严重</span><strong id="special1">—</strong><small>重点指标</small></article><article class="kpi"><span>验证未通过</span><strong id="special2">—</strong><small>重点指标</small></article><article class="kpi"><span>有数据类型</span><strong id="active">—</strong><small>共 6 类实体</small></article></section>
<section class="main"><article class="panel tall"><div class="head"><b>实体规模</b><small>ALL TIME</small></div><div class="cards" id="cards"></div></article><article class="panel tall"><div class="head"><b>近 7 日新增趋势</b><small>按日聚合</small></div><canvas id="trend"></canvas></article><article class="panel"><div class="head"><b>风险等级分布</b><small>ALL TIME</small></div><div class="bars" id="dist1"></div></article><article class="panel"><div class="head"><b>验证结果分布</b><small>ALL TIME</small></div><div class="bars" id="dist2"></div></article></section></main><div class="state visible" id="loading">正在加载真实数据…</div><div class="error" id="error"></div>
<script>(()=>{'use strict';const ENTITIES=["risk_event", "risk_data", "risk_vulnerability", "risk_baseline", "risk_weak", "risk_attack"],LABELS={"risk_event": "风险事件", "risk_data": "数据风险", "risk_vulnerability": "漏洞风险", "risk_baseline": "基线风险", "risk_weak": "弱口令风险", "risk_attack": "攻击风险"},SECOND=["risk_data", "risk_vulnerability", "risk_baseline", "risk_weak", "risk_attack"];const bases=[location.pathname.startsWith('/zenvis/')?'/zenvis/api/v1':'/api/v1','/zenvis/api/v1','/api/v1'].filter((x,i,a)=>a.indexOf(x)===i);const $=id=>document.getElementById(id),num=v=>Number.isFinite(Number(v))?Number(v):0,fmt=new Intl.NumberFormat('zh-CN');let busy=false;
async function request(path,body){let last;for(const base of bases){try{const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});if(r.status===404)continue;if(!r.ok)throw new Error('HTTP '+r.status);const p=await r.json();if(!p||p.status!==0)throw new Error(p&&p.msg||'业务错误');return p.data}catch(e){last=e}}throw last||new Error('无法访问 Zenvis API')}const rows=d=>d&&d.result&&Array.isArray(d.result.rows)?d.result.rows:[];const mappings=(es,dim)=>es.map(entity=>({entity,dimension:dim,label:LABELS[entity]}));function aggregate(d){const out={};rows(d).forEach(r=>out[r.bucket]=(out[r.bucket]||0)+num(r.value));return out}function bars(id,d){const es=Object.entries(d).sort((a,b)=>b[1]-a[1]),max=Math.max(...es.map(x=>x[1]),1);$(id).innerHTML=es.map(([k,v])=>`<div class="bar"><label>${k}</label><span class="track"><span class="fill" style="width:${Math.max(2,v/max*100)}%"></span></span><em>${fmt.format(v)}</em></div>`).join('')||'<small>暂无数据</small>'}
function draw(data){const c=$('trend'),r=c.getBoundingClientRect(),q=devicePixelRatio||1,w=Math.max(420,r.width),h=Math.max(240,r.height);c.width=w*q;c.height=h*q;const x=c.getContext('2d');x.setTransform(q,0,0,q,0,0);const g={};rows(data).forEach(v=>g[v.bucket]=(g[v.bucket]||0)+num(v.value));const es=Object.entries(g),p={l:48,r:18,t:20,b:36},cw=w-p.l-p.r,ch=h-p.t-p.b,max=Math.max(...es.map(v=>v[1]),1);x.strokeStyle='#54d6ff';x.lineWidth=2.5;x.beginPath();es.forEach(([k,v],i)=>{const px=p.l+(es.length===1?cw/2:cw*i/(es.length-1)),py=p.t+ch-ch*v/max;i?x.lineTo(px,py):x.moveTo(px,py);x.fillStyle='#89a8ba';x.font='11px sans-serif';x.fillText(String(k).slice(5,10),px-15,h-8)});x.stroke();if(!es.length){x.fillStyle='#89a8ba';x.fillText('暂无趋势数据',w/2-35,h/2)}}
async function load(){if(busy)return;busy=true;$('loading').classList.add('visible');$('error').classList.remove('visible');try{const [overview,trend,a,b]=await Promise.all([request('/entity/overview/query',{entities:ENTITIES,time_range:{preset:'TODAY'},comparison:'NONE'}),request('/entity/trend/query',{entities:ENTITIES,time_range:{preset:'LAST_7_DAYS'},granularity:'DAY'}),request('/entity/distribution/query',{mappings:mappings(ENTITIES,'risk_level'),time_range:{preset:'ALL_TIME'},limit:10}),request('/entity/distribution/query',{mappings:mappings(SECOND,'verification_result'),time_range:{preset:'ALL_TIME'},limit:10})]);const orows=rows(overview),d1=aggregate(a),d2=aggregate(b);$('total').textContent=fmt.format(orows.reduce((s,r)=>s+num(r.all_time_count),0));$('today').textContent=fmt.format(orows.reduce((s,r)=>s+num(r.current_value),0));$('active').textContent=orows.filter(r=>num(r.all_time_count)>0).length+' / '+ENTITIES.length;$('special1').textContent=fmt.format((d1.CRITICAL||0)+(d1.HIGH||0));$('special2').textContent=fmt.format(d2.FAIL||0);$('cards').innerHTML=orows.map(r=>`<div class="card"><span>${LABELS[r.entity]||r.entity}</span><strong>${fmt.format(num(r.all_time_count))}</strong><span>今日 +${fmt.format(num(r.current_value))}</span></div>`).join('')||'<small>暂无数据</small>';bars('dist1',d1);bars('dist2',d2);draw(trend);$('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){$('error').textContent='数据刷新失败：'+(e.message||e);$('error').classList.add('visible')}finally{busy=false;$('loading').classList.remove('visible')}}$('refresh').addEventListener('click',load);setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}),1000);load();setInterval(load,60000);})();</script></body></html>
