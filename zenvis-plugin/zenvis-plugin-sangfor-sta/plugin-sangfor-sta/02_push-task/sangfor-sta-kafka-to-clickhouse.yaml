      converted_logid, error_logid = to_int(raw_logid)
      assert_eq!(error_logid, null, message: "STA netflow 字段 logid 必须为整数")
      normalized_logid = converted_logid
      assert!(normalized_logid >= 0, message: "STA netflow 字段 logid 不能为负数")
