      oracle_login: '.logtype == "oracle_login"'
      pop3: '.logtype == "pop3"'
      pop3_file: '.logtype == "pop3_file"'
      pop3_login: '.logtype == "pop3_login"'
      radius: '.logtype == "radius"'
      rdp: '.logtype == "rdp"'
      rdp_burst: '.logtype == "rdp_burst"'
      sip: '.logtype == "sip"'
      smb: '.logtype == "smb"'
      smb_file: '.logtype == "smb_file"'
      smb_login: '.logtype == "smb_login"'
      smtp: '.logtype == "smtp"'
      smtp_file: '.logtype == "smtp_file"'
      smtp_login: '.logtype == "smtp_login"'
      snmp: '.logtype == "snmp"'
      sql_server: '.logtype == "sql_server"'
