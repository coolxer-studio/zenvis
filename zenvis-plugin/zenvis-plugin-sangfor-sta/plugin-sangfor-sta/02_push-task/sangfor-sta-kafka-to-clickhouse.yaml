  map_sta_netflow:
    type: "remap"
    inputs:
      - "route_sta_logtype.netflow"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      out = {}
      assert!(exists(.logid), message: "STA netflow 缺少字段 logid")
