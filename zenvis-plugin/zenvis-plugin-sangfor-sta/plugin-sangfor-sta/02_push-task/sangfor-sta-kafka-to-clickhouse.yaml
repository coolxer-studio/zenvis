---
sources:
  sta_source_kafka:
    type: "kafka"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    group_id: "${STA_CLICKHOUSE_GROUP_ID:-zenvis-sangfor-sta-clickhouse-v1}"
    topics:
      - "${STA_SOURCE_TOPIC:-sta-log}"
    auto_offset_reset: "earliest"
    decoding:
      codec: "bytes"

transforms:
  parse_sta_json:
    type: "remap"
    inputs:
      - "sta_source_kafka"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_message = to_string(.message) ?? ""
      parsed, parse_error = parse_json(raw_message)
      assert_eq!(parse_error, null, message: "STA 原始消息必须是合法 JSON")
      assert!(is_object(parsed), message: "STA 原始消息必须是 JSON 对象")
      parsed_object = object!(parsed)
      if exists(parsed_object.Answers) {
        parsed_object.answer_details = parsed_object.Answers
        del(parsed_object.Answers)
      }
      parsed_object = map_keys(parsed_object) -> |key| { replace(downcase(key), "-", "_") }
      if exists(parsed_object.ts) && is_string(parsed_object.ts) {
        raw_ts_text = to_string!(parsed_object.ts)
        slash_ts, slash_ts_error = parse_timestamp(raw_ts_text, format: "%Y/%m/%d %H:%M:%S", timezone: "Asia/Shanghai")
        if slash_ts_error == null {
          parsed_object.ts = to_unix_timestamp(slash_ts)
        } else {
          dash_ts, dash_ts_error = parse_timestamp(raw_ts_text, format: "%Y-%m-%d %H:%M:%S", timezone: "Asia/Shanghai")
          if dash_ts_error == null {
            parsed_object.ts = to_unix_timestamp(dash_ts)
          }
        }
      }
      if parsed_object.logtype == "dncp" { parsed_object.logtype = "dhcp" }
      assert!(exists(parsed_object.logtype), message: "STA 原始消息缺少 logtype 字段")
      normalized_logtype = to_string!(parsed_object.logtype)
      assert!(includes(["netflow","ip_stat","tcp_flow","udp_flow","arp","db2","dce_rpc","dhcp","dns_request","dns_response","ftp","ftp_file","ftp_login","http_file","http_login","http_session","icmp","imap","imap_file","imap_login","kerberos","ldap","mysql","mysql_login","netbios_nbns","nfs","onvif","oracle","oracle_login","pop3","pop3_file","pop3_login","radius","rdp","rdp_burst","sip","smb","smb_file","smb_login","smtp","smtp_file","smtp_login","snmp","sql_server","ssh","ssl","sybase","sybase_login","telnet","telnet_login","telnet_option","waf","ips","utm","pvs"], normalized_logtype), message: "STA logtype 不在支持的 55 类数据定义中")
      parsed_object.message = raw_message
      . = parsed_object

  route_sta_logtype:
    type: "route"
    inputs:
      - "parse_sta_json"
    reroute_unmatched: false
    route:
      netflow: '.logtype == "netflow"'
      ip_stat: '.logtype == "ip_stat"'
      tcp_flow: '.logtype == "tcp_flow"'
      udp_flow: '.logtype == "udp_flow"'
      arp: '.logtype == "arp"'
      db2: '.logtype == "db2"'
      dce_rpc: '.logtype == "dce_rpc"'
      dhcp: '.logtype == "dhcp"'
      dns_request: '.logtype == "dns_request"'
      dns_response: '.logtype == "dns_response"'
      ftp: '.logtype == "ftp"'
      ftp_file: '.logtype == "ftp_file"'
      ftp_login: '.logtype == "ftp_login"'
      http_file: '.logtype == "http_file"'
      http_login: '.logtype == "http_login"'
      http_session: '.logtype == "http_session"'
      icmp: '.logtype == "icmp"'
      imap: '.logtype == "imap"'
      imap_file: '.logtype == "imap_file"'
      imap_login: '.logtype == "imap_login"'
      kerberos: '.logtype == "kerberos"'
      ldap: '.logtype == "ldap"'
      mysql: '.logtype == "mysql"'
      mysql_login: '.logtype == "mysql_login"'
      netbios_nbns: '.logtype == "netbios_nbns"'
