transforms:
  refresh_secgate3600_nsg_demo:
    type: "remap"
    inputs:
      - "secgate3600_nsg_demo_logs"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      seed = parse_json!(to_string!(.message))
      inner = to_string!(seed.message)
      unix_now = to_unix_timestamp(now())
      inner = replace(inner, "__DEMO_TIME__", to_string(unix_now))
      inner = replace(inner, "__DEMO_TIME_MS__", to_string(unix_now * 1000))
      inner = replace(inner, "__DEMO_DURATION__", to_string(random_int(0, 3600)))
      inner = replace(inner, "__DEMO_SESSION__", to_string(random_int(100000000, 999999999)))
      inner = replace(inner, "__DEMO_SERIAL__", "demo" + replace(uuid_v4(), "-", ""))
      . = {
        "appname": "NSG",
        "facility": "local0",
        "host": "NSG-DEMO",
        "hostname": "NSG-DEMO",
        "message": inner,
        "procid": random_int(1000, 65000),
        "severity": "info",
        "source_ip": "${SECGATE3600_NSG_DEMO_SOURCE_IP:-192.0.2.10}",
        "source_type": "demo",
        "timestamp": format_timestamp!(now(), format: "%+", timezone: "UTC"),
        "version": 1
      }

sinks:
  secgate3600_nsg_demo_invalid_console:
    type: "console"
    inputs:
      - "refresh_secgate3600_nsg_demo.dropped"
    target: "stdout"
    encoding:
      codec: "json"

  secgate3600_nsg_demo_kafka:
    type: "kafka"
    inputs:
      - "refresh_secgate3600_nsg_demo"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    topic: "${SECGATE3600_NSG_RAW_TOPIC:-secgate3600-nsg-syslog-raw}"
    compression: "zstd"
    encoding:
      codec: "json"
    librdkafka_options:
      request.required.acks: "-1"
      message.send.max.retries: "10"
      retry.backoff.ms: "1000"
    acknowledgements:
      enabled: false
    batch:
      max_bytes: 1048576
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 268435488
      when_full: "block"

tests:
  - name: "演示数据 self-end/flow 1 应生成合法原始事件"
    inputs:
      - insert_at: "refresh_secgate3600_nsg_demo"
        type: "log"
        log_fields:
          message: |-
            {"kind":"self-end/flow","message":"﻿devid=\"demo-6300\" dname=\"NSG-DEMO\" serial=\"__DEMO_SERIAL__\" vsys=\"root-vsys\" time=\"__DEMO_TIME__\" type=\"self-end\" session_id=\"__DEMO_SESSION__\" module=\"flow\" severity=\"info\" duration=\"0\" addr_src=\"198.51.100.10\" addr_dst=\"192.0.2.10\" nataddr_src=\"::\" nataddr_dst=\"::\" port_src=\"8779\" port_dst=\"2048\" natport_src=\"0\" natport_dst=\"0\" action=\"deny\" appname=\"ICMP\" rule=\"__to_self__\" proto=\"ICMP\" session_time=\"__DEMO_DURATION__\" sess_dev_id=\"0\" sess_nth=\"0\" zone_src=\"\" zone_dst=\"\" locale_src=\"内网\" locale_dst=\"内网\" user_src=\"\" user_dst=\"\" app_category=\"APP_NETWORK\" app_risk=\"1\" asset_os_src=\"\" asset_os_dst=\"\" asset_name_src=\"\" asset_name_dst=\"\" asset_type_src=\"\" asset_type_dst=\"\" focus_type=\"NO\" non_standard_port=\"NO\" interface_src=\"ge2\" interface_dst=\"\" bytes_sent=\"0\" bytes_received=\"0\" pkts_sent=\"0\" pkts_received=\"0\" total_sess=\"0\" from_tunnel=\"\" to_tunnel=\"\" deny_type=\"Security Policy\" sess_limit_profile=\"\" decrypt_rule=\"\" honeypot_rule_name=\"\" honeypot_drainage_type=\"\" sfc_rule_name=\"\" sfc_name=\"\" sfc_mode=\"\" sfc_online=\"\" sfc_sniffer=\"\" sess_del_reason=\"\""}
    outputs:
      - extract_from: "refresh_secgate3600_nsg_demo"
        conditions:
          - type: "vrl"
            source: |-
              assert_eq!(.appname, "NSG")
              assert_eq!(.source_type, "demo")
              assert_eq!(.source_ip, "192.0.2.10")
              assert_eq!(contains(to_string!(.message), "__DEMO_"), false)
              normalized = replace(to_string!(.message), r'^\x{FEFF}', "")
              parsed, parse_error = parse_key_value(normalized, whitespace: "strict")
              assert_eq!(parse_error, null)
              assert_eq!(parsed.type, "self-end")
              assert_eq!(parsed.module, "flow")
              raw_time, time_error = to_int(to_string!(parsed.time))
              assert_eq!(time_error, null)
              assert!(raw_time > 0)
