---
sources:
  secgate3600_nsg_kafka_input:
    type: "kafka"
    bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}"
    group_id: "${SECGATE3600_NSG_GROUP_ID:-secgate3600-nsg-transform-v1}"
    topics:
      - "${SECGATE3600_NSG_RAW_TOPIC:-secgate3600-nsg-syslog-raw}"
    auto_offset_reset: "earliest"
    decoding:
      codec: "bytes"

transforms:
  classify_secgate3600_nsg_event:
    type: "remap"
    inputs:
      - "secgate3600_nsg_kafka_input"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_event = to_string(.message) ?? ""
      parsed_event, event_parse_error = parse_json(raw_event)
      assert_eq!(event_parse_error, null, message: "SecGate 3600 NSG 原始 Kafka 消息必须是合法 JSON")
      assert!(is_object(parsed_event), message: "SecGate 3600 NSG 原始 Kafka 消息必须是 JSON 对象")
      event = object!(parsed_event)
      raw_syslog_message = to_string(event.message) ?? ""
      assert!(raw_syslog_message != "", message: "SecGate 3600 NSG 外层 message 不能为空")
      normalized_message = replace(raw_syslog_message, r'^\x{FEFF}', "")
      parsed_fields, fields_parse_error = parse_key_value(normalized_message, whitespace: "strict")
      assert_eq!(fields_parse_error, null, message: "SecGate 3600 NSG message 必须是合法的 quoted key-value 文本")
      assert!(is_object(parsed_fields), message: "SecGate 3600 NSG message 解析结果必须是对象")
      fields = object!(parsed_fields)
      .secgate3600_nsg_type = to_string(fields.type) ?? ""
      .secgate3600_nsg_module = to_string(fields.module) ?? ""
      .secgate3600_nsg_source_ip = to_string(event.source_ip) ?? ""

  route_secgate3600_nsg_record_type:
    type: "route"
    inputs:
      - "classify_secgate3600_nsg_event"
    reroute_unmatched: true
    route:
      secgate3600_nsg_traffic_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "traffic-end" && record_module == "flow"
      secgate3600_nsg_self_end_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "self-end" && record_module == "flow"
      secgate3600_nsg_dns_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "dns" && record_module == "dns"
      secgate3600_nsg_threat_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "threat" && record_module != ""
      secgate3600_nsg_system_alert_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "system" && record_module == "alert"
      secgate3600_nsg_system_upgrade_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "system" && record_module == "upgrade"
      secgate3600_nsg_system_restore_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "system" && record_module == "restore"
      secgate3600_nsg_system_admin_event:
        type: "vrl"
        source: |-
          record_type = to_string(.secgate3600_nsg_type) ?? ""
          record_module = to_string(.secgate3600_nsg_module) ?? ""
          record_type == "system" && record_module == "admin"

  map_secgate3600_nsg_traffic_event:
    type: "remap"
    inputs:
      - "route_secgate3600_nsg_record_type.secgate3600_nsg_traffic_event"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_event = to_string(.message) ?? ""
      parsed_event, event_parse_error = parse_json(raw_event)
      assert_eq!(event_parse_error, null, message: "SecGate 3600 NSG 原始 Kafka 消息必须是合法 JSON")
      assert!(is_object(parsed_event), message: "SecGate 3600 NSG 原始 Kafka 消息必须是 JSON 对象")
      event = object!(parsed_event)

      raw_syslog_appname = to_string(event.appname) ?? ""
      assert!(raw_syslog_appname != "", message: "SecGate 3600 NSG 外层 appname 不能为空")
      raw_syslog_message = to_string(event.message) ?? ""
      assert!(raw_syslog_message != "", message: "SecGate 3600 NSG 外层 message 不能为空")

      normalized_message = replace(raw_syslog_message, r'^\x{FEFF}', "")
      parsed_fields, fields_parse_error = parse_key_value(normalized_message, whitespace: "strict")
      assert_eq!(fields_parse_error, null, message: "SecGate 3600 NSG message 必须是合法的 quoted key-value 文本")
      assert!(is_object(parsed_fields), message: "SecGate 3600 NSG message 解析结果必须是对象")
      fields = object(parsed_fields)

      raw_type = to_string(fields.type) ?? ""
      assert_eq!(raw_type, "traffic-end", message: "SecGate 3600 NSG type 必须为 traffic-end")
      raw_module = to_string(fields.module) ?? ""
      assert_eq!(raw_module, "flow", message: "SecGate 3600 NSG module 必须为 flow")

      out = {}

      raw_session_id = to_string(fields.session_id) ?? ""
      assert!(raw_session_id != "", message: "SecGate 3600 NSG 缺少必填字段 session_id")
      session_id, session_id_error = to_int(raw_session_id)
      assert_eq!(session_id_error, null, message: "SecGate 3600 NSG session_id 必须为非负整数")
      assert!(session_id >= 0, message: "SecGate 3600 NSG session_id 不能为负数")
      out.session_id = session_id

      raw_time = to_string(fields.time) ?? ""
      assert!(raw_time != "", message: "SecGate 3600 NSG 缺少必填字段 time")
      unix_time, unix_time_error = to_int(raw_time)
      assert_eq!(unix_time_error, null, message: "SecGate 3600 NSG time 必须为 Unix 秒时间戳")
      parsed_time, parsed_time_error = from_unix_timestamp(unix_time, unit: "seconds")
      assert_eq!(parsed_time_error, null, message: "SecGate 3600 NSG time 超出 Unix 时间范围")
      out.time = format_timestamp!(parsed_time, format: "%Y-%m-%d %H:%M:%S.%3f", timezone: "UTC")

      out.type = raw_type
      raw_action = to_string(fields.action) ?? ""
      assert!(raw_action != "", message: "SecGate 3600 NSG 缺少必填字段 action")
      out.action = raw_action

      raw_addr_src = to_string(fields.addr_src) ?? ""
      assert!(raw_addr_src != "", message: "SecGate 3600 NSG 缺少必填字段 addr_src")
      out.addr_src = raw_addr_src
      raw_port_src = to_string(fields.port_src) ?? ""
      port_src, port_src_error = to_int(raw_port_src)
      assert_eq!(port_src_error, null, message: "SecGate 3600 NSG port_src 必须为整数")
      assert!(port_src >= 0 && port_src <= 65535, message: "SecGate 3600 NSG port_src 必须在 0 到 65535 之间")
      out.port_src = port_src

      raw_addr_dst = to_string(fields.addr_dst) ?? ""
      assert!(raw_addr_dst != "", message: "SecGate 3600 NSG 缺少必填字段 addr_dst")
      out.addr_dst = raw_addr_dst
      raw_port_dst = to_string(fields.port_dst) ?? ""
      port_dst, port_dst_error = to_int(raw_port_dst)
      assert_eq!(port_dst_error, null, message: "SecGate 3600 NSG port_dst 必须为整数")
      assert!(port_dst >= 0 && port_dst <= 65535, message: "SecGate 3600 NSG port_dst 必须在 0 到 65535 之间")
      out.port_dst = port_dst

      out.nataddr_src = to_string(fields.nataddr_src) ?? ""
      raw_natport_src = to_string(fields.natport_src) ?? ""
      natport_src, natport_src_error = to_int(raw_natport_src)
      assert_eq!(natport_src_error, null, message: "SecGate 3600 NSG natport_src 必须为整数")
      assert!(natport_src >= 0 && natport_src <= 65535, message: "SecGate 3600 NSG natport_src 必须在 0 到 65535 之间")
      out.natport_src = natport_src

      out.nataddr_dst = to_string(fields.nataddr_dst) ?? ""
      raw_natport_dst = to_string(fields.natport_dst) ?? ""
      natport_dst, natport_dst_error = to_int(raw_natport_dst)
      assert_eq!(natport_dst_error, null, message: "SecGate 3600 NSG natport_dst 必须为整数")
      assert!(natport_dst >= 0 && natport_dst <= 65535, message: "SecGate 3600 NSG natport_dst 必须在 0 到 65535 之间")
      out.natport_dst = natport_dst

      raw_proto = to_string(fields.proto) ?? ""
      assert!(raw_proto != "", message: "SecGate 3600 NSG 缺少必填字段 proto")
      out.proto = raw_proto
      raw_appname = to_string(fields.appname) ?? ""
      assert!(raw_appname != "", message: "SecGate 3600 NSG 缺少必填字段 appname")
      out.appname = raw_appname
      raw_rule = to_string(fields.rule) ?? ""
      assert!(raw_rule != "", message: "SecGate 3600 NSG 缺少必填字段 rule")
      out.rule = raw_rule
      out.severity = to_string(fields.severity) ?? ""

      raw_app_risk = to_string(fields.app_risk) ?? ""
      app_risk, app_risk_error = to_int(raw_app_risk)
      assert_eq!(app_risk_error, null, message: "SecGate 3600 NSG app_risk 必须为整数")
      assert!(app_risk >= 0 && app_risk <= 255, message: "SecGate 3600 NSG app_risk 必须在 0 到 255 之间")
      out.app_risk = app_risk

      raw_duration = to_string(fields.duration) ?? ""
      duration_value, duration_value_error = to_int(raw_duration)
      assert_eq!(duration_value_error, null, message: "SecGate 3600 NSG duration 必须为非负整数")
      assert!(duration_value >= 0, message: "SecGate 3600 NSG duration 不能为负数")
      out.duration = duration_value

      raw_session_time = to_string(fields.session_time) ?? ""
      session_time, session_time_error = to_int(raw_session_time)
      assert_eq!(session_time_error, null, message: "SecGate 3600 NSG session_time 必须为非负整数")
      assert!(session_time >= 0, message: "SecGate 3600 NSG session_time 不能为负数")
      out.session_time = session_time

      raw_bytes_sent = to_string(fields.bytes_sent) ?? ""
      bytes_sent, bytes_sent_error = to_int(raw_bytes_sent)
      assert_eq!(bytes_sent_error, null, message: "SecGate 3600 NSG bytes_sent 必须为非负整数")
      assert!(bytes_sent >= 0, message: "SecGate 3600 NSG bytes_sent 不能为负数")
      out.bytes_sent = bytes_sent

      raw_bytes_received = to_string(fields.bytes_received) ?? ""
      bytes_received, bytes_received_error = to_int(raw_bytes_received)
      assert_eq!(bytes_received_error, null, message: "SecGate 3600 NSG bytes_received 必须为非负整数")
      assert!(bytes_received >= 0, message: "SecGate 3600 NSG bytes_received 不能为负数")
      out.bytes_received = bytes_received

      raw_pkts_sent = to_string(fields.pkts_sent) ?? ""
      pkts_sent, pkts_sent_error = to_int(raw_pkts_sent)
      assert_eq!(pkts_sent_error, null, message: "SecGate 3600 NSG pkts_sent 必须为非负整数")
      assert!(pkts_sent >= 0, message: "SecGate 3600 NSG pkts_sent 不能为负数")
      out.pkts_sent = pkts_sent

      raw_pkts_received = to_string(fields.pkts_received) ?? ""
      pkts_received, pkts_received_error = to_int(raw_pkts_received)
      assert_eq!(pkts_received_error, null, message: "SecGate 3600 NSG pkts_received 必须为非负整数")
      assert!(pkts_received >= 0, message: "SecGate 3600 NSG pkts_received 不能为负数")
      out.pkts_received = pkts_received

      raw_total_sess = to_string(fields.total_sess) ?? ""
      total_sess, total_sess_error = to_int(raw_total_sess)
      assert_eq!(total_sess_error, null, message: "SecGate 3600 NSG total_sess 必须为非负整数")
      assert!(total_sess >= 0, message: "SecGate 3600 NSG total_sess 不能为负数")
      out.total_sess = total_sess

      raw_devid = to_string(fields.devid) ?? ""
      assert!(raw_devid != "", message: "SecGate 3600 NSG 缺少必填字段 devid")
      out.devid = raw_devid
      out.dname = to_string(fields.dname) ?? ""
      raw_serial = to_string(fields.serial) ?? ""
      assert!(raw_serial != "", message: "SecGate 3600 NSG 缺少必填字段 serial")
      out.serial = raw_serial
      out.vsys = to_string(fields.vsys) ?? ""
      out.module = raw_module
      out.sess_dev_id = to_string(fields.sess_dev_id) ?? ""

      raw_sess_nth = to_string(fields.sess_nth) ?? ""
      sess_nth, sess_nth_error = to_int(raw_sess_nth)
      assert_eq!(sess_nth_error, null, message: "SecGate 3600 NSG sess_nth 必须为非负整数")
      assert!(sess_nth >= 0, message: "SecGate 3600 NSG sess_nth 不能为负数")
      out.sess_nth = sess_nth

      out.zone_src = to_string(fields.zone_src) ?? ""
      out.zone_dst = to_string(fields.zone_dst) ?? ""
      out.locale_src = to_string(fields.locale_src) ?? ""
      out.locale_dst = to_string(fields.locale_dst) ?? ""
      out.interface_src = to_string(fields.interface_src) ?? ""
      out.interface_dst = to_string(fields.interface_dst) ?? ""
      out.user_src = to_string(fields.user_src) ?? ""
      out.user_dst = to_string(fields.user_dst) ?? ""
      out.app_category = to_string(fields.app_category) ?? ""
      out.asset_os_src = to_string(fields.asset_os_src) ?? ""
      out.asset_os_dst = to_string(fields.asset_os_dst) ?? ""
      out.asset_name_src = to_string(fields.asset_name_src) ?? ""
      out.asset_name_dst = to_string(fields.asset_name_dst) ?? ""
      out.asset_type_src = to_string(fields.asset_type_src) ?? ""
      out.asset_type_dst = to_string(fields.asset_type_dst) ?? ""

      raw_focus_type = upcase(to_string(fields.focus_type) ?? "")
      assert!(includes(["YES", "NO"], raw_focus_type), message: "SecGate 3600 NSG focus_type 必须为 YES 或 NO")
      out.focus_type = raw_focus_type == "YES"
      raw_non_standard_port = upcase(to_string(fields.non_standard_port) ?? "")
      assert!(includes(["YES", "NO"], raw_non_standard_port), message: "SecGate 3600 NSG non_standard_port 必须为 YES 或 NO")
      out.non_standard_port = raw_non_standard_port == "YES"

      out.from_tunnel = to_string(fields.from_tunnel) ?? ""
      out.to_tunnel = to_string(fields.to_tunnel) ?? ""
      out.deny_type = to_string(fields.deny_type) ?? ""
      out.sess_limit_profile = to_string(fields.sess_limit_profile) ?? ""
      out.decrypt_rule = to_string(fields.decrypt_rule) ?? ""
      out.honeypot_rule_name = to_string(fields.honeypot_rule_name) ?? ""
      out.honeypot_drainage_type = to_string(fields.honeypot_drainage_type) ?? ""
      out.sfc_rule_name = to_string(fields.sfc_rule_name) ?? ""
      out.sfc_name = to_string(fields.sfc_name) ?? ""
      out.sfc_mode = to_string(fields.sfc_mode) ?? ""
      out.sfc_online = to_string(fields.sfc_online) ?? ""
      out.sfc_sniffer = to_string(fields.sfc_sniffer) ?? ""
      out.sess_del_reason = to_string(fields.sess_del_reason) ?? ""

      out.syslog_appname = raw_syslog_appname
      raw_syslog_facility = to_string(event.facility) ?? ""
      assert!(raw_syslog_facility != "", message: "SecGate 3600 NSG 外层缺少字段 facility")
      out.syslog_facility = raw_syslog_facility
      raw_syslog_host = to_string(event.host) ?? ""
      assert!(raw_syslog_host != "", message: "SecGate 3600 NSG 外层缺少字段 host")
      out.syslog_host = raw_syslog_host
      raw_syslog_hostname = to_string(event.hostname) ?? ""
      assert!(raw_syslog_hostname != "", message: "SecGate 3600 NSG 外层缺少字段 hostname")
      out.syslog_hostname = raw_syslog_hostname

      raw_syslog_procid = to_string(event.procid) ?? ""
      syslog_procid, syslog_procid_error = to_int(raw_syslog_procid)
      assert_eq!(syslog_procid_error, null, message: "SecGate 3600 NSG 外层 procid 必须为非负整数")
      assert!(syslog_procid >= 0, message: "SecGate 3600 NSG 外层 procid 不能为负数")
      out.syslog_procid = syslog_procid

      raw_syslog_severity = to_string(event.severity) ?? ""
      assert!(raw_syslog_severity != "", message: "SecGate 3600 NSG 外层缺少字段 severity")
      out.syslog_severity = raw_syslog_severity
      raw_syslog_source_ip = to_string(event.source_ip) ?? ""
      allowed_sources = split("${SECGATE3600_NSG_ALLOWED_SOURCE_IPS:-*}", ",")
      if !(includes!(allowed_sources, "*") || includes!(allowed_sources, raw_syslog_source_ip)) {
        abort "SecGate 3600 NSG 外层 source_ip 必须命中 SECGATE3600_NSG_ALLOWED_SOURCE_IPS"
      }
      out.syslog_source_ip = raw_syslog_source_ip
      raw_syslog_source_type = to_string(event.source_type) ?? ""
      assert!(raw_syslog_source_type != "", message: "SecGate 3600 NSG 外层缺少字段 source_type")
      out.syslog_source_type = raw_syslog_source_type

      raw_syslog_timestamp = to_string(event.timestamp) ?? ""
      parsed_syslog_timestamp, syslog_timestamp_error = parse_timestamp(raw_syslog_timestamp, format: "%+")
      assert_eq!(syslog_timestamp_error, null, message: "SecGate 3600 NSG 外层 timestamp 必须为 RFC3339 时间")
      out.syslog_timestamp = format_timestamp!(parsed_syslog_timestamp, format: "%Y-%m-%d %H:%M:%S.%3f", timezone: "UTC")

      raw_syslog_version = to_string(event.version) ?? ""
      syslog_version, syslog_version_error = to_int(raw_syslog_version)
      assert_eq!(syslog_version_error, null, message: "SecGate 3600 NSG 外层 version 必须为非负整数")
      assert!(syslog_version >= 0 && syslog_version <= 65535, message: "SecGate 3600 NSG 外层 version 必须在 0 到 65535 之间")
      out.syslog_version = syslog_version
      out.syslog_message = raw_syslog_message

      . = out

  map_secgate3600_nsg_self_end_event:
    type: "remap"
    inputs:
      - "route_secgate3600_nsg_record_type.secgate3600_nsg_self_end_event"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_event = to_string(.message) ?? ""
      parsed_event, event_parse_error = parse_json(raw_event)
      assert_eq!(event_parse_error, null, message: "SecGate 3600 NSG 原始 Kafka 消息必须是合法 JSON")
      assert!(is_object(parsed_event), message: "SecGate 3600 NSG 原始 Kafka 消息必须是 JSON 对象")
      event = object!(parsed_event)

      raw_syslog_appname = to_string(event.appname) ?? ""
      assert!(raw_syslog_appname != "", message: "SecGate 3600 NSG 外层 appname 不能为空")
      raw_syslog_message = to_string(event.message) ?? ""
      assert!(raw_syslog_message != "", message: "SecGate 3600 NSG 外层 message 不能为空")

      normalized_message = replace(raw_syslog_message, r'^\x{FEFF}', "")
      parsed_fields, fields_parse_error = parse_key_value(normalized_message, whitespace: "strict")
      assert_eq!(fields_parse_error, null, message: "SecGate 3600 NSG message 必须是合法的 quoted key-value 文本")
      assert!(is_object(parsed_fields), message: "SecGate 3600 NSG message 解析结果必须是对象")
      fields = object(parsed_fields)

      raw_type = to_string(fields.type) ?? ""
      assert_eq!(raw_type, "self-end", message: "SecGate 3600 NSG type 必须为 self-end")
      raw_module = to_string(fields.module) ?? ""
      assert_eq!(raw_module, "flow", message: "SecGate 3600 NSG module 必须为 flow")

      out = {}

      raw_session_id = to_string(fields.session_id) ?? ""
      assert!(raw_session_id != "", message: "SecGate 3600 NSG 缺少必填字段 session_id")
      session_id, session_id_error = to_int(raw_session_id)
      assert_eq!(session_id_error, null, message: "SecGate 3600 NSG session_id 必须为非负整数")
      assert!(session_id >= 0, message: "SecGate 3600 NSG session_id 不能为负数")
      out.session_id = session_id

      raw_time = to_string(fields.time) ?? ""
      assert!(raw_time != "", message: "SecGate 3600 NSG 缺少必填字段 time")
      unix_time, unix_time_error = to_int(raw_time)
      assert_eq!(unix_time_error, null, message: "SecGate 3600 NSG time 必须为 Unix 秒时间戳")
      parsed_time, parsed_time_error = from_unix_timestamp(unix_time, unit: "seconds")
      assert_eq!(parsed_time_error, null, message: "SecGate 3600 NSG time 超出 Unix 时间范围")
      out.time = format_timestamp!(parsed_time, format: "%Y-%m-%d %H:%M:%S.%3f", timezone: "UTC")

      out.type = raw_type
      raw_action = to_string(fields.action) ?? ""
      assert!(raw_action != "", message: "SecGate 3600 NSG 缺少必填字段 action")
      out.action = raw_action

      raw_addr_src = to_string(fields.addr_src) ?? ""
      assert!(raw_addr_src != "", message: "SecGate 3600 NSG 缺少必填字段 addr_src")
      out.addr_src = raw_addr_src
      raw_port_src = to_string(fields.port_src) ?? ""
      port_src, port_src_error = to_int(raw_port_src)
      assert_eq!(port_src_error, null, message: "SecGate 3600 NSG port_src 必须为整数")
      assert!(port_src >= 0 && port_src <= 65535, message: "SecGate 3600 NSG port_src 必须在 0 到 65535 之间")
      out.port_src = port_src

      raw_addr_dst = to_string(fields.addr_dst) ?? ""
      assert!(raw_addr_dst != "", message: "SecGate 3600 NSG 缺少必填字段 addr_dst")
      out.addr_dst = raw_addr_dst
      raw_port_dst = to_string(fields.port_dst) ?? ""
      port_dst, port_dst_error = to_int(raw_port_dst)
      assert_eq!(port_dst_error, null, message: "SecGate 3600 NSG port_dst 必须为整数")
