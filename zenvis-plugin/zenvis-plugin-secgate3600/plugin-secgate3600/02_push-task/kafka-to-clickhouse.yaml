      assert_eq!(natport_dst_error, null, message: "SecGate 3600 NSG threat natport_dst 必须为整数")
      assert!(natport_dst >= 0 && natport_dst <= 65535, message: "SecGate 3600 NSG threat natport_dst 必须在 0 到 65535 之间")
      out.natport_dst = natport_dst

      raw_proto = to_string(fields.proto) ?? ""
      assert!(raw_proto != "", message: "SecGate 3600 NSG threat 缺少必填字段 proto")
      out.proto = raw_proto
      raw_appname = to_string(fields.appname) ?? ""
      assert!(raw_appname != "", message: "SecGate 3600 NSG threat 缺少必填字段 appname")
      out.appname = raw_appname
