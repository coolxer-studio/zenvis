      assert_eq!(port_dst_error, null, message: "SecGate 3600 NSG threat port_dst 必须为整数")
      assert!(port_dst >= 0 && port_dst <= 65535, message: "SecGate 3600 NSG threat port_dst 必须在 0 到 65535 之间")
      out.port_dst = port_dst

      out.nataddr_src = to_string(fields.nataddr_src) ?? ""
      raw_natport_src = to_string(fields.natport_src) ?? ""
      natport_src, natport_src_error = to_int(raw_natport_src)
      assert_eq!(natport_src_error, null, message: "SecGate 3600 NSG threat natport_src 必须为整数")
      assert!(natport_src >= 0 && natport_src <= 65535, message: "SecGate 3600 NSG threat natport_src 必须在 0 到 65535 之间")
      out.natport_src = natport_src
      out.nataddr_dst = to_string(fields.nataddr_dst) ?? ""
      raw_natport_dst = to_string(fields.natport_dst) ?? ""
