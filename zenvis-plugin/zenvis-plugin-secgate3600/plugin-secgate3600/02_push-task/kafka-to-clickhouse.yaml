  map_secgate3600_nsg_threat_event:
    type: "remap"
    inputs:
      - "route_secgate3600_nsg_record_type.secgate3600_nsg_threat_event"
    drop_on_error: true
    reroute_dropped: true
    source: |-
      raw_event = to_string(.message) ?? ""
      parsed_event, event_parse_error = parse_json(raw_event)
      assert_eq!(event_parse_error, null, message: "SecGate 3600 NSG threat 原始 Kafka 消息必须是合法 JSON")
      assert!(is_object(parsed_event), message: "SecGate 3600 NSG threat 原始 Kafka 消息必须是 JSON 对象")
      event = object!(parsed_event)

      raw_syslog_message = to_string(event.message) ?? ""
      assert!(raw_syslog_message != "", message: "SecGate 3600 NSG threat 外层 message 不能为空")
      normalized_message = replace(raw_syslog_message, r'^\x{FEFF}', "")
      message_for_parse = normalized_message
      preserved_url = null
      url_capture, url_capture_error = parse_regex(normalized_message, r'\surl="(?P<url>.*)"\s+dns_domain=')
      if url_capture_error == null && is_object(url_capture) {
        captured_url_fields = object(url_capture)
        preserved_url = to_string(captured_url_fields.url)
        message_for_parse = replace(normalized_message, r'\surl=".*"\s+dns_domain=', " url=\"\" dns_domain=")
      }
      parsed_fields, fields_parse_error = parse_key_value(message_for_parse, whitespace: "strict")
      assert_eq!(fields_parse_error, null, message: "SecGate 3600 NSG threat message 必须是合法的 quoted key-value 文本")
      assert!(is_object(parsed_fields), message: "SecGate 3600 NSG threat message 解析结果必须是对象")
      fields = object(parsed_fields)
      if preserved_url != null {
        fields.url = preserved_url
      }
      assert!(length(fields) == 67 || length(fields) == 69, message: "SecGate 3600 NSG threat 内层字段数量必须为 67 或 69")

      raw_type = to_string(fields.type) ?? ""
      assert_eq!(raw_type, "threat", message: "SecGate 3600 NSG threat type 必须为 threat")
      raw_module = to_string(fields.module) ?? ""
      assert!(raw_module != "", message: "SecGate 3600 NSG threat module 不能为空")
      raw_syslog_source_ip = to_string(event.source_ip) ?? ""
      allowed_sources = split("${SECGATE3600_NSG_ALLOWED_SOURCE_IPS:-*}", ",")
      if !(includes!(allowed_sources, "*") || includes!(allowed_sources, raw_syslog_source_ip)) {
        abort "SecGate 3600 NSG 外层 source_ip 必须命中 SECGATE3600_NSG_ALLOWED_SOURCE_IPS"
      }

      out = {}

      raw_threat_id = to_string(fields.threat_id) ?? ""
      assert!(raw_threat_id != "", message: "SecGate 3600 NSG threat 缺少必填字段 threat_id")
      out.threat_id = raw_threat_id

      raw_time = to_string(fields.time) ?? ""
      assert!(raw_time != "", message: "SecGate 3600 NSG threat 缺少必填字段 time")
      unix_time, unix_time_error = to_int(raw_time)
      assert_eq!(unix_time_error, null, message: "SecGate 3600 NSG threat time 必须为 Unix 秒时间戳")
      parsed_time, parsed_time_error = from_unix_timestamp(unix_time, unit: "seconds")
      assert_eq!(parsed_time_error, null, message: "SecGate 3600 NSG threat time 超出 Unix 时间范围")
      out.time = format_timestamp!(parsed_time, format: "%Y-%m-%d %H:%M:%S.%3f", timezone: "UTC")

      raw_threat_name = to_string(fields.threat_name) ?? ""
      assert!(raw_threat_name != "", message: "SecGate 3600 NSG threat 缺少必填字段 threat_name")
      out.threat_name = raw_threat_name
      raw_threat_severity = to_string(fields.threat_severity) ?? ""
      assert!(raw_threat_severity != "", message: "SecGate 3600 NSG threat 缺少必填字段 threat_severity")
      out.threat_severity = raw_threat_severity
      out.type = raw_type
      out.module = raw_module

      raw_action = to_string(fields.action) ?? ""
      assert!(raw_action != "", message: "SecGate 3600 NSG threat 缺少必填字段 action")
      out.action = raw_action
      out.direction = to_string(fields.direction) ?? ""
      out.attacker_ip = to_string(fields.attacker_ip) ?? ""
      out.victim_ip = to_string(fields.victim_ip) ?? ""
      out.attack_name = to_string(fields.attack_name) ?? ""
      out.victim_name = to_string(fields.victim_name) ?? ""

      raw_session_id = to_string(fields.session_id) ?? ""
      session_id, session_id_error = to_int(raw_session_id)
      assert_eq!(session_id_error, null, message: "SecGate 3600 NSG threat session_id 必须为非负整数")
      assert!(session_id >= 0, message: "SecGate 3600 NSG threat session_id 不能为负数")
      out.session_id = session_id

      raw_addr_src = to_string(fields.addr_src) ?? ""
      assert!(raw_addr_src != "", message: "SecGate 3600 NSG threat 缺少必填字段 addr_src")
      out.addr_src = raw_addr_src
      raw_port_src = to_string(fields.port_src) ?? ""
      port_src, port_src_error = to_int(raw_port_src)
      assert_eq!(port_src_error, null, message: "SecGate 3600 NSG threat port_src 必须为整数")
      assert!(port_src >= 0 && port_src <= 65535, message: "SecGate 3600 NSG threat port_src 必须在 0 到 65535 之间")
      out.port_src = port_src

      raw_addr_dst = to_string(fields.addr_dst) ?? ""
      assert!(raw_addr_dst != "", message: "SecGate 3600 NSG threat 缺少必填字段 addr_dst")
      out.addr_dst = raw_addr_dst
