<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecGate 3600 NSG 防火墙态势总览</title>
  <style>
    :root{color-scheme:dark;--bg:#050c13;--surface:#0a1520;--surface-2:#0e1c2a;--line:rgba(116,174,214,.17);--line-strong:rgba(116,190,232,.34);--text:#edf6fb;--muted:#8fa8b9;--dim:#6b8293;--blue:#49a8ff;--cyan:#37d4dd;--green:#38d996;--orange:#ffb44d;--red:#ff6778;--violet:#a38cff;--radius:14px;--shadow:0 22px 58px rgba(0,4,10,.28),inset 0 1px rgba(220,244,255,.03)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;color:var(--text);background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;-webkit-font-smoothing:antialiased}
    body:before{position:fixed;inset:0;content:"";pointer-events:none;background-image:radial-gradient(circle at 12% 8%,rgba(73,168,255,.13),transparent 28%),radial-gradient(circle at 82% 14%,rgba(55,212,221,.075),transparent 25%),radial-gradient(circle at 68% 92%,rgba(163,140,255,.06),transparent 24%),radial-gradient(rgba(154,204,236,.16) .6px,transparent .75px);background-size:auto,auto,auto,26px 26px}
    button{font:inherit;color:inherit}.shell{position:relative;z-index:1;display:grid;width:100%;height:100%;min-height:0;padding:16px 20px 18px;grid-template-rows:auto auto minmax(0,1fr);gap:13px;overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand__mark{position:relative;display:grid;width:44px;height:44px;flex:0 0 auto;place-items:center;border:1px solid var(--line-strong);border-radius:13px;background:linear-gradient(145deg,#173248,#08131e);box-shadow:inset 0 1px rgba(255,255,255,.07),0 10px 26px rgba(0,8,18,.28)}.brand__mark:before{width:18px;height:22px;border:2px solid var(--cyan);border-radius:10px 10px 13px 13px;clip-path:polygon(50% 0,100% 21%,90% 74%,50% 100%,10% 74%,0 21%);content:"";filter:drop-shadow(0 0 8px rgba(55,212,221,.42))}.brand h1{margin:0;font-size:24px;font-weight:760;letter-spacing:-.025em}.brand p{margin:4px 0 0;color:var(--muted);font-size:11px;letter-spacing:.08em}.header__right{display:flex;align-items:center;gap:12px}.status{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,20,31,.82);color:var(--muted);font-size:11px;white-space:nowrap}.status i{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(255,180,77,.08)}.status.ok i{background:var(--green);box-shadow:0 0 0 4px rgba(56,217,150,.08)}.status.error i{background:var(--red);box-shadow:0 0 0 4px rgba(255,103,120,.08)}.clock{text-align:right;min-width:120px}.clock strong{display:block;font:650 17px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.04em}.clock span{display:block;margin-top:5px;color:var(--dim);font-size:10px}.refresh{display:grid;width:40px;height:40px;place-items:center;border:1px solid var(--line);border-radius:11px;background:rgba(10,22,34,.88);color:var(--muted);cursor:pointer;transition:.18s ease}.refresh:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2)}.refresh.loading{animation:spin 1s linear infinite;color:var(--cyan)}@keyframes spin{to{transform:rotate(360deg)}}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{position:relative;overflow:hidden;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(150deg,rgba(14,30,44,.96),rgba(7,17,26,.95));box-shadow:var(--shadow)}.kpi:after{position:absolute;right:-24px;top:-34px;width:110px;height:110px;border-radius:50%;content:"";background:radial-gradient(circle,var(--tone),transparent 68%);opacity:.12}.kpi__label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em}.kpi__label i{width:6px;height:6px;border-radius:50%;background:var(--tone);box-shadow:0 0 10px var(--tone)}.kpi strong{display:block;margin-top:7px;font-size:30px;line-height:1;font-weight:760;letter-spacing:-.045em}.kpi small{display:block;margin-top:8px;color:var(--dim);font-size:10px}.kpi[data-state=stale] strong{opacity:.55}.kpi[data-state=unavailable] strong{color:var(--dim)}
    .layout{display:grid;min-height:0;grid-template-columns:minmax(0,1.45fr) minmax(320px,.85fr);grid-template-rows:minmax(0,1.05fr) minmax(0,.95fr);gap:13px}.panel{display:flex;min-height:0;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(150deg,rgba(11,25,38,.96),rgba(7,16,25,.96));box-shadow:var(--shadow)}.panel__head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex:0 0 auto}.panel__head h2{margin:0;font-size:14px;font-weight:680;letter-spacing:.01em}.panel__head span{color:var(--dim);font-size:10px}.panel__body{min-height:0;flex:1;padding:0 16px 14px;overflow:auto}.panel--types{grid-column:1;grid-row:1}.panel--severity{grid-column:2;grid-row:1}.panel--trend{grid-column:1;grid-row:2}.panel--recent{grid-column:2;grid-row:2}
    .type-grid{display:grid;height:100%;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}.type-card{position:relative;display:flex;min-height:0;flex-direction:column;justify-content:space-between;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(150deg,rgba(16,34,49,.8),rgba(8,19,29,.75));text-align:left;cursor:pointer;transition:.18s ease}.type-card:hover{border-color:var(--line-strong);transform:translateY(-2px);background:linear-gradient(150deg,rgba(22,45,64,.9),rgba(9,21,32,.88))}.type-card:before{position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;content:"";background:var(--tone);box-shadow:0 0 12px var(--tone)}.type-card__top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.type-card__dot{width:7px;height:7px;border-radius:50%;background:var(--tone)}.type-card strong{font-size:27px;line-height:1;font-weight:740;letter-spacing:-.04em}.type-card small{color:var(--dim);font-size:10px}.type-card[data-state=stale] strong{opacity:.55}
    .bars{display:flex;height:100%;min-height:0;flex-direction:column;gap:12px;justify-content:center}.bar-row{display:grid;grid-template-columns:62px minmax(0,1fr) 48px;align-items:center;gap:9px;font-size:11px}.bar-row__label{overflow:hidden;color:var(--muted);text-overflow:ellipsis;white-space:nowrap}.bar-row__track{height:8px;overflow:hidden;border-radius:99px;background:rgba(139,180,207,.09)}.bar-row__fill{height:100%;min-width:2px;border-radius:99px;background:var(--tone);box-shadow:0 0 12px var(--tone);transition:width .5s ease}.bar-row__value{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}.empty{display:grid;height:100%;place-items:center;color:var(--dim);font-size:11px;text-align:center}
    .canvas-wrap{position:relative;height:100%;min-height:100px}.canvas-wrap canvas{display:block;width:100%;height:100%}.trend-legend{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;padding-top:6px}.recent{display:flex;flex-direction:column;gap:7px}.event{display:grid;width:100%;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(13,28,41,.72);text-align:left;cursor:pointer;transition:.18s ease}.event:hover{border-color:var(--line-strong);background:rgba(20,40,57,.82)}.event time{color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}.event__main{min-width:0}.event__name{overflow:hidden;font-size:11px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.event__meta{overflow:hidden;margin-top:3px;color:var(--dim);font-size:9px;text-overflow:ellipsis;white-space:nowrap}.event__level{padding:3px 7px;border-radius:99px;background:rgba(255,103,120,.1);color:var(--red);font-size:9px;text-transform:uppercase}
    .footer-note{display:flex;justify-content:space-between;gap:10px;color:var(--dim);font-size:9px;padding:0 2px}.toast{position:fixed;left:50%;bottom:22px;z-index:20;padding:9px 14px;border:1px solid var(--line-strong);border-radius:9px;background:#102333;color:var(--text);font-size:11px;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:.2s ease}.toast.visible{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1100px){.layout{grid-template-columns:1fr;grid-template-rows:auto;overflow:auto}.panel{min-height:280px}.type-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(84px,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-height:720px){.shell{padding:12px 16px 14px;gap:9px}.brand h1{font-size:20px}.kpi{padding:10px 13px}.kpi strong{font-size:24px}.panel__head{padding:10px 13px 7px}.panel__body{padding:0 13px 10px}.type-card{padding:9px 11px}.type-card strong{font-size:22px}.event{padding:7px 9px}}
  </style>
</head>
<body>
  <div class="shell" id="screen">
    <header>
      <div class="brand">
        <div class="brand__mark"></div>
        <div><h1>SecGate 3600 NSG 防火墙态势</h1><p>奇安信网神 · SYSLOG 安全事件总览</p></div>
      </div>
      <div class="header__right">
        <div class="status" id="status"><i></i><span id="statusText">正在连接数据 API</span></div>
        <div class="clock"><strong id="clock">--:--:--</strong><span id="date">----</span></div>
        <button class="refresh" id="refresh" type="button" title="立即刷新" aria-label="立即刷新">↻</button>
      </div>
    </header>

    <section class="kpis">
      <article class="kpi" style="--tone:var(--blue)"><div class="kpi__label"><i></i>今日事件</div><strong id="eventsToday">—</strong><small>八类结构化日志合计</small></article>
      <article class="kpi" style="--tone:var(--cyan)"><div class="kpi__label"><i></i>累计事件</div><strong id="eventsTotal">—</strong><small>按当前 ClickHouse 留存统计</small></article>
      <article class="kpi" style="--tone:var(--orange)"><div class="kpi__label"><i></i>今日威胁</div><strong id="threatsToday">—</strong><small>threat 类型事件</small></article>
      <article class="kpi" style="--tone:var(--red)"><div class="kpi__label"><i></i>高危威胁</div><strong id="highThreats">—</strong><small>今日 threat_severity=high</small></article>
    </section>

    <main class="layout">
      <section class="panel panel--types">
        <div class="panel__head"><h2>事件类型</h2><span>点击进入对应日志清单</span></div>
        <div class="panel__body"><div class="type-grid" id="typeGrid"></div></div>
      </section>

      <section class="panel panel--severity">
        <div class="panel__head"><h2>威胁等级</h2><span>今日</span></div>
        <div class="panel__body"><div class="bars" id="severityBars"></div></div>
      </section>

      <section class="panel panel--trend">
        <div class="panel__head"><h2>近 7 日事件趋势</h2><span>八类日志合计</span></div>
        <div class="panel__body"><div class="canvas-wrap"><canvas id="trendCanvas"></canvas></div><div class="trend-legend"><span id="trendStart">—</span><span id="trendEnd">—</span></div></div>
      </section>

      <section class="panel panel--recent">
        <div class="panel__head"><h2>最近威胁事件</h2><span>点击查看详情</span></div>
        <div class="panel__body"><div class="recent" id="recentList"></div></div>
      </section>
    </main>
    <div class="footer-note"><span>数据来自 ZenVis 实体查询 API；未建模日志不进入本看板。</span><span id="updated">尚未更新</span></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (function(){
    'use strict';
    var PACKAGE='com.coolxer.plugin.secgate3600';
    var REFRESH_SECONDS=60;
    var TYPES=[
      {entity:'secgate3600_nsg_traffic_event',label:'流量会话',page:'nsg-traffic',tone:'var(--blue)'},
      {entity:'secgate3600_nsg_dns_event',label:'DNS 解析',page:'nsg-dns',tone:'var(--cyan)'},
      {entity:'secgate3600_nsg_self_end_flow_event',label:'本机终结',page:'nsg-self-end',tone:'var(--violet)'},
      {entity:'secgate3600_nsg_threat_event',label:'威胁事件',page:'nsg-threat',tone:'var(--red)'},
      {entity:'secgate3600_nsg_system_alert_event',label:'系统告警',page:'nsg-system-alert',tone:'var(--orange)'},
      {entity:'secgate3600_nsg_system_upgrade_event',label:'系统升级',page:'nsg-system-upgrade',tone:'var(--green)'},
      {entity:'secgate3600_nsg_system_restore_event',label:'配置恢复',page:'nsg-system-restore',tone:'var(--blue)'},
      {entity:'secgate3600_nsg_system_admin_event',label:'管理员事件',page:'nsg-system-admin',tone:'var(--violet)'}
    ];
    var state={root:'',loading:false,counts:{},severity:[],trend:[],events:[],timer:0,countdown:REFRESH_SECONDS,trendVisible:false};
    function el(id){return document.getElementById(id);}
    function n(value){var number=Number(value);return Number.isFinite(number)?number:0;}
    function fmt(value){return new Intl.NumberFormat('zh-CN').format(n(value));}
    function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
    function rows(data){return data&&data.result&&Array.isArray(data.result.rows)?data.result.rows:[];}
    function apiRoots(){var preferred=location.pathname.indexOf('/zenvis/')===0?['/zenvis/api/v1','/api/v1']:['/api/v1','/zenvis/api/v1'];return state.root?[state.root].concat(preferred.filter(function(root){return root!==state.root;})):preferred;}
    function requestJson(path,options){var lastError=new Error('数据 API 不可用');var roots=apiRoots();return (async function(){for(var i=0;i<roots.length;i+=1){var root=roots[i];try{var config=Object.assign({credentials:'include',cache:'no-store',headers:{Accept:'application/json'}},options||{});if(config.body)config.headers=Object.assign({},config.headers,{'Content-Type':'application/json'});var response=await fetch(root+path,config);if(!response.ok||(response.headers.get('content-type')||'').indexOf('application/json')<0)throw new Error('HTTP '+response.status);var payload=await response.json();if(payload.status!==0)throw new Error(payload.msg||'业务状态 '+payload.status);state.root=root;return payload.data||{};}catch(error){lastError=error;}}throw lastError;})();}
    function post(path,body){return requestJson('/entity'+path,{method:'POST',body:JSON.stringify(body)});}
    function updateClock(){var now=new Date();el('clock').textContent=now.toLocaleTimeString('zh-CN',{hour12:false});el('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});}
    function showToast(message){var toast=el('toast');toast.textContent=message;toast.classList.add('visible');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){toast.classList.remove('visible');},1700);}
    function navigate(to){showToast('正在打开对应模块…');if(window.parent!==window)window.parent.postMessage({type:'zenvis:navigate',to:to},window.location.origin);else window.location.href='/'+'#'+to;}
    function navigateApp(page){navigate('/service/low-code-app/'+PACKAGE+'.app?page='+encodeURIComponent(page));}
    function navigateDetail(id){if(id)navigate('/service/low-code-page/'+PACKAGE+'.detail-nsg-threat?record_id='+encodeURIComponent(id));else navigateApp('nsg-threat');}
    function renderTypes(){el('typeGrid').innerHTML=TYPES.map(function(type){var count=state.counts[type.entity]||{};return '<button class="type-card" data-page="'+type.page+'" style="--tone:'+type.tone+'" type="button"><span class="type-card__top"><span class="type-card__dot"></span><span>'+esc(type.label)+'</span></span><strong>'+fmt(count.all)+'</strong><small>今日 '+fmt(count.today)+'</small></button>';}).join('');Array.prototype.forEach.call(el('typeGrid').querySelectorAll('[data-page]'),function(button){button.addEventListener('click',function(){navigateApp(button.dataset.page);});});}
    function renderMetrics(){var today=0,total=0;TYPES.forEach(function(type){var count=state.counts[type.entity]||{};today+=n(count.today);total+=n(count.all);});el('eventsToday').textContent=fmt(today);el('eventsTotal').textContent=fmt(total);var threat=state.counts.secgate3600_nsg_threat_event||{};el('threatsToday').textContent=fmt(threat.today);var high=state.severity.filter(function(row){var bucket=String(row.bucket||'').toLowerCase();return bucket==='high'||bucket==='critical';}).reduce(function(sum,row){return sum+n(row.value);},0);el('highThreats').textContent=fmt(high);}
    function severityTone(label){var value=String(label||'').toLowerCase();if(value==='high'||value==='critical')return 'var(--red)';if(value==='medium')return 'var(--orange)';if(value==='low')return 'var(--green)';return 'var(--blue)';}
    function renderSeverity(){if(!state.severity.length){el('severityBars').innerHTML='<div class="empty">暂无威胁等级数据</div>';return;}var max=Math.max.apply(null,state.severity.map(function(row){return n(row.value);}).concat([1]));el('severityBars').innerHTML=state.severity.map(function(row){var label=String(row.bucket==null||row.bucket===''?'空值':row.bucket);return '<div class="bar-row"><span class="bar-row__label" title="'+esc(label)+'">'+esc(label)+'</span><span class="bar-row__track"><span class="bar-row__fill" style="width:'+Math.max(2,n(row.value)/max*100)+'%;--tone:'+severityTone(label)+'"></span></span><span class="bar-row__value">'+fmt(row.value)+'</span></div>';}).join('');}
    function renderRecent(){if(!state.events.length){el('recentList').innerHTML='<div class="empty">暂无威胁事件</div>';return;}el('recentList').innerHTML=state.events.map(function(event){var level=event.threat_severity||event.severity||'-';var endpoints=(event.addr_src||'-')+' → '+(event.addr_dst||'-');var name=event.threat_name||event.threat_type||'未命名威胁';return '<button class="event" data-id="'+esc(event.zenvis_id||'')+'" type="button"><time>'+esc(event.time||'-')+'</time><span class="event__main"><span class="event__name">'+esc(name)+'</span><span class="event__meta">'+esc(endpoints)+' · '+esc(event.action||'-')+'</span></span><span class="event__level">'+esc(level)+'</span></button>';}).join('');Array.prototype.forEach.call(el('recentList').querySelectorAll('[data-id]'),function(button){button.addEventListener('click',function(){navigateDetail(button.dataset.id);});});}
    function aggregateTrend(){var sums={};state.trend.forEach(function(row){var bucket=String(row.bucket||'');if(!bucket)return;sums[bucket]=(sums[bucket]||0)+n(row.value);});state.trend=Object.keys(sums).sort().map(function(bucket){return {bucket:bucket,value:sums[bucket]};});}
    function drawTrend(){var canvas=el('trendCanvas');if(!canvas)return;var rect=canvas.getBoundingClientRect();if(rect.width<10||rect.height<10)return;var ratio=Math.min(2.5,window.devicePixelRatio||1);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);var ctx=canvas.getContext('2d');if(!ctx)return;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,rect.width,rect.height);var values=state.trend.map(function(row){return n(row.value);});var max=Math.max.apply(null,values.concat([1]));var pad={l:8,r:8,t:14,b:20};ctx.strokeStyle='rgba(135,180,210,.12)';ctx.lineWidth=1;for(var line=0;line<4;line+=1){var y=pad.t+(rect.height-pad.t-pad.b)*line/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(rect.width-pad.r,y);ctx.stroke();}if(!values.length){ctx.fillStyle='#6b8293';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('暂无趋势数据',rect.width/2,rect.height/2);return;}var points=values.map(function(value,index){return {x:values.length===1?rect.width/2:pad.l+(rect.width-pad.l-pad.r)*index/(values.length-1),y:pad.t+(rect.height-pad.t-pad.b)*(1-value/max)};});var gradient=ctx.createLinearGradient(0,pad.t,0,rect.height-pad.b);gradient.addColorStop(0,'rgba(73,168,255,.28)');gradient.addColorStop(1,'rgba(73,168,255,0)');ctx.beginPath();ctx.moveTo(points[0].x,rect.height-pad.b);points.forEach(function(point){ctx.lineTo(point.x,point.y);});ctx.lineTo(points[points.length-1].x,rect.height-pad.b);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();points.forEach(function(point,index){if(index===0)ctx.moveTo(point.x,point.y);else ctx.lineTo(point.x,point.y);});ctx.strokeStyle='#49a8ff';ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();points.forEach(function(point,index){ctx.beginPath();ctx.arc(point.x,point.y,index===points.length-1?3.2:1.8,0,Math.PI*2);ctx.fillStyle=index===points.length-1?'#37d4dd':'#49a8ff';ctx.fill();});el('trendStart').textContent=state.trend.length?state.trend[0].bucket:'—';el('trendEnd').textContent=state.trend.length?state.trend[state.trend.length-1].bucket:'—';}
    function setStatus(kind,text){el('status').className='status'+(kind?' '+kind:'');el('statusText').textContent=text;}
    async function load(silent){if(state.loading)return;state.loading=true;state.countdown=REFRESH_SECONDS;el('refresh').classList.add('loading');var tasks=[['overview',post('/overview/query',{entities:TYPES.map(function(type){return type.entity;}),time_range:{preset:'TODAY'},comparison:'PREVIOUS_PERIOD'})],['severity',post('/distribution/query',{entity:'secgate3600_nsg_threat_event',dimension:'threat_severity',time_range:{preset:'TODAY'},limit:20,include_null:false})],['trend',post('/trend/query',{entities:TYPES.map(function(type){return type.entity;}),time_range:{preset:'LAST_7_DAYS'},granularity:'DAY'})],['recent',requestJson('/entity/secgate3600_nsg_threat_event/list?page=1&perPage=8&orderBy=time&orderDir=desc')]];var settled=await Promise.allSettled(tasks.map(function(task){return task[1];}));var result={},failures=[];settled.forEach(function(item,index){if(item.status==='fulfilled')result[tasks[index][0]]=item.value;else failures.push(tasks[index][0]);});if(result.overview){state.counts={};rows(result.overview).forEach(function(row){state.counts[row.entity]={all:n(row.all_time_count),today:n(row.current_value)};});}if(result.severity)state.severity=rows(result.severity).map(function(row){return {bucket:row.bucket,value:n(row.value)};});if(result.trend){state.trend=rows(result.trend);aggregateTrend();}if(result.recent)state.events=rows(result.recent);renderTypes();renderMetrics();renderSeverity();renderRecent();requestAnimationFrame(drawTrend);var succeeded=4-failures.length;if(succeeded===4)setStatus('ok','数据 API 已连接');else if(succeeded>0)setStatus('','部分模块不可用 · '+failures.length);else setStatus('error','数据 API 连接异常');if(succeeded&&result.overview)el('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});if(failures.length&&!silent)showToast('部分数据暂不可用：'+failures.join('、'));state.loading=false;el('refresh').classList.remove('loading');}
    el('refresh').addEventListener('click',function(){load(false);});window.addEventListener('resize',function(){requestAnimationFrame(drawTrend);});
    updateClock();setInterval(updateClock,1000);renderTypes();load(true);state.timer=setInterval(function(){state.countdown-=1;if(state.countdown<=0)load(true);},1000);
  })();
