# ZenVis Prometheus Exporter 集合容器（独立运行）
#
# 前置条件：ZenVis 主栈已通过 `./zenvisctl compose up` 启动，
# 以便容器能通过 zenvis_zenvis-network 解析 mysql-service / redis-service /
# redis-stack-service / kafka-service 等主机名。
#
# 用法：
#   cp .env.example .env   # 按需填写密码
#   docker compose up -d
#
# 如需与 ZenVis 主栈一起编排，请使用 docker-compose.override.example.yml。

services:
  zenvis-service-exporters:
    image: ${ZENVIS_IMAGE_REGISTRY:-crpi-4pdi7kz96g4v0tg3.cn-beijing.personal.cr.aliyuncs.com/coolxer-studio}/zenvis-service-exporters:${EXPORTERS_VERSION:-latest}-${ARCH:-amd64}
    container_name: zenvis-service-exporters
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: ${MYSQL_HOST:-mysql-service}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:-root}
      # 未显式提供 MYSQL_EXPORTER_PASSWORD 时回退到 root 密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-redis-service}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}
    ports:
      - "${EXPORTERS_BIND_ADDRESS:-127.0.0.1}:9104:9104"
      - "${EXPORTERS_BIND_ADDRESS:-127.0.0.1}:9121:9121"
      - "${EXPORTERS_BIND_ADDRESS:-127.0.0.1}:9308:9308"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - zenvis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/zenvis-exporters/supervisord.conf status >/dev/null 2>&1 && ! supervisorctl -c /etc/zenvis-exporters/supervisord.conf status | grep -Eq 'FATAL|BACKOFF|EXITED|STOPPED'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

networks:
  zenvis-network:
    external: true
    name: ${ZENVIS_NETWORK_NAME:-zenvis_zenvis-network}
