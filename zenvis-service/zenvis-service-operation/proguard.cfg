#入口程序类不能混淆，混淆会导致springboot启动不了
-keep class com.coolxer.operation.Application {
        public static void main(java.lang.String[]);
     }

# 本项目的特定混淆策略
-keep class com.coolxer.operation.commons.exception.ApiException
-keep class com.coolxer.operation.configuration.*
-keep class com.coolxer.operation.model.** {*;}