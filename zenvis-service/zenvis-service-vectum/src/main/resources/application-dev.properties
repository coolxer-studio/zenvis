# Development Environment Configuration
server.port=11002
# Task Execution Pool Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=30
# Vector Configuration
vector.home=vector/vector
task.workspace=workspace
task.file=${task.workspace}/tasks.json
# Auth Configuration
vectum.auth.enabled=true
vectum.auth.token=sk-vectum-token
# MCP Server Configuration
spring.ai.mcp.server.name=vectum-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=This server provides task management tools for vectum
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Zenvis Business Service Configuration
zenvis.business-service.enabled=${ZENVIS_BUSINESS_SERVICE_ENABLED:true}
zenvis.business-service.base-url=${ZENVIS_BUSINESS_SERVICE_BASE_URL:http://localhost:11001}
zenvis.business-service.service-code=${ZENVIS_BUSINESS_SERVICE_SERVICE_CODE:vectum}
zenvis.business-service.service-name=${ZENVIS_BUSINESS_SERVICE_SERVICE_NAME:Vectum}
zenvis.business-service.management-url=${ZENVIS_BUSINESS_SERVICE_MANAGEMENT_URL:http://localhost:11002/actuator/health}
zenvis.business-service.heartbeat-interval-millis=${ZENVIS_BUSINESS_SERVICE_HEARTBEAT_INTERVAL_MILLIS:30000}
zenvis.business-service.connect-timeout-millis=${ZENVIS_BUSINESS_SERVICE_CONNECT_TIMEOUT_MILLIS:2000}
zenvis.business-service.read-timeout-millis=${ZENVIS_BUSINESS_SERVICE_READ_TIMEOUT_MILLIS:3000}
zenvis.business-service.event-queue-capacity=${ZENVIS_BUSINESS_SERVICE_EVENT_QUEUE_CAPACITY:100}
zenvis.business-service.metadata.component=data-pipeline-manager
zenvis.business-service.metadata.capabilities=vector,rest,mcp
